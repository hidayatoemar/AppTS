---
- name: Inspect independent RESTORE_SERVICE non-production target
  hosts: independent
  become: true
  gather_facts: false
  vars:
    appts_compose_dir: /opt/appts-independent-restore-service/deploy/compose
  tasks:
    - name: Read health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
        method: GET
        status_code: 200
        return_content: true
      register: healthz

    - name: Read readiness endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/readyz
        method: GET
        status_code: 200
        return_content: true
      register: readyz

    - name: Confirm browser root HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        method: GET
        status_code: 200
        return_content: false
      register: root_http

    - name: Probe API prefix without inventing a route
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api
        method: GET
        status_code: 404
        return_content: true
      register: api_probe

    - name: Capture Compose status
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - ps
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: compose_ps

    - name: Capture bounded API log tail
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - logs
          - --no-color
          - --tail
          - "100"
          - api
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: api_logs

    - name: Capture PostgreSQL identity read-only
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - exec
          - -T
          - postgres
          - sh
          - -c
          - >-
            psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc
            "SELECT version(); SELECT current_database(); SELECT current_user;"
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: postgres_identity

    - name: Count non-system PostgreSQL tables read-only
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - exec
          - -T
          - postgres
          - sh
          - -c
          - >-
            psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc
            "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema');"
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: postgres_table_count

    - name: List non-system PostgreSQL tables read-only
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - exec
          - -T
          - postgres
          - sh
          - -c
          - >-
            psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc
            "SELECT schemaname || '.' || tablename FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') ORDER BY schemaname, tablename;"
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: postgres_tables

    - name: Report status evidence
      ansible.builtin.debug:
        msg:
          - "healthz={{ healthz.content }}"
          - "readyz={{ readyz.content }}"
          - "root_http_status={{ root_http.status }}"
          - "api_probe_status={{ api_probe.status }}"
          - "api_probe_content={{ api_probe.content }}"
          - "compose_ps={{ compose_ps.stdout_lines }}"
          - "api_logs={{ api_logs.stdout_lines }}"
          - "postgres_identity={{ postgres_identity.stdout_lines }}"
          - "postgres_non_system_table_count={{ postgres_table_count.stdout }}"
          - "postgres_non_system_tables={{ postgres_tables.stdout_lines }}"
