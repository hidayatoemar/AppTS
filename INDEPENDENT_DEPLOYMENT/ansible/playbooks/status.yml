---
- name: Inspect independent RESTORE_SERVICE non-production target
  hosts: independent
  become: true
  gather_facts: false
  vars:
    appts_compose_dir: /opt/appts-independent-restore-service/deploy/compose
  tasks:
    - name: Read health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
        method: GET
        status_code: 200
        return_content: true
      register: healthz

    - name: Read readiness endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/readyz
        method: GET
        status_code: 200
        return_content: true
      register: readyz

    - name: Capture browser root HTML
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        method: GET
        status_code: 200
        return_content: true
        headers:
          Accept: text/html
      register: root_http

    - name: Probe API prefix without inventing a route
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api
        method: GET
        status_code: 404
        return_content: true
      register: api_probe

    - name: Probe accepted work-queue projection path read-only
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/ui/work-queue
        method: GET
        status_code: [200, 404, 405]
        return_content: true
      register: work_queue_probe

    - name: Probe accepted intake projection path read-only
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/ui/intake
        method: GET
        status_code: [200, 404, 405]
        return_content: true
      register: intake_probe

    - name: Probe accepted intents path with GET only
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/ui/intents
        method: GET
        status_code: [200, 404, 405]
        return_content: true
      register: intents_get_probe

    - name: Capture Compose status
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - ps
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: compose_ps

    - name: Capture bounded API log tail
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - logs
          - --no-color
          - --tail
          - "100"
          - api
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: api_logs

    - name: Capture PostgreSQL identity read-only
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - exec
          - -T
          - postgres
          - sh
          - -c
          - >-
            psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc
            "SELECT version(); SELECT current_database(); SELECT current_user;"
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: postgres_identity

    - name: Capture runtime database role privilege flags read-only
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.yaml
          - --env-file
          - .env
          - exec
          - -T
          - postgres
          - sh
          - -c
          - >-
            psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc
            "SELECT rolname || '|superuser=' || rolsuper || '|createdb=' || rolcreatedb || '|createrole=' || rolcreaterole FROM pg_catalog.pg_roles WHERE rolname = current_user;"
      args:
        chdir: "{{ appts_compose_dir }}"
      changed_when: false
      register: postgres_role_flags

    - name: Report status and UI composition evidence
      ansible.builtin.debug:
        msg:
          - "healthz={{ healthz.content }}"
          - "readyz={{ readyz.content }}"
          - "root_http_status={{ root_http.status }}"
          - "root_contains_server_projection_required={{ 'Current server projection required.' in root_http.content }}"
          - "api_probe_status={{ api_probe.status }}"
          - "work_queue_status={{ work_queue_probe.status }}"
          - "work_queue_content={{ work_queue_probe.content }}"
          - "intake_status={{ intake_probe.status }}"
          - "intake_content={{ intake_probe.content }}"
          - "intents_get_status={{ intents_get_probe.status }}"
          - "intents_get_content={{ intents_get_probe.content }}"
          - "compose_ps={{ compose_ps.stdout_lines }}"
          - "api_logs={{ api_logs.stdout_lines }}"
          - "postgres_identity={{ postgres_identity.stdout_lines }}"
          - "postgres_role_flags={{ postgres_role_flags.stdout }}"
