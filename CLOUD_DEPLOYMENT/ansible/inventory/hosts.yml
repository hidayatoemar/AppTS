---
# ─────────────────────────────────────────────────────────────────────────────
# Proxmox LXC inventory.
# Replace the placeholder host (192.0.2.10 = documentation range) with your
# LXC's static IP. Set ansible_become=true if you log in as a non-root sudo user.
# ─────────────────────────────────────────────────────────────────────────────
all:
  children:
    appts_lxc:
      hosts:
        lxc-appts-01:
          ansible_host: 192.0.2.10            # TODO: your LXC IP
          ansible_user: root                  # root (default) or your sudo user
          ansible_become: false               # true for a non-root sudo user
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519

      vars:
        # Convenience override point: keep host-specific things here,
        # deployment configuration lives in group_vars/all.yml.
        appts_postgres_db: appts_dep001_cloud
