---
# ─────────────────────────────────────────────────────────────────────────────
# Staging inventory — cloud VPS target.
#
# `appts` → the AlmaLinux 9 cloud VPS that runs the appts staging stack.
#            Ansible connects over SSH as `aditya` (a sudo-capable user) to the
#            public IP below, and escalates to root via sudo (become).
#
# Edit `ansible_ssh_private_key_file` to your key, and set real values in
# group_vars/all/secrets.yml (encrypted with ansible-vault) before deploying.
# ─────────────────────────────────────────────────────────────────────────────
all:
  children:
    appts:
      hosts:
        appts-vps:
          ansible_host: 103.150.226.110      # cloud VPS public IP (AlmaLinux 9)
          ansible_user: aditya               # sudo-capable SSH user
          ansible_become: true               # escalate to root for dnf/systemd
          ansible_become_method: sudo
          ansible_become_user: root
          ansible_ssh_private_key_file: ~/Downloads/appts-key.pem
          ansible_ssh_pass: "{{ vault_ansible_ssh_pass }}"

  vars:
    ansible_python_interpreter: /usr/bin/python3
    env: staging
