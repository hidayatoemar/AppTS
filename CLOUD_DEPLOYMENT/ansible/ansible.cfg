# appts-restore-service DEP-001 staging deployment — control node config
[defaults]
inventory      = inventory/hosts.yml

# Adjust to your LXC access (root by default on Proxmox LXC; see hosts.yml).
remote_user    = root
host_key_checking = False

# Project roles live at CLOUD_DEPLOYMENT/ansible/roles (relative to this file).
roles_path     = roles

# Quiet, readable output for long provisioning runs.
stdout_callback = yaml

# Never fall back to a per-host python interpreter magic the LXC cannot satisfy.
interpreter_python = auto_silent

[privilege_escalation]
# Login as root → no escalation. For a non-root sudo user, set ansible_become=true
# in inventory/hosts.yml and make sure sudo is installed on the LXC.
become_method = sudo
become_user = root
