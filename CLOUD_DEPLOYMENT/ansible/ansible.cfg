# appts-restore-service DEP-001 staging deployment — control node config
[defaults]
inventory      = inventory/staging/hosts.yml

# SSH user on the cloud VPS (sudo-capable; escalation via become). Also set in
# inventory/staging/hosts.yml — keep them in sync.
remote_user    = aditya
host_key_checking = False

# Project roles live at CLOUD_DEPLOYMENT/ansible/roles (relative to this file).
roles_path     = roles

# Quiet, readable output for long provisioning runs.
# (The community.general `yaml` callback was removed in community.general 12.0.0;
#  use the built-in default callback with result_format=yaml instead.)
stdout_callback = ansible.builtin.default
result_format = yaml

# Never fall back to a per-host python interpreter magic the LXC cannot satisfy.
interpreter_python = auto_silent

[privilege_escalation]
# Non-root SSH user (aditya) → escalate via sudo to root. The host in
# inventory/staging/hosts.yml sets ansible_become=true; aditya needs sudo.
become_method = sudo
become_user = root
