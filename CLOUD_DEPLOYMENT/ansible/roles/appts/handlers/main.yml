---
# Handler restarts the compose stack when the synced workspace or the rendered
# environment file changes.
- name: restart appts stack
  community.docker.docker_compose_v2:
    project_src: "{{ appts_install_dir }}/deploy/compose"
    files:
      - compose.yaml
    env_files:
      - "{{ appts_install_dir }}/deploy/compose/.env"
    state: restarted
