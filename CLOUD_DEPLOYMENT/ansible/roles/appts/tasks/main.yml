---
# ─────────────────────────────────────────────────────────────────────────────
# role: appts — copy the DEP-001 workspace to the host, render the compose
# environment, build and start the stack, and wait for the API health check.
# ─────────────────────────────────────────────────────────────────────────────

- name: Create appts system group
  ansible.builtin.group:
    name: "{{ appts_group }}"
    system: true

- name: Create appts system user
  ansible.builtin.user:
    name: "{{ appts_user }}"
    group: "{{ appts_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Create install directory
  ansible.builtin.file:
    path: "{{ appts_install_dir }}"
    state: directory
    owner: "{{ appts_user }}"
    group: "{{ appts_group }}"
    mode: "0750"

- name: Synchronize DEP-001 workspace to target
  ansible.posix.synchronize:
    src: "{{ appts_src_dir }}/"
    dest: "{{ appts_install_dir }}/"
    delete: true
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=**/node_modules"
      - "--exclude=**/dist"
      - "--exclude=**/.tsbuildinfo"
      - "--exclude=.git"
      - "--exclude=deploy/compose/.env"
      - "--exclude=deploy/db/.env.*"
      - "--exclude=*.log"
      - "--chmod=D0750,F0640"
  notify: restart appts stack

- name: Render compose environment file
  ansible.builtin.template:
    src: appts-compose.env.j2
    dest: "{{ appts_install_dir }}/deploy/compose/.env"
    owner: "{{ appts_user }}"
    group: "{{ appts_group }}"
    mode: "0600"
  notify: restart appts stack

- name: Build and start the appts compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ appts_install_dir }}/deploy/compose"
    files:
      - compose.yaml
    env_files:
      - "{{ appts_install_dir }}/deploy/compose/.env"
    build: always
    pull: missing
    state: present
    wait: true
    wait_timeout: 300

- name: Wait for API health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ appts_api_port }}/healthz"
    status_code:
      - 200
  register: appts_health
  until: appts_health.status == 200
  retries: 30
  delay: 2

- name: Collect compose stack status
  ansible.builtin.command:
    cmd: docker compose -f compose.yaml --env-file .env ps
    chdir: "{{ appts_install_dir }}/deploy/compose"
  register: appts_ps
  changed_when: false

- name: Report stack status
  ansible.builtin.debug:
    var: appts_ps.stdout
