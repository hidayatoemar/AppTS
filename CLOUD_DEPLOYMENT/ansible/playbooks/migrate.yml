---
# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL — G7 DB verification lane (staging only).
#
# Runs the DEP-001 DB tooling against a DISPOSABLE PostgreSQL inside its own
# isolated Compose lane (deploy/db/compose.g7.yaml), NOT the app stack's
# postgres:
#   bootstrap-roles.sh  → admin/migration/runtime roles + appts_dep001_* DB
#   migrate.sh          → frozen V001–V004 migrations (migration role) + schema-freeze check
#   3 verifier .sql     → constraints / history-inbox-outbox / diagnostics
#   backup.sh           → checkpoint backup
#   restore.sh          → drop/recreate + pg_restore (rollback drill)
#   3 verifier .sql     → re-verified after restore
#
# NOTE — grant-runtime.sh is intentionally NOT run (HELD project item), and
# this lane provisions its own disposable database. Wiring the runtime API to
# a migrated database is HELD project work and does not exist in this package.
#
# Run:
#   ansible-playbook playbooks/migrate.yml --ask-vault-pass
# ─────────────────────────────────────────────────────────────────────────────
- name: Run the G7 DB verification lane
  hosts: appts
  gather_facts: false
  vars:
    appts_g7_env_file: "{{ appts_install_dir }}/deploy/db/.env.g7"
  tasks:
    - name: Render G7 environment file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/appts/templates/appts-g7.env.j2"
        dest: "{{ appts_g7_env_file }}"
        mode: "0600"

    - name: Ensure a fresh disposable DB lane (tear down any leftover)
      ansible.builtin.command:
        cmd: docker compose --env-file .env.g7 -f compose.g7.yaml down --remove-orphans -v
        chdir: "{{ appts_install_dir }}/deploy/db"
      changed_when: false

    - name: Start isolated postgres + db-tools lane
      ansible.builtin.command:
        cmd: docker compose --env-file .env.g7 -f compose.g7.yaml up -d --build
        chdir: "{{ appts_install_dir }}/deploy/db"

    - name: Bootstrap roles and disposable database
      ansible.builtin.command:
        cmd: docker compose --env-file .env.g7 -f compose.g7.yaml exec -T db-tools sh /workspace/deploy/db/bootstrap-roles.sh
        chdir: "{{ appts_install_dir }}/deploy/db"

    - name: Apply frozen V001–V004 migrations (migration role)
      ansible.builtin.command:
        cmd: docker compose --env-file .env.g7 -f compose.g7.yaml exec -T db-tools sh /workspace/deploy/db/migrate.sh
        chdir: "{{ appts_install_dir }}/deploy/db"

    - name: Run verifier SQL scripts
      ansible.builtin.command:
        cmd: "docker compose --env-file .env.g7 -f compose.g7.yaml exec -T db-tools psql -X -v ON_ERROR_STOP=1 --file=/workspace/db/verify/{{ item }}"
        chdir: "{{ appts_install_dir }}/deploy/db"
      loop:
        - 001_cf01_constraints.sql
        - 002_cf01_history_inbox_outbox.sql
        - 003_dg04_diagnostics.sql

    - name: Create checkpoint backup
      ansible.builtin.command:
        cmd: docker compose --env-file .env.g7 -f compose.g7.yaml exec -T db-tools sh /workspace/deploy/db/backup.sh
        chdir: "{{ appts_install_dir }}/deploy/db"

    - name: Exercise restore-based rollback on the disposable database
      ansible.builtin.command:
        cmd: docker compose --env-file .env.g7 -f compose.g7.yaml exec -T db-tools sh /workspace/deploy/db/restore.sh
        chdir: "{{ appts_install_dir }}/deploy/db"

    - name: Re-run verifier SQL scripts after restore
      ansible.builtin.command:
        cmd: "docker compose --env-file .env.g7 -f compose.g7.yaml exec -T db-tools psql -X -v ON_ERROR_STOP=1 --file=/workspace/db/verify/{{ item }}"
        chdir: "{{ appts_install_dir }}/deploy/db"
      loop:
        - 001_cf01_constraints.sql
        - 002_cf01_history_inbox_outbox.sql
        - 003_dg04_diagnostics.sql

    - name: Tear down the disposable DB lane
      ansible.builtin.command:
        cmd: docker compose --env-file .env.g7 -f compose.g7.yaml down --remove-orphans -v
        chdir: "{{ appts_install_dir }}/deploy/db"

    - name: Report migration lane result
      ansible.builtin.debug:
        msg: "PASS: G7 DB lane completed on the disposable database. grant-runtime.sh intentionally NOT run (HELD)."
