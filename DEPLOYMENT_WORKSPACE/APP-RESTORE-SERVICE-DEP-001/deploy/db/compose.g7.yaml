services:
  postgres:
    image: postgres:17.11-bookworm@sha256:07edf880f0cf3f742c990d23faf92cb19e84923a8bce30f7d8e1a8ab63cae7b3
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${APPTS_ADMIN_DB:?APPTS_ADMIN_DB is required}
      POSTGRES_USER: ${APPTS_ADMIN_USER:?APPTS_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${APPTS_ADMIN_PASSWORD:?APPTS_ADMIN_PASSWORD is required}
      PGPORT: ${PGPORT:?PGPORT is required}
    command: ["postgres", "-p", "${PGPORT:?PGPORT is required}"]
    networks:
      - g7_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $${PGPORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-tools:
    build:
      context: ../..
      dockerfile: deploy/db/Dockerfile.tools
      additional_contexts:
        dep_db: .
        dep_migrations: ../../db/migrations
        dep_verify: ../../db/verify
        dep_fixtures: ../../db/fixtures
        dep_tools: ../../tools
    platform: linux/amd64
    user: postgres
    working_dir: /workspace
    environment:
      APPTS_DB_NETWORK_MODE: ${APPTS_DB_NETWORK_MODE:?APPTS_DB_NETWORK_MODE is required}
      APPTS_STAGING_LABEL: ${APPTS_STAGING_LABEL:?APPTS_STAGING_LABEL is required}
      APPTS_DISPOSABLE_DATABASE: ${APPTS_DISPOSABLE_DATABASE:?APPTS_DISPOSABLE_DATABASE is required}
      APPTS_DB_NAME: ${APPTS_DB_NAME:?APPTS_DB_NAME is required}
      APPTS_ADMIN_DB: ${APPTS_ADMIN_DB:?APPTS_ADMIN_DB is required}
      APPTS_ADMIN_USER: ${APPTS_ADMIN_USER:?APPTS_ADMIN_USER is required}
      APPTS_ADMIN_PASSWORD: ${APPTS_ADMIN_PASSWORD:?APPTS_ADMIN_PASSWORD is required}
      APPTS_MIGRATION_ROLE: ${APPTS_MIGRATION_ROLE:?APPTS_MIGRATION_ROLE is required}
      APPTS_MIGRATION_PASSWORD: ${APPTS_MIGRATION_PASSWORD:?APPTS_MIGRATION_PASSWORD is required}
      APPTS_RUNTIME_ROLE: ${APPTS_RUNTIME_ROLE:?APPTS_RUNTIME_ROLE is required}
      APPTS_RUNTIME_PASSWORD: ${APPTS_RUNTIME_PASSWORD:?APPTS_RUNTIME_PASSWORD is required}
      APPTS_BACKUP_FILE: ${APPTS_BACKUP_FILE:?APPTS_BACKUP_FILE is required}
      APPTS_RESTORE_CONFIRM: ${APPTS_RESTORE_CONFIRM:?APPTS_RESTORE_CONFIRM is required}
      PGHOST: postgres
      PGPORT: ${PGPORT:?PGPORT is required}
      PGTZ: UTC
      PGDATABASE: ${APPTS_DB_NAME:?APPTS_DB_NAME is required}
      PGUSER: ${APPTS_MIGRATION_ROLE:?APPTS_MIGRATION_ROLE is required}
      PGPASSWORD: ${APPTS_MIGRATION_PASSWORD:?APPTS_MIGRATION_PASSWORD is required}
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - g7_internal

networks:
  g7_internal:
    internal: true
