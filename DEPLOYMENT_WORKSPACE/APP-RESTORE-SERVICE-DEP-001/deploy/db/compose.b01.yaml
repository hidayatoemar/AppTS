# Gate B: CF06-B01 disposable migration gate (MCR-to-BUILDER-008 §2.B)
#
# LINUX / WSL2 ONLY — network_mode: host is not supported on Windows/macOS Docker Desktop.
# The loopback isolation check in b01-db-verify.mjs (FLYWAY_URL must be 127.0.0.1/::1/localhost)
# requires the gate runner to share the host network.
#
# Usage (from DEP-001 workspace root):
#   cp deploy/db/.env.b01.template deploy/db/.env.b01
#   # fill APPTS_B01_ADMIN_PASSWORD in .env.b01
#   docker compose -f deploy/db/compose.b01.yaml --env-file deploy/db/.env.b01 \
#     up --build --abort-on-container-exit

services:
  b01-pg:
    image: postgres:17.11-bookworm@sha256:07edf880f0cf3f742c990d23faf92cb19e84923a8bce30f7d8e1a8ab63cae7b3
    platform: linux/amd64
    network_mode: host
    environment:
      POSTGRES_USER: ${APPTS_B01_ADMIN_USER:?APPTS_B01_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${APPTS_B01_ADMIN_PASSWORD:?APPTS_B01_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      PGPORT: ${APPTS_B01_PGPORT:-54321}
    command: ["postgres", "-p", "${APPTS_B01_PGPORT:-54321}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${APPTS_B01_PGPORT:-54321} -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 30

  b01-gate:
    build:
      context: ../..
      dockerfile: deploy/db/Dockerfile.b01-gate
    platform: linux/amd64
    network_mode: host
    environment:
      APPTS_B01_DISPOSABLE_DB: "true"
      FLYWAY_URL: "jdbc:postgresql://127.0.0.1:${APPTS_B01_PGPORT:-54321}/${APPTS_B01_DB_NAME:?APPTS_B01_DB_NAME is required}"
      FLYWAY_USER: ${APPTS_B01_ADMIN_USER:?APPTS_B01_ADMIN_USER is required}
      FLYWAY_PASSWORD: ${APPTS_B01_ADMIN_PASSWORD:?APPTS_B01_ADMIN_PASSWORD is required}
      FLYWAY_DEFAULT_SCHEMA: appts_sys
      FLYWAY_SCHEMAS: appts_sys,appts
      FLYWAY_CLEAN_DISABLED: "false"
      FLYWAY_CONNECT_RETRIES: "5"
      PGHOST: "127.0.0.1"
      PGPORT: ${APPTS_B01_PGPORT:-54321}
      PGDATABASE: ${APPTS_B01_DB_NAME:?APPTS_B01_DB_NAME is required}
      PGUSER: ${APPTS_B01_ADMIN_USER:?APPTS_B01_ADMIN_USER is required}
      PGPASSWORD: ${APPTS_B01_ADMIN_PASSWORD:?APPTS_B01_ADMIN_PASSWORD is required}
    depends_on:
      b01-pg:
        condition: service_healthy
