name: Independent RESTORE_SERVICE non-production deployment

on:
  push:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - INDEPENDENT_DEPLOYMENT/REQUEST_ACTION

permissions:
  contents: write
  statuses: write

concurrency:
  group: independent-restore-nonprod
  cancel-in-progress: true

jobs:
  independent-nonprod:
    if: github.ref == 'refs/heads/experiment/independent-restore-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INDEP_POSTGRES_PASSWORD: ${{ secrets.INDEP_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4

      - name: Validate deliberate request token
        shell: bash
        run: |
          set -euo pipefail
          test -f INDEPENDENT_DEPLOYMENT/REQUEST_ACTION || { echo 'BLOCKED: request file absent'; exit 2; }
          request="$(tr -d '\r\n' < INDEPENDENT_DEPLOYMENT/REQUEST_ACTION)"
          read -r confirmation action extra <<< "$request"
          test "$confirmation" = 'INDEPENDENT_NONPROD' || { echo 'BLOCKED: invalid confirmation token'; exit 2; }
          test -z "${extra:-}" || { echo 'BLOCKED: malformed request'; exit 2; }
          case "$action" in
            preflight|deploy|start|status|dbobserve|runtimegrant|teardown) ;;
            *) echo 'BLOCKED: unsupported action'; exit 2 ;;
          esac
          echo "REQUESTED_ACTION=$action" >> "$GITHUB_ENV"
          echo 'REQUEST_VALIDATION=PASS' >> "$GITHUB_ENV"

      - name: Publish active run status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"independent-nonprod\",\"description\":\"${REQUESTED_ACTION} in progress\"}" >/dev/null

      - name: Install Ansible
        run: python3 -m pip install --disable-pip-version-check ansible-core

      - name: Syntax check deployment playbooks without target access
        working-directory: INDEPENDENT_DEPLOYMENT/ansible
        run: |
          printf '[independent]\nlocalhost ansible_connection=local\n' > inventory.ini
          ansible-playbook playbooks/preflight.yml --syntax-check
          ansible-playbook playbooks/deploy.yml --syntax-check
          ansible-playbook playbooks/start.yml --syntax-check
          ansible-playbook playbooks/status.yml --syntax-check
          ansible-playbook playbooks/db-observe.yml --syntax-check
          ansible-playbook playbooks/runtime-grant.yml --syntax-check
          ansible-playbook playbooks/teardown.yml --syntax-check
          echo 'SYNTAX_CHECK=PASS' >> "$GITHUB_ENV"

      - name: Validate required independent target bindings
        shell: bash
        env:
          INDEP_HOST: ${{ secrets.INDEP_HOST }}
          INDEP_USER: ${{ secrets.INDEP_USER }}
          INDEP_SSH_PRIVATE_KEY: ${{ secrets.INDEP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$INDEP_HOST" || { echo 'BLOCKED: INDEP_HOST is not configured'; exit 2; }
          test -n "$INDEP_USER" || { echo 'BLOCKED: INDEP_USER is not configured'; exit 2; }
          test -n "$INDEP_SSH_PRIVATE_KEY" || { echo 'BLOCKED: INDEP_SSH_PRIVATE_KEY is not configured'; exit 2; }
          test -n "$INDEP_POSTGRES_PASSWORD" || { echo 'BLOCKED: INDEP_POSTGRES_PASSWORD is not configured'; exit 2; }
          echo 'SECRET_BINDINGS=PASS' >> "$GITHUB_ENV"
          echo 'SECRET_BINDINGS_PRESENT: INDEP_HOST, INDEP_USER, INDEP_SSH_PRIVATE_KEY, INDEP_POSTGRES_PASSWORD'

      - name: Prepare ephemeral SSH and Ansible inventory
        shell: bash
        env:
          INDEP_HOST: ${{ secrets.INDEP_HOST }}
          INDEP_USER: ${{ secrets.INDEP_USER }}
          INDEP_SSH_PRIVATE_KEY: ${{ secrets.INDEP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$INDEP_SSH_PRIVATE_KEY" > ~/.ssh/independent_deploy_key
          chmod 600 ~/.ssh/independent_deploy_key
          ssh-keyscan -H "$INDEP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > INDEPENDENT_DEPLOYMENT/ansible/inventory.ini <<EOF
          [independent]
          restore-independent ansible_host=$INDEP_HOST ansible_user=$INDEP_USER ansible_ssh_private_key_file=$HOME/.ssh/independent_deploy_key ansible_become=true ansible_python_interpreter=/usr/bin/python3.9
          EOF
          echo 'TARGET_BINDING_PREPARED=PASS' >> "$GITHUB_ENV"

      - name: Execute requested independent action
        working-directory: INDEPENDENT_DEPLOYMENT/ansible
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../INDEPENDENT_DEPLOYMENT/evidence
          case "$REQUESTED_ACTION" in
            preflight)    playbook=playbooks/preflight.yml ;;
            deploy)       playbook=playbooks/deploy.yml ;;
            start)        playbook=playbooks/start.yml ;;
            status)       playbook=playbooks/status.yml ;;
            dbobserve)    playbook=playbooks/db-observe.yml ;;
            runtimegrant) playbook=playbooks/runtime-grant.yml ;;
            teardown)     playbook=playbooks/teardown.yml ;;
            *) echo 'BLOCKED: unsupported action'; exit 2 ;;
          esac
          {
            echo "experiment_branch=${GITHUB_REF_NAME}"
            echo "experiment_commit=${GITHUB_SHA}"
            echo "action=${REQUESTED_ACTION}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ansible-playbook "$playbook"
            echo "completed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } 2>&1 | tee ../../INDEPENDENT_DEPLOYMENT/evidence/github-actions-${GITHUB_RUN_ID}.txt
          echo 'ACTION_EXECUTION=PASS' >> "$GITHUB_ENV"

      - name: Upload technical comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-restore-evidence-${{ github.run_id }}
          path: INDEPENDENT_DEPLOYMENT/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish safe last-run evidence to experiment branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p INDEPENDENT_DEPLOYMENT/evidence
          cat > INDEPENDENT_DEPLOYMENT/evidence/LAST_RUN.md <<EOF
          # Independent Deployment Last Run

          run_id: ${GITHUB_RUN_ID}
          trigger_commit: ${GITHUB_SHA}
          requested_action: ${REQUESTED_ACTION:-unknown}
          job_status: ${{ job.status }}
          request_validation: ${REQUEST_VALIDATION:-NOT_REACHED}
          syntax_check: ${SYNTAX_CHECK:-NOT_REACHED}
          secret_bindings: ${SECRET_BINDINGS:-NOT_REACHED}
          target_binding_prepared: ${TARGET_BINDING_PREPARED:-NOT_REACHED}
          action_execution: ${ACTION_EXECUTION:-NOT_REACHED}
          recorded_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          No secret values are written to this evidence file.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- INDEPENDENT_DEPLOYMENT/evidence/LAST_RUN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(experiment): record independent deployment run evidence'
          git push origin HEAD:refs/heads/experiment/independent-restore-deploy

      - name: Publish final run status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then state=success; else state=failure; fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"independent-nonprod\",\"description\":\"${REQUESTED_ACTION:-unknown} ${{ job.status }}\"}" >/dev/null
