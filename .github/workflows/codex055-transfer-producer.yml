name: CODEX055 DT transfer producer
on:
  push:
    branches: [mcr/codex055-day2-arc001-candidate]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact controlled transfer from frozen candidate source
        shell: bash
        env:
          BASE_SHA: b5551eddbbcd82675997c740b5471bb3cc74241b
          SOURCE_SHA: 741af578f1cab210d37dbb5f96877c6a09f62dd8
          WORKSPACE: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          OUT_NAME: CODEX055_DT_TRANSFER_v1.0_CONTROLLED
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git merge-base "$BASE_SHA" "$SOURCE_SHA")" = "$BASE_SHA"
          tmp="$(mktemp -d)"
          root="$tmp/$OUT_NAME"
          mkdir -p "$root/overlay"
          files=(
            "$WORKSPACE/apps/api/src/dep-bootstrap.ts"
            "$WORKSPACE/apps/api/src/projections/trial-projection-port.ts"
            "$WORKSPACE/apps/api/src/trial/tls-day2-arc001-flow.ts"
            "$WORKSPACE/apps/api/tsconfig.json"
            "$WORKSPACE/apps/web/src/app.tsx"
            "$WORKSPACE/apps/web/src/router.ts"
            "$WORKSPACE/apps/web/src/views/ClosureReadinessView.tsx"
            "$WORKSPACE/apps/web/src/views/EvidenceVerificationView.tsx"
            "$WORKSPACE/apps/web/src/views/GuidedActionView.tsx"
            "$WORKSPACE/apps/web/src/views/TicketConsoleView.tsx"
            "$WORKSPACE/apps/web/src/views/TrainerConsoleView.tsx"
            "$WORKSPACE/deploy/db/seed-tls-day2-arc001.sql"
            "$WORKSPACE/packages/core-d03/package.json"
            "$WORKSPACE/tests/dep001/tls-day2-arc001-boundary.test.mjs"
            "$WORKSPACE/tests/dep001/tls-day2-producer-runtime-proof.py"
            "$WORKSPACE/tests/integration/ui-routes.integration.test.ts"
          )
          for f in "${files[@]}"; do
            mkdir -p "$root/overlay/$(dirname "$f")"
            git show "$SOURCE_SHA:$f" > "$root/overlay/$f"
          done
          git diff --binary "$BASE_SHA" "$SOURCE_SHA" -- "${files[@]}" > "$root/SOURCE_DIFF.patch"
          printf '%s\n' "${files[@]}" > "$root/ADMITTED_OVERLAY_FILES.txt"
          (
            cd "$root/overlay"
            sha256sum "${files[@]}" > ../OVERLAY_SHA256SUMS.txt
          )
          protected=(
            "$WORKSPACE/apps/api/src/trial/pre-ticket-trial-owner-flow.ts"
            "$WORKSPACE/apps/api/src/trial/tls-day1-golden-flow.ts"
            "$WORKSPACE/deploy/db/seed-tls-day1-golden.sql"
            "$WORKSPACE/deploy/db/grant-runtime.sh"
            "$WORKSPACE/db/migrations/V001__cf01_core_schema.sql"
            "$WORKSPACE/db/migrations/V002__cf01_runtime_and_exchange_schema.sql"
            "$WORKSPACE/db/migrations/V003__dg04_diagnostic_persistence.sql"
            "$WORKSPACE/db/migrations/V004__d05_pending_capture_v2.sql"
            "$WORKSPACE/package-lock.json"
          )
          : > "$root/PROTECTED_SOURCE_SHA256SUMS.txt"
          for f in "${protected[@]}"; do
            test "$(git rev-parse "$BASE_SHA:$f")" = "$(git rev-parse "$SOURCE_SHA:$f")"
            git show "$BASE_SHA:$f" | sha256sum | sed "s#  -#  $f#" >> "$root/PROTECTED_SOURCE_SHA256SUMS.txt"
          done
          cat > "$root/SYMBOLIC_OPAQUE_MAPPING.md" <<'EOF'
          # CODEX055 ARC001 Symbolic-to-Opaque Trial Mapping
          Scenario: `TLS-D2-RS-SCN-01`
          Subject: `TRIAL-RS-SERVICE-001`
          Source: `SIM-NMS-RS-TLS-D2-01` → source system `52010000-0000-4000-8000-000000000003`
          Adapter profile: `SIM-RS-QER-PROFILE-V1` → `52010000-0000-4000-8000-000000000004`

          - Responsible A / `TRIAL-HOLDER-OPS-A`: role instance `51010000-0000-4000-8000-000000000009`, holder `...000a`, assignment `...000b`, snapshot `...0006`.
          - Independent Verifier B / `TRIAL-HOLDER-VERIFY-B`: role instance `52010000-0000-4000-8000-000000000011`, holder `...0012`, assignment `...0013`, snapshot `...0014`.
          - Terminal Disposition C / `TRIAL-HOLDER-DISP-C`: role instance `52010000-0000-4000-8000-000000000021`, holder `...0022`, assignment `...0023`, snapshot `...0024`.
          - Closure-readiness D / `TRIAL-HOLDER-CLOSE-D`: role instance `52010000-0000-4000-8000-000000000031`, holder `...0032`, assignment `...0033`, snapshot `...0034`.

          Exact Day-2 actions:
          `RS_TRIAL_REQUEST_RESTORATION_VERIFICATION`
          `RS_TRIAL_VERIFY_RESTORATION_EVIDENCE`
          `RS_TRIAL_SUBMIT_TERMINAL_DISPOSITION_CLAIM`

          `TERMINAL_PROCESSING` is derived only by D-04 after D-03/Gate progression. `CLOSE` is not authorized in this package.
          EOF
          cat > "$root/APPLY.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          BASE_SHA=b5551eddbbcd82675997c740b5471bb3cc74241b
          here="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          repo="${1:-$PWD}"
          cd "$repo"
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "STOP: expected exact base $BASE_SHA" >&2; exit 2; }
          while IFS= read -r f; do
            mkdir -p "$(dirname "$f")"
            cp "$here/overlay/$f" "$f"
          done < "$here/ADMITTED_OVERLAY_FILES.txt"
          echo 'PASS: CODEX055 bounded overlay applied; repository remains uncommitted for DT verification.'
          EOF
          chmod +x "$root/APPLY.sh"
          cat > "$root/VERIFY_AFTER_APPLY.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          repo="${1:-$PWD}"
          cd "$repo"
          while read -r digest f; do printf '%s  %s\n' "$digest" "$f" | sha256sum -c -; done < "$here/OVERLAY_SHA256SUMS.txt"
          while read -r digest f; do printf '%s  %s\n' "$digest" "$f" | sha256sum -c -; done < "$here/PROTECTED_SOURCE_SHA256SUMS.txt"
          echo 'PASS: overlay and protected-source identities verified.'
          EOF
          chmod +x "$root/VERIFY_AFTER_APPLY.sh"
          cat > "$root/APPLY_AND_VERIFY.md" <<EOF
          # DT Apply and Verify
          Authority base: \`$BASE_SHA\`
          Frozen candidate source: \`$SOURCE_SHA\`

          1. Start from exact base SHA above on a bounded DT branch/worktree.
          2. Run \`./APPLY.sh /path/to/repository\`.
          3. Run \`./VERIFY_AFTER_APPLY.sh /path/to/repository\`.
          4. From \`$WORKSPACE\`: \`npm ci && npm run verify:boundaries && npm run typecheck && npm run build\`.
          5. Execute the governed runtime proof using \`tests/dep001/tls-day2-producer-runtime-proof.py\` against a disposable PostgreSQL 17 runtime initialized with unchanged V001–V004 and current accepted grant-runtime.
          6. Apply Day-1 and Day-2 static Trial seeds only under migration/deployment identity; both must reject \`appts_runtime\`.
          7. Do not merge any verification PR and do not mutate Build Pack.
          EOF
          cat > "$root/RESET_RESEED_RERUN.md" <<'EOF'
          # Controlled Reset / Reseed / Rerun
          Use a disposable non-production PostgreSQL 17 database. Recreate from unchanged V001–V004, apply current accepted `grant-runtime.sh`, then apply `seed-tls-day1-golden.sql` and `seed-tls-day2-arc001.sql` as migration identity. The Day-2 seed is idempotent and contains no Ticket/runtime lifecycle state. Form a fresh governed Day-1 Ticket and ACTIVATE it before each Day-2 run. Use a distinct `scenarioRunRef` per rerun. Never reset or advance canonical Ticket state by direct SQL.
          EOF
          cat > "$root/PRODUCER_VERIFICATION_SUMMARY.md" <<EOF
          # Producer Verification Summary
          Frozen candidate source: \`$SOURCE_SHA\`
          Regular verification run: \`32635151836\` — SUCCESS.
          Producer runtime/browser run: \`32635151795\`, job \`97183663391\` — SUCCESS.
          PostgreSQL: 17.11; Node: 24.19.0; npm: 11.17.0; browser: Google Chrome 151.0.7922.137.
          Runtime evidence artifact: \`9492109837\`; digest \`sha256:42ccaf1e67b00a73c7c48b176f9ade2202c44cc31379e536ceba617be478afb6\`.

          PASS assertions: event-alone remains ACTIVE; wrong verifier fails closed; eligible independent verifier succeeds; terminal claim remains unavailable until predicates pass; D-03/Gate/I-03 permits D-04 ACTIVE→TERMINAL_PROCESSING; CLOSE withheld; exact replay creates no duplicate effect; controlled reseed/rerun works with distinct scenario_run_ref; actual browser surfaces render Trainer/Evidence/Ticket/Closure; zero CLOSED Tickets.
          EOF
          python3 - "$root" "$BASE_SHA" "$SOURCE_SHA" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          manifest={
            'package':'CODEX055_DT_TRANSFER_v1.0_CONTROLLED',
            'authority':'MCR-to-CODEX-055',
            'upstream':'ARC-to-MCR-001',
            'base_sha':sys.argv[2],
            'source_sha':sys.argv[3],
            'scenario':'TLS-D2-RS-SCN-01',
            'day2_gate':'ACTIVE through governed meaningful progression to TERMINAL_PROCESSING; not CLOSED',
            'overlay_files':root.joinpath('ADMITTED_OVERLAY_FILES.txt').read_text().splitlines(),
            'regular_verification_run':32635151836,
            'runtime_verification_run':32635151795,
            'runtime_job':97183663391,
            'runtime_evidence_artifact':9492109837,
            'runtime_evidence_digest':'sha256:42ccaf1e67b00a73c7c48b176f9ade2202c44cc31379e536ceba617be478afb6',
            'build_pack':'FROZEN_UNCHANGED',
            'close_action':'WITHHELD_NOT_AUTHORIZED'
          }
          root.joinpath('MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          (
            cd "$root"
            find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          (cd "$tmp" && zip -X -r "$OUT_NAME.zip" "$OUT_NAME" >/dev/null)
          sha256sum "$tmp/$OUT_NAME.zip" | tee /tmp/CODEX055_TRANSFER_SHA256.txt
          stat -c '%s' "$tmp/$OUT_NAME.zip" | tee /tmp/CODEX055_TRANSFER_SIZE.txt
          cp "$tmp/$OUT_NAME.zip" "$GITHUB_WORKSPACE/$OUT_NAME.zip"
          echo "TRANSFER_SOURCE_SHA=$SOURCE_SHA"
          echo "TRANSFER_OVERLAY_COUNT=${#files[@]}"
      - name: Upload exact controlled transfer
        uses: actions/upload-artifact@v4
        with:
          name: CODEX055_DT_TRANSFER_v1.0_CONTROLLED
          path: CODEX055_DT_TRANSFER_v1.0_CONTROLLED.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
