name: staging-local-runtime-acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/staging/**'
      - 'tests/runtime-boundary.test.mjs'
      - 'tests/runtime-restart.test.mjs'
      - 'tests/hitl-trial1.test.mjs'
      - 'tests/fixtures/hitl-trial1-scenarios.mjs'
      - 'tests/fixtures/hitl-trial1-oracles.mjs'
      - 'infra/staging/hitl-trial1-scenario.example.json'
      - 'infra/staging/appts-restore-service-local.service'
      - 'infra/staging/provision-local-runtime.sh'
      - 'infra/staging/runtime.env.example'
      - 'infra/staging/synthetic-trial-fixture.example.json'
      - '.github/workflows/staging-local-runtime-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: 01097454cc73b9917b284c876af4c603856ebe6e
  ADMITTED_MAIN_SHA: fc05398bb1e003a104cb644d6d4879f64b613be9
  HITL_BASE_SHA: 78c0d5d951ec53e01590967f6f41dc6af8b3d6b4

jobs:
  gate-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy Product semantic baseline 90
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
          npm run build
          node --test tests/*.test.mjs tests/vectors/*.test.mjs | tee /tmp/gate-a.tap
          grep -Fx '# tests 90' /tmp/gate-a.tap
          grep -Fx '# pass 90' /tmp/gate-a.tap
          grep -Fx '# fail 0' /tmp/gate-a.tap
          grep -Fx '# skipped 0' /tmp/gate-a.tap

  gate-admitted-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ADMITTED_MAIN_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy admitted-main baseline 92
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_MAIN_SHA"
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
          npm run build
          node --test tests/*.test.mjs tests/vectors/*.test.mjs | tee /tmp/gate-b.tap
          grep -Fx '# tests 92' /tmp/gate-b.tap
          grep -Fx '# pass 92' /tmp/gate-b.tap
          grep -Fx '# fail 0' /tmp/gate-b.tap
          grep -Fx '# skipped 0' /tmp/gate-b.tap

  gate-a-hitl-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HITL_BASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate A exact admitted HITL base 107
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HITL_BASE_SHA"
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
          npm run build
          node --test tests/*.test.mjs tests/vectors/*.test.mjs | tee /tmp/hitl-gate-a.tap
          grep -Fx '# tests 107' /tmp/hitl-gate-a.tap
          grep -Fx '# pass 107' /tmp/hitl-gate-a.tap
          grep -Fx '# fail 0' /tmp/hitl-gate-a.tap
          grep -Fx '# skipped 0' /tmp/hitl-gate-a.tap

  gate-b-hitl-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate B exact HITL-T01 through HITL-T22
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
          npm run build
          test "$(grep -Ec 'test\("HITL-T[0-9]{2}' tests/hitl-trial1.test.mjs)" = '22'
          for id in $(seq -w 1 22); do
            grep -q "HITL-T$id" tests/hitl-trial1.test.mjs
          done
          node --test tests/hitl-trial1.test.mjs | tee /tmp/hitl-gate-b.tap
          grep -Fx '# tests 22' /tmp/hitl-gate-b.tap
          grep -Fx '# pass 22' /tmp/hitl-gate-b.tap
          grep -Fx '# fail 0' /tmp/hitl-gate-b.tap
          grep -Fx '# skipped 0' /tmp/hitl-gate-b.tap

  gate-candidate:
    needs: [gate-a-hitl-baseline, gate-b-hitl-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate C verify exact bounded 13-file diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$HITL_BASE_SHA^{commit}"
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/staging-local-runtime-acceptance.yml
          infra/staging/hitl-trial1-scenario.example.json
          src/staging/hitl-trial1-console.ts
          src/staging/hitl-trial1-contracts.ts
          src/staging/hitl-trial1-operator-view.ts
          src/staging/hitl-trial1-runtime.ts
          src/staging/local-boundary.ts
          src/staging/main.ts
          src/staging/runtime-composition.ts
          src/staging/runtime-config.ts
          tests/fixtures/hitl-trial1-oracles.mjs
          tests/fixtures/hitl-trial1-scenarios.mjs
          tests/hitl-trial1.test.mjs
          EOF
          git diff --name-only "$HITL_BASE_SHA"..HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" = '13'
          git diff --quiet "$HITL_BASE_SHA"..HEAD --             src/contracts src/runtime src/persistence src/adapters src/config src/simulator tests/vectors
      - name: Gate C strict compile and exact full candidate 129
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
          test ! -d node_modules/@types/node
          npm run build
          node --test tests/*.test.mjs tests/vectors/*.test.mjs | tee /tmp/hitl-gate-c.tap
          grep -Fx '# tests 129' /tmp/hitl-gate-c.tap
          grep -Fx '# pass 129' /tmp/hitl-gate-c.tap
          grep -Fx '# fail 0' /tmp/hitl-gate-c.tap
          grep -Fx '# skipped 0' /tmp/hitl-gate-c.tap

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'hidayatoemar/AppTS' && github.ref == 'refs/heads/mcr/staging-loopback-runtime'
    needs: [gate-product, gate-admitted-main, gate-candidate]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Checkout Gate A source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: gate-a
      - name: Checkout Gate B source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ADMITTED_MAIN_SHA }}
          path: gate-b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build target-host acceptance artifacts
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          for dir in gate-a gate-b .; do
            (
              cd "$dir"
              npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
              npm run build
            )
          done
          tar -czf "$RUNNER_TEMP/gate-a.tar.gz" -C gate-a dist tests
          tar -czf "$RUNNER_TEMP/gate-b.tar.gz" -C gate-b dist tests infra/staging
          printf '%s\n' "$CANDIDATE_SHA" > DEPLOYED_COMMIT
          tar -czf "$RUNNER_TEMP/local-runtime-$CANDIDATE_SHA.tar.gz" \
            DEPLOYED_COMMIT package.json README.md dist infra/staging
          ! tar -tzf "$RUNNER_TEMP/local-runtime-$CANDIDATE_SHA.tar.gz" | grep -E '(^|/)tests(/|$)'
          ! tar -tzf "$RUNNER_TEMP/local-runtime-$CANDIDATE_SHA.tar.gz" | grep -F 'hitl-trial1-oracles.mjs'
          tar -czf "$RUNNER_TEMP/candidate-gate-c-$CANDIDATE_SHA.tar.gz" \
            dist tests infra/staging
          tar -tzf "$RUNNER_TEMP/candidate-gate-c-$CANDIDATE_SHA.tar.gz" \
            | grep -Fx 'tests/fixtures/hitl-trial1-oracles.mjs'
          sha256sum "$RUNNER_TEMP/local-runtime-$CANDIDATE_SHA.tar.gz" \
            | tee "$RUNNER_TEMP/local-runtime-$CANDIDATE_SHA.sha256"
      - name: Prepare pinned SSH identity
        shell: bash
        env:
          APPTS_STAGING_SSH_PRIVATE_KEY: ${{ secrets.APPTS_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${APPTS_STAGING_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$APPTS_STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/appts_staging"
          chmod 600 "$HOME/.ssh/appts_staging"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          103.127.99.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILpRJVkwh143CmmrMkQvgfNyRIbV964SsAYLZ3BlaGdh
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILpRJVkwh143CmmrMkQvgfNyRIbV964SsAYLZ3BlaGdh' > /tmp/appts-hostkey.pub
          actual="$(ssh-keygen -lf /tmp/appts-hostkey.pub -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:M0o8nYzf97+hK627/zeemfmiXF02eBjg7Ej5DUYITmw'
      - name: Prepare bounded HITL target-host acceptance script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/staging-acceptance.mjs" <<'NODE'
          import { execFileSync } from "node:child_process";

          const base = "http://127.0.0.1:8080";
          const secretMarker = "PAYLOAD-DO-NOT-LOG-LOCAL-TRIAL";
          const expectedEvidenceRef = "EV-HITL1-GOV";

          function responseClass(result) {
            return {
              status: result.status,
              kind: typeof result.body?.kind === "string" ? result.body.kind : "NONE",
              error: typeof result.body?.error === "string" ? result.body.error : "NONE"
            };
          }

          function failClassified(label, result, expected) {
            const actual = responseClass(result);
            console.error(
              `acceptance_failure label=${label} status=${actual.status} kind=${actual.kind} error=${actual.error} expected=${expected}`
            );
            throw new Error(`${label} failed`);
          }

          function expectOutcome(label, result, status, kind) {
            if (result.status !== status || result.body?.kind !== kind) {
              failClassified(label, result, `status:${status},kind:${kind}`);
            }
          }

          function expectError(label, result, status, error) {
            if (result.status !== status || result.body?.error !== error) {
              failClassified(label, result, `status:${status},error:${error}`);
            }
          }

          function assert(condition, label) {
            if (!condition) throw new Error(label);
          }

          async function waitReady() {
            for (let n = 0; n < 30; n += 1) {
              try {
                const response = await fetch(base + "/readyz", { cache: "no-store" });
                if (response.ok) return;
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 500));
            }
            throw new Error("ready timeout");
          }

          async function getJson(path) {
            const response = await fetch(base + path, { cache: "no-store" });
            const body = await response.json();
            return { status: response.status, body };
          }

          async function post(value) {
            const response = await fetch(base + "/commands", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(value)
            });
            return { status: response.status, body: await response.json() };
          }

          function selectedContext(view) {
            return view.roleContexts.filter((item) => item.selected);
          }

          function purposeFrom(view) {
            return {
              purpose: "RESTORE_SERVICE",
              situationId: view.scope.scopeRef.situationId,
              compositionInstanceId: view.trial.scenarioId,
              startedFromBasisRef: view.evidence.evidenceRefs[0]
            };
          }

          function humanCommand(view, commandId, actionId, actingContextRef, payloadRef) {
            return {
              commandId,
              actionId,
              purposeRef: purposeFrom(view),
              scopeRef: view.scope.scopeRef,
              requestedByActorOrMachineRef: view.trial.personRef,
              actingContextRef,
              expectedInputVersion: view.scope.version,
              requestTime: "2026-09-21T10:00:00.000Z",
              payloadRef,
              evidenceRefs: [...view.evidence.evidenceRefs]
            };
          }

          await waitReady();

          const trialPage = await fetch(base + "/trial-1", { cache: "no-store" });
          assert(trialPage.status === 200, "trial page unavailable");
          const trialHtml = await trialPage.text();
          assert(!trialHtml.includes("HITL_TRIAL1_ORACLES"), "oracle symbol leaked to browser");
          assert(!trialHtml.includes("expectedClosureEligibility"), "oracle expectation leaked to browser");

          const initialResponse = await getJson("/trial-1/operator-view?actingContextRef=CTX-HITL1-RECOVERY");
          assert(initialResponse.status === 200, "initial operator view unavailable");
          const initial = initialResponse.body;
          assert(initial.infrastructure?.syntheticTrial === true, "synthetic trial marker missing");
          assert(initial.infrastructure?.loopbackOnly === true, "loopback marker missing");
          assert(initial.trial?.trialId === "TRIAL-LOCAL-001", "trial id mismatch");
          assert(initial.trial?.scenarioId === "S01_SUCCESS_REQUIRED", "scenario id mismatch");
          assert(initial.trial?.personRef === "PERSON-STAGING-001", "single human mismatch");
          assert(initial.scope?.version === 0, "initial version mismatch");
          assert(initial.roleContexts?.length === 4, "role-context cardinality mismatch");
          assert(selectedContext(initial).length === 1 && selectedContext(initial)[0].actingContextRef === "CTX-HITL1-RECOVERY", "recovery context not selected");
          assert(initial.actions?.["RS-A-014"]?.mode === "DETERMINISTIC_MACHINE", "A14 machine projection missing");
          assert(!JSON.stringify(initial).includes("expectedClosureEligibility"), "oracle expectation leaked to operator view");

          for (const contextRef of [
            "CTX-HITL1-SERVICE-VERIFICATION",
            "CTX-HITL1-CUSTOMER-VERIFICATION",
            "CTX-HITL1-CLOSURE-DECISION"
          ]) {
            const roleView = await getJson(`/trial-1/operator-view?actingContextRef=${encodeURIComponent(contextRef)}`);
            assert(roleView.status === 200, "role view unavailable");
            assert(roleView.body.scope.version === 0, "role switch mutated version");
            assert(selectedContext(roleView.body).length === 1 && selectedContext(roleView.body)[0].actingContextRef === contextRef, "role selection mismatch");
            assert(roleView.body.responsibility.responsibilityRef === initial.responsibility.responsibilityRef, "role switch changed responsibility");
          }

          const recovery = humanCommand(
            initial,
            "CMD-STAGING-001",
            "RS-A-022",
            "CTX-HITL1-RECOVERY",
            secretMarker
          );
          const recoveryCommit = await post(recovery);
          expectOutcome("recovery_commit", recoveryCommit, 200, "COMMITTED");
          assert(recoveryCommit.body.effects?.some((effect) => effect.materialEffectEstablished === true), "recovery material effect missing");

          const recoveryReplay = await post(recovery);
          expectOutcome("recovery_replay", recoveryReplay, 200, "REPLAY");
          assert(JSON.stringify(recoveryReplay.body.execution) === JSON.stringify(recoveryCommit.body.execution), "recovery replay execution mismatch");
          assert(JSON.stringify(recoveryReplay.body.effects) === JSON.stringify(recoveryCommit.body.effects), "recovery replay effect mismatch");

          const recoveryConflict = await post({ ...recovery, expectedInputVersion: 1 });
          expectError("recovery_conflict", recoveryConflict, 409, "IMPLEMENTATION_REPLAY_CONFLICT");

          const serviceViewResponse = await getJson("/trial-1/operator-view?actingContextRef=CTX-HITL1-SERVICE-VERIFICATION");
          assert(serviceViewResponse.status === 200, "service view unavailable");
          const serviceView = serviceViewResponse.body;
          assert(serviceView.scope.version === 1, "post-recovery version mismatch");

          const a12 = humanCommand(
            serviceView,
            "CMD-HITL1-STAGING-A12-001",
            "RS-A-012",
            "CTX-HITL1-SERVICE-VERIFICATION",
            "VERIFIED_OK"
          );
          const a12Commit = await post(a12);
          expectOutcome("a12_commit", a12Commit, 200, "COMMITTED");
          const a12Replay = await post(a12);
          expectOutcome("a12_replay", a12Replay, 200, "REPLAY");

          const customerViewResponse = await getJson("/trial-1/operator-view?actingContextRef=CTX-HITL1-CUSTOMER-VERIFICATION");
          assert(customerViewResponse.status === 200, "customer view unavailable");
          const customerView = customerViewResponse.body;
          assert(customerView.scope.version === 2, "post-A12 version mismatch");
          assert(customerView.verification.serviceVerificationRef === "HITL1:SERVICE_VERIFICATION:VERIFIED_OK", "service verification missing");

          const a13 = humanCommand(
            customerView,
            "CMD-HITL1-STAGING-A13-001",
            "RS-A-013",
            "CTX-HITL1-CUSTOMER-VERIFICATION",
            "CONFIRMED_OK"
          );
          const a13Commit = await post(a13);
          expectOutcome("a13_commit", a13Commit, 200, "COMMITTED");

          const closureViewResponse = await getJson("/trial-1/operator-view?actingContextRef=CTX-HITL1-CLOSURE-DECISION");
          assert(closureViewResponse.status === 200, "closure view unavailable");
          const closureView = closureViewResponse.body;
          assert(closureView.scope.version === 4, "A14 exact-once version mismatch");
          assert(closureView.verification.customerVerificationRef === "HITL1:CUSTOMER_VERIFICATION:CONFIRMED_OK", "customer verification missing");
          assert(closureView.verification.closureEligibilityRef === "HITL1:CLOSURE_ELIGIBILITY:ELIGIBLE", "closure eligibility missing");
          assert(closureView.actions?.["RS-A-014"]?.mode === "DETERMINISTIC_MACHINE", "A14 projection changed");

          const a15 = humanCommand(
            closureView,
            "CMD-HITL1-STAGING-A15-001",
            "RS-A-015",
            "CTX-HITL1-CLOSURE-DECISION",
            "CLOSED"
          );
          const a15Commit = await post(a15);
          expectOutcome("a15_commit", a15Commit, 200, "COMMITTED");

          const finalBeforeRestartResponse = await getJson("/trial-1/operator-view?actingContextRef=CTX-HITL1-CLOSURE-DECISION");
          assert(finalBeforeRestartResponse.status === 200, "final view unavailable");
          const finalBeforeRestart = finalBeforeRestartResponse.body;
          assert(finalBeforeRestart.scope.version === 5, "final version mismatch");
          assert(finalBeforeRestart.verification.closureDecisionRef === "HITL1:CLOSURE_DECISION:CLOSED", "explicit closure decision missing");

          const readOnlyRefresh = await getJson("/trial-1/operator-view?actingContextRef=CTX-HITL1-RECOVERY");
          assert(readOnlyRefresh.status === 200 && readOnlyRefresh.body.scope.version === 5, "GET mutated authoritative state");

          execFileSync("sudo", ["systemctl", "restart", "appts-restore-service-local.service"], { stdio: "inherit" });
          await waitReady();

          const afterRestartResponse = await getJson("/trial-1/operator-view?actingContextRef=CTX-HITL1-CLOSURE-DECISION");
          assert(afterRestartResponse.status === 200, "post-restart view unavailable");
          const afterRestart = afterRestartResponse.body;
          assert(afterRestart.scope.version === 5, "restart changed authoritative version");
          assert(afterRestart.verification.closureEligibilityRef === "HITL1:CLOSURE_ELIGIBILITY:ELIGIBLE", "eligibility not durable");
          assert(afterRestart.verification.closureDecisionRef === "HITL1:CLOSURE_DECISION:CLOSED", "closure decision not durable");

          const postRestartReplay = await post(a15);
          expectOutcome("a15_post_restart_replay", postRestartReplay, 200, "REPLAY");
          assert(JSON.stringify(postRestartReplay.body.execution) === JSON.stringify(a15Commit.body.execution), "post-restart execution replay mismatch");

          const afterReplayResponse = await getJson("/trial-1/operator-view?actingContextRef=CTX-HITL1-CLOSURE-DECISION");
          assert(afterReplayResponse.status === 200 && afterReplayResponse.body.scope.version === 5, "replay created second business action");

          console.log("staging_hitl_trial1_success_path=PASS");
          console.log("staging_hitl_trial1_role_switch_read_only=PASS");
          console.log("staging_hitl_trial1_replay_restart=PASS");
          console.log("staging_hitl_trial1_oracle_isolation=PASS");
          NODE
      - name: Transfer, activate HITL profile, and execute bounded acceptance
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          artifact="$RUNNER_TEMP/local-runtime-$CANDIDATE_SHA.tar.gz"
          artifact_sha="$(sha256sum "$artifact" | awk '{print $1}')"
          SSH_OPTS=(
            -i "$HOME/.ssh/appts_staging"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=12
          )
          scp "${SSH_OPTS[@]}" \
            infra/staging/provision-local-runtime.sh \
            "$artifact" \
            "$RUNNER_TEMP/gate-a.tar.gz" \
            "$RUNNER_TEMP/gate-b.tar.gz" \
            "$RUNNER_TEMP/staging-acceptance.mjs" \
            appts-mcr@103.127.99.11:/tmp/
          scp "${SSH_OPTS[@]}" \
            "$RUNNER_TEMP/candidate-gate-c-$CANDIDATE_SHA.tar.gz" \
            appts-mcr@103.127.99.11:/tmp/candidate-gate-c.tar.gz
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 \
            "bash /tmp/provision-local-runtime.sh '$CANDIDATE_SHA' '/tmp/local-runtime-$CANDIDATE_SHA.tar.gz' '$artifact_sha'"
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 'bash -s' <<'REMOTE_HITL_PROFILE'
          set -euo pipefail
          CONFIG_ROOT=/etc/appts-restore-service
          RELEASE=/opt/appts-restore-service/current
          test -f "$RELEASE/infra/staging/hitl-trial1-scenario.example.json"
          sudo install -o root -g appts-runtime -m 0640 \
            "$RELEASE/infra/staging/hitl-trial1-scenario.example.json" \
            "$CONFIG_ROOT/hitl-trial1-scenario.json"
          runtime_tmp="$(mktemp)"
          cat > "$runtime_tmp" <<'JSON'
          {
            "profile": "HITL_TRIAL1_LOCAL_ONLY",
            "bindAddress": "127.0.0.1",
            "port": 8080,
            "dataDir": "/var/lib/appts-restore-service/runtime",
            "trialFixturePath": "/etc/appts-restore-service/synthetic-trial-fixture.json",
            "hitlScenarioPath": "/etc/appts-restore-service/hitl-trial1-scenario.json"
          }
          JSON
          sudo install -o root -g appts-runtime -m 0640 "$runtime_tmp" "$CONFIG_ROOT/runtime.json"
          rm -f "$runtime_tmp"
          sudo -u appts-runtime test -r "$CONFIG_ROOT/runtime.json"
          sudo -u appts-runtime test -r "$CONFIG_ROOT/hitl-trial1-scenario.json"
          sudo -u appts-runtime node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const config = JSON.parse(await readFile("/etc/appts-restore-service/runtime.json", "utf8"));
          if (config.profile !== "HITL_TRIAL1_LOCAL_ONLY") throw new Error("HITL_PROFILE_NOT_ACTIVE");
          if (config.hitlScenarioPath !== "/etc/appts-restore-service/hitl-trial1-scenario.json") throw new Error("HITL_SCENARIO_PATH_MISMATCH");
          if (config.bindAddress !== "127.0.0.1" || config.port !== 8080) throw new Error("HITL_LOOPBACK_CONFIG_MISMATCH");
          console.log("hitl_runtime_profile_config=PASS");
          NODE
          sudo systemctl restart appts-restore-service-local.service
          sudo systemctl is-active --quiet appts-restore-service-local.service
          node --input-type=module <<'NODE'
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              const health = await fetch("http://127.0.0.1:8080/healthz");
              const ready = await fetch("http://127.0.0.1:8080/readyz");
              if (health.ok && ready.ok) {
                console.log("hitl_runtime_readiness=PASS");
                process.exit(0);
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          throw new Error("HITL_RUNTIME_READINESS_TIMEOUT");
          NODE
          app_listener=$(ss -lntH | awk '{print $4}' | grep -E '(^|])?:8080$' || true)
          test "$app_listener" = '127.0.0.1:8080'
          test -z "$(ss -lntH | awk '{print $4}' | grep -E '(^|:)(80|443)$' || true)"
          echo hitl_runtime_profile_activation=PASS
          REMOTE_HITL_PROFILE
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 \
            "CANDIDATE_SHA='$CANDIDATE_SHA' bash -s" <<'REMOTE_ACCEPTANCE'
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = '22'
          worka=$(mktemp -d)
          workb=$(mktemp -d)
          workc=$(mktemp -d /tmp/appts-gate-c.XXXXXX)
          trap 'rm -rf "$worka" "$workb" "$workc"' EXIT
          tar -xzf /tmp/gate-a.tar.gz -C "$worka"
          tar -xzf /tmp/gate-b.tar.gz -C "$workb"
          node --test "$worka"/tests/*.test.mjs "$worka"/tests/vectors/*.test.mjs | tee /tmp/target-gate-a.tap
          grep -Fx '# tests 90' /tmp/target-gate-a.tap
          grep -Fx '# pass 90' /tmp/target-gate-a.tap
          grep -Fx '# fail 0' /tmp/target-gate-a.tap
          grep -Fx '# skipped 0' /tmp/target-gate-a.tap
          (cd "$workb" && node --test tests/*.test.mjs tests/vectors/*.test.mjs) | tee /tmp/target-gate-b.tap
          grep -Fx '# tests 92' /tmp/target-gate-b.tap
          grep -Fx '# pass 92' /tmp/target-gate-b.tap
          grep -Fx '# fail 0' /tmp/target-gate-b.tap
          grep -Fx '# skipped 0' /tmp/target-gate-b.tap

          test "${workc#/opt/appts-restore-service}" = "$workc"
          tar -xzf /tmp/candidate-gate-c.tar.gz -C "$workc"
          test -f "$workc/tests/fixtures/hitl-trial1-oracles.mjs"
          (
            cd "$workc"
            node --test tests/*.test.mjs tests/vectors/*.test.mjs
          ) | tee /tmp/target-gate-c.tap
          grep -Fx '# tests 129' /tmp/target-gate-c.tap
          grep -Fx '# pass 129' /tmp/target-gate-c.tap
          grep -Fx '# fail 0' /tmp/target-gate-c.tap
