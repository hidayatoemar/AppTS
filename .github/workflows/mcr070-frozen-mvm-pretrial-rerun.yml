name: MCR070 Frozen MVM Pre-Trial Rerun

on:
  push:
    branches:
      - harness/mcr070-frozen-mvm-pretrial-rerun
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact rerun head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup admitted Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Verify exact toolchain identity
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          node --version
          npm --version

      - name: Verify immutable Product and harness-only MCR070 extension boundary
        shell: bash
        run: |
          PRODUCT_COMMIT=685e900545c686f1c2e802ff1e712394d1d324f6
          PRODUCT_TREE=440b4a5b2a402d929b0a398d51733e9bc1ede292
          MCR069_MECHANICS=cb18721f250a76c27c57929d9b53dd7bfd8f6d09
          test "$(git rev-parse ${PRODUCT_COMMIT}^{tree})" = "${PRODUCT_TREE}"
          test -z "$(git diff --name-only ${PRODUCT_COMMIT} -- DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001)"
          git diff --name-only ${MCR069_MECHANICS}..HEAD > /tmp/mcr070_changed_paths.txt
          test -s /tmp/mcr070_changed_paths.txt
          while IFS= read -r path; do
            case "$path" in
              EPHEMERAL_MVM_HARNESS/scripts/mcr070-frozen-mvm-pretrial-rerun.mjs) ;;
              .github/workflows/mcr070-frozen-mvm-pretrial-rerun.yml) ;;
              *) echo "MCR070_EXTENSION_BOUNDARY_VIOLATION:${path}"; exit 1 ;;
            esac
          done < /tmp/mcr070_changed_paths.txt
          echo "MCR070_EXTENSION_BOUNDARY_PASS"
          cat /tmp/mcr070_changed_paths.txt

      - name: Verify frozen catalog identity
        run: node EPHEMERAL_MVM_HARNESS/scripts/verify-catalog.mjs

      - name: Execute fresh MCR070 D04-005 verification carrier
        run: node EPHEMERAL_MVM_HARNESS/scripts/mcr070-frozen-mvm-pretrial-rerun.mjs

      - name: Record immutable workflow identity
        if: always()
        shell: bash
        run: |
          mkdir -p EPHEMERAL_MVM_HARNESS/evidence/mcr070
          cat > EPHEMERAL_MVM_HARNESS/evidence/mcr070/workflow-identity.json <<EOF
          {
            "authority":"MCR-to-CODEX-070",
            "scope":"FRESH_ZERO_CREDIT_FROZEN_MVM_PRETRIAL_RERUN",
            "repository":"${GITHUB_REPOSITORY}",
            "ref":"${GITHUB_REF_NAME}",
            "checkout_head":"$(git rev-parse HEAD)",
            "checkout_tree":"$(git rev-parse HEAD^{tree})",
            "workflow":"${GITHUB_WORKFLOW}",
            "run_id":"${GITHUB_RUN_ID}",
            "run_attempt":"${GITHUB_RUN_ATTEMPT}",
            "runner_os":"${RUNNER_OS}",
            "node":"$(node --version)",
            "npm":"$(npm --version)",
            "prior_stopped_evidence_promoted":false,
            "product_or_frozen_source_mutation":false
          }
          EOF

      - name: Upload controlled MCR070 rerun evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcr070-frozen-mvm-pretrial-rerun-evidence
          path: EPHEMERAL_MVM_HARNESS/evidence/mcr070/
          if-no-files-found: error
          retention-days: 90
