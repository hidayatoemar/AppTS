name: CODEX055 Day-2 producer runtime proof

on:
  pull_request:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - '.github/workflows/codex055-day2-runtime-producer.yml'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/**'

permissions:
  contents: read

jobs:
  producer-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: codex055-superuser-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/package-lock.json

      - name: Pin npm 11.17.0 and install
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci

      - name: Freeze protected baseline and build
        run: |
          set -euo pipefail
          base=b5551eddbbcd82675997c740b5471bb3cc74241b
          git diff --exit-code "$base" -- \
            apps/api/src/trial/pre-ticket-trial-owner-flow.ts \
            apps/api/src/trial/tls-day1-golden-flow.ts \
            deploy/db/seed-tls-day1-golden.sql \
            deploy/db/grant-runtime.sh \
            db/migrations/V001__cf01_core_schema.sql \
            db/migrations/V002__cf01_runtime_and_exchange_schema.sql \
            db/migrations/V003__dg04_diagnostic_persistence.sql \
            db/migrations/V004__d05_pending_capture_v2.sql \
            package-lock.json
          npm run verify:boundaries
          npm run typecheck
          npm run build

      - name: Prepare disposable PostgreSQL 17 least-privilege runtime
        shell: bash
        run: |
          set -euo pipefail
          db=appts_dep001_codex055
          root="$PWD"
          pgcid="$(docker ps --filter ancestor=postgres:17.11-bookworm -q | head -n1)"
          test -n "$pgcid"
          PGPASSWORD=codex055-superuser-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<SQL
          CREATE ROLE appts_migration LOGIN PASSWORD 'codex055-migration-local-only' NOSUPERUSER INHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE appts_runtime LOGIN PASSWORD 'codex055-runtime-local-only' NOSUPERUSER NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE ${db} OWNER appts_migration;
          SQL
          for f in \
            db/migrations/V001__cf01_core_schema.sql \
            db/migrations/V002__cf01_runtime_and_exchange_schema.sql \
            db/migrations/V003__dg04_diagnostic_persistence.sql \
            db/migrations/V004__d05_pending_capture_v2.sql; do
            PGPASSWORD=codex055-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$f"
          done
          docker cp deploy/db "$pgcid:/tmp/codex055-db"
          docker exec "$pgcid" chmod +x /tmp/codex055-db/grant-runtime.sh
          docker exec \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE="$db" \
            -e PGUSER=appts_migration -e PGPASSWORD=codex055-migration-local-only \
            -e APPTS_DB_NAME="$db" -e APPTS_MIGRATION_ROLE=appts_migration -e APPTS_RUNTIME_ROLE=appts_runtime \
            -e 'APPTS_STAGING_LABEL=STAGING SIMULATION / NON-PRODUCTION' \
            -e APPTS_DISPOSABLE_DATABASE=true -e APPTS_DB_NETWORK_MODE=LOOPBACK \
            "$pgcid" /tmp/codex055-db/grant-runtime.sh

          for seed in deploy/db/seed-tls-day1-golden.sql deploy/db/seed-tls-day2-arc001.sql; do
            set +e
            PGPASSWORD=codex055-runtime-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_runtime -d "$db" < "$seed" >/tmp/runtime-seed.out 2>/tmp/runtime-seed.err
            rc=$?
            set -e
            test "$rc" -ne 0
            grep -qi 'must not run as appts_runtime' /tmp/runtime-seed.err
            PGPASSWORD=codex055-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$seed"
          done
          # Reseed must be deterministic/idempotent and must not manufacture Ticket state.
          PGPASSWORD=codex055-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < deploy/db/seed-tls-day2-arc001.sql
          test "$(PGPASSWORD=codex055-migration-local-only psql -X -At -h 127.0.0.1 -U appts_migration -d "$db" -c 'select count(*) from appts.runtime_ticket')" = 0
          test "$(PGPASSWORD=codex055-runtime-local-only psql -X -At -h 127.0.0.1 -U appts_runtime -d "$db" -c 'select current_user')" = appts_runtime
          echo CODEX055_DB_RUNTIME_SPLIT=PASS

      - name: Governed Day-1 to Day-2 runtime and browser proof
        shell: bash
        env:
          DATABASE_URL: postgresql://appts_runtime:codex055-runtime-local-only@127.0.0.1:5432/appts_dep001_codex055
          API_LISTEN_PORT: 8080
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
        run: |
          set -euo pipefail
          mkdir -p /tmp/codex055-evidence
          node apps/api/dist/dep-bootstrap.js >/tmp/codex055-api.log 2>&1 & api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true; cat /tmp/codex055-api.log || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null && break || sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = '{"status":"ok"}'
          test "$(curl -fsS http://127.0.0.1:8080/readyz)" = '{"status":"ready"}'

          python3 - <<'PY'
          import datetime, json, urllib.error, urllib.request, uuid
          BASE='http://127.0.0.1:8080/api/v1/ui'
          E='/tmp/codex055-evidence'
          A_HOLDER='51010000-0000-4000-8000-00000000000a'; A_ASSIGN='51010000-0000-4000-8000-00000000000b'
          B_HOLDER='52010000-0000-4000-8000-000000000012'; B_ASSIGN='52010000-0000-4000-8000-000000000013'
          C_HOLDER='52010000-0000-4000-8000-000000000022'; C_ASSIGN='52010000-0000-4000-8000-000000000023'
          REQ='RS_TRIAL_REQUEST_RESTORATION_VERIFICATION'; VERIFY='RS_TRIAL_VERIFY_RESTORATION_EVIDENCE'; TERM='RS_TRIAL_SUBMIT_TERMINAL_DISPOSITION_CLAIM'
          D1='APPTS.CORE.D01.PRETICKET_ADMISSION.SUBMISSION / 1.0.0'; TRAIN='APPTS.TLS.DAY2.TRAINER.TRIGGER / 1.0.0'; ACTION='INT-RUN-TD-05'
          def get(path):
              with urllib.request.urlopen(BASE+path,timeout=30) as r: return json.loads(r.read().decode())
          def post(contract,payload):
              req=urllib.request.Request(BASE+'/intents',data=json.dumps({'intent_contract_ref':contract,'payload':payload}).encode(),headers={'content-type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace'); raise AssertionError(f'HTTP {e.code}: {raw}')
          def ts(): return datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          def form_active(prefix):
              positive={'messageId':prefix+'0001','idempotencyKey':prefix+'0002','correlationId':prefix+'0003','trialContext':'TLS-DAY1-GOLDEN'}
              formed=post(D1,positive)
              assert formed['disposition']=='CREATED' and formed['decision']=='ACCEPTED_FOR_FORMATION' and formed['state']=='ACCEPTED' and formed['aggregateVersion']==0, formed
              ticket=formed['ticketId']; before=get('/tickets/'+ticket); d=before['data']
              assert d['current_state_code']=='ACCEPTED' and d['available_actions']==['ACTIVATE'], d
              act={'action_intent_id':str(uuid.uuid4()),'ticket_id':ticket,'actor_ref':A_HOLDER,'role_assignment_ref':A_ASSIGN,'requested_action_class':'ACTIVATE','presented_source_version_ref':before['source_version_set_ref'],'expected_aggregate_version':0,'intent_time':ts()}
              out=post(ACTION,act); assert out['result']=='EFFECT_APPLIED' and out['state']=='ACTIVE' and out['aggregateVersion']==1, out
              active=get('/tickets/'+ticket); ad=active['data']
              assert ad['current_state_code']=='ACTIVE' and ad['aggregate_version']==1 and ad['day2_stage']=='AWAITING_CONTROLLED_DAY2_TRIGGER' and ad['day2_trainer_available'] is True, ad
              return ticket,active
          ticket,active=form_active('55010000-0000-4000-8000-')
          json.dump(active,open(E+'/active-before-day2.json','w'))
          trig=post(TRAIN,{'ticketId':ticket,'scenarioRunRef':'TLS-D2-RUN-001'})
          assert trig['result']=='ACK' and trig['durable'] is True and trig['state']=='ACTIVE' and trig['contract']=='INT-RUN-TD-01', trig
          after_trig=get('/tickets/'+ticket); td=after_trig['data']
          assert td['current_state_code']=='ACTIVE' and td['aggregate_version']==1, td
          assert td['available_actions']==[REQ] and TERM not in td['available_actions'], td
          evidence=get('/tickets/'+ticket+'/concerns/evidence'); ed=evidence['data']
          assert ed['source_identity']=='SIM-NMS-RS-TLS-D2-01' and ed['adapter_profile_identity']=='SIM-RS-QER-PROFILE-V1', ed
          assert ed['scenario_run_ref']=='TLS-D2-RUN-001' and ed['event_class']=='SERVICE_RESTORATION_INDICATION' and ed['indicated_condition']=='AVAILABLE', ed
          assert ed['truth_posture']=='PROVISIONAL_PENDING_INDEPENDENT_VERIFICATION' and ed['verification_status']=='NOT_REQUESTED', ed
          json.dump({'trigger':trig,'ticket':after_trig,'evidence':evidence},open(E+'/provisional.json','w'))

          req_action={'action_intent_id':str(uuid.uuid4()),'ticket_id':ticket,'actor_ref':A_HOLDER,'role_assignment_ref':A_ASSIGN,'requested_action_class':REQ,'presented_source_version_ref':after_trig['source_version_set_ref'],'expected_aggregate_version':1,'intent_time':ts()}
          requested=post(ACTION,req_action); assert requested['result']=='ACK' and requested['state']=='ACTIVE', requested
          after_req=get('/tickets/'+ticket); rd=after_req['data']; assert rd['available_actions']==[VERIFY] and TERM not in rd['available_actions'], rd

          wrong={'action_intent_id':str(uuid.uuid4()),'ticket_id':ticket,'actor_ref':A_HOLDER,'role_assignment_ref':A_ASSIGN,'requested_action_class':VERIFY,'presented_source_version_ref':after_req['source_version_set_ref'],'expected_aggregate_version':1,'intent_time':ts()}
          rejected=post(ACTION,wrong); assert rejected['result']=='NACK' and rejected['durable'] is True and rejected['state']=='ACTIVE' and rejected['terminalClaimAvailable'] is False, rejected
          after_wrong=get('/tickets/'+ticket); assert after_wrong['data']['available_actions']==[VERIFY] and TERM not in after_wrong['data']['available_actions'], after_wrong

          valid={'action_intent_id':str(uuid.uuid4()),'ticket_id':ticket,'actor_ref':B_HOLDER,'role_assignment_ref':B_ASSIGN,'requested_action_class':VERIFY,'presented_source_version_ref':after_wrong['source_version_set_ref'],'expected_aggregate_version':1,'intent_time':ts()}
          verified=post(ACTION,valid); assert verified['result']=='ACK' and verified['verificationResult']=='VERIFIED' and verified['terminalClaimAvailable'] is True, verified
          after_verify=get('/tickets/'+ticket); vd=after_verify['data']; assert vd['available_actions']==[TERM], vd
          ctl=vd['action_controls'][0]; assert ctl['actor_ref']==C_HOLDER and ctl['role_assignment_ref']==C_ASSIGN, ctl
          verified_evidence=get('/tickets/'+ticket+'/concerns/evidence'); ved=verified_evidence['data']; assert ved['verification_status']=='VERIFIED' and ved['verifier_ref']==B_HOLDER and ved['truth_posture']=='INDEPENDENTLY_VERIFIED', ved
          json.dump({'wrongVerifier':rejected,'validVerifier':verified,'ticket':after_verify,'evidence':verified_evidence},open(E+'/verification.json','w'))

          terminal={'action_intent_id':str(uuid.uuid4()),'ticket_id':ticket,'actor_ref':C_HOLDER,'role_assignment_ref':C_ASSIGN,'requested_action_class':TERM,'presented_source_version_ref':after_verify['source_version_set_ref'],'expected_aggregate_version':1,'intent_time':ts()}
          applied=post(ACTION,terminal); assert applied['result']=='EFFECT_APPLIED' and applied['durable'] is True and applied['state']=='TERMINAL_PROCESSING' and applied['aggregateVersion']==2 and applied['closeActionAvailable'] is False, applied
          replay=post(ACTION,terminal); assert replay['result']=='EFFECT_APPLIED' and replay['replay'] is True and replay['state']=='TERMINAL_PROCESSING' and replay['aggregateVersion']==2, replay
          final=get('/tickets/'+ticket); fd=final['data']; assert fd['current_state_code']=='TERMINAL_PROCESSING' and fd['aggregate_version']==2 and fd['available_actions']==[] and fd['close_action_available'] is False, fd
          assert 'SET_TERMINAL_PROCESSING' not in fd['available_actions'] and 'CLOSE' not in fd['available_actions'], fd
          closure=get('/tickets/'+ticket+'/concerns/closure'); cd=closure['data']; assert cd['current_state_code']=='TERMINAL_PROCESSING' and cd['close_action_available'] is False and cd['closure_posture']=='TERMINAL_PROCESSING_NOT_CLOSED' and cd['day2_boundary']=='NO_CLOSE_ACTION_AUTHORIZED', cd
          json.dump({'terminal':applied,'replay':replay,'ticket':final,'closure':closure},open(E+'/terminal.json','w'))
          open(E+'/ticket-id.txt','w').write(ticket)

          # Deterministic rerun: new governed Ticket, distinct scenario_run_ref, no terminal manufacture.
          ticket2,_=form_active('55020000-0000-4000-8000-')
          trig2=post(TRAIN,{'ticketId':ticket2,'scenarioRunRef':'TLS-D2-RUN-002'})
          assert trig2['result']=='ACK' and trig2['state']=='ACTIVE', trig2
          e2=get('/tickets/'+ticket2+'/concerns/evidence'); assert e2['data']['scenario_run_ref']=='TLS-D2-RUN-002', e2
          t2=get('/tickets/'+ticket2); assert t2['data']['current_state_code']=='ACTIVE' and t2['data']['aggregate_version']==1, t2
          json.dump({'ticketId':ticket2,'trigger':trig2,'evidence':e2,'ticket':t2},open(E+'/rerun.json','w'))
          print(ticket)
          PY

          ticket="$(cat /tmp/codex055-evidence/ticket-id.txt)"
          CHROME=""
          for c in google-chrome google-chrome-stable chromium chromium-browser; do command -v "$c" >/dev/null 2>&1 && CHROME="$(command -v "$c")" && break; done
          test -n "$CHROME"
          "$CHROME" --version | tee /tmp/codex055-evidence/browser-version.txt
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/trainer/tls-day2?ticket=$ticket" > /tmp/codex055-evidence/trainer.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/tickets/$ticket/evidence" > /tmp/codex055-evidence/evidence.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/tickets/$ticket" > /tmp/codex055-evidence/ticket-final.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/tickets/$ticket/closure" > /tmp/codex055-evidence/closure.html
          grep -Fq 'Simulation control plane — not AppTS business authority' /tmp/codex055-evidence/trainer.html
          grep -Fq 'SIM-NMS-RS-TLS-D2-01' /tmp/codex055-evidence/trainer.html
          grep -Fq 'INT-RUN-TD-01' /tmp/codex055-evidence/trainer.html
          grep -Fq 'INDEPENDENTLY_VERIFIED' /tmp/codex055-evidence/evidence.html
          grep -Fq 'TRIAL-HOLDER-VERIFY-B' /tmp/codex055-evidence/evidence.html || grep -Fq '52010000-0000-4000-8000-000000000012' /tmp/codex055-evidence/evidence.html
          grep -Fq 'TERMINAL_PROCESSING' /tmp/codex055-evidence/ticket-final.html
          grep -Fq 'TERMINAL_PROCESSING_NOT_CLOSED' /tmp/codex055-evidence/closure.html
          grep -Fq 'NO_CLOSE_ACTION_AUTHORIZED' /tmp/codex055-evidence/closure.html

          PGPASSWORD=codex055-migration-local-only psql -X -At -F '|' -h 127.0.0.1 -U appts_migration -d appts_dep001_codex055 <<'SQL' | tee /tmp/codex055-evidence/durable-readback.txt
          SELECT 'runtime_terminal='||count(*) FROM appts.runtime_ticket WHERE current_state_code='TERMINAL_PROCESSING' AND aggregate_version=2;
          SELECT 'qer='||count(*) FROM appts.qualified_external_record WHERE source_system_ref_id='52010000-0000-4000-8000-000000000003'::uuid;
          SELECT 'verification_requests='||count(*) FROM appts.verification_request;
          SELECT 'verification_verified='||count(*) FROM appts.verification_result WHERE result_code='VERIFIED';
          SELECT 'verification_nonverified='||count(*) FROM appts.verification_result WHERE result_code<>'VERIFIED';
          SELECT 'terminal_claims='||count(*) FROM appts.claim_record WHERE claim_type_ref='TERMINAL_DISPOSITION_CLAIM';
          SELECT 'terminal_effect_requests='||count(*) FROM appts.lifecycle_effect_request WHERE requested_effect_class='TERMINAL_DISPOSITION_CLAIM';
          SELECT 'terminal_transitions='||count(*) FROM appts.runtime_state_transition WHERE to_state_code='TERMINAL_PROCESSING';
          SELECT 'closed_tickets='||count(*) FROM appts.runtime_ticket WHERE current_state_code='CLOSED';
          SQL
          grep -Fxq 'runtime_terminal=1' /tmp/codex055-evidence/durable-readback.txt
          grep -Fxq 'qer=2' /tmp/codex055-evidence/durable-readback.txt
          grep -Fxq 'verification_requests=1' /tmp/codex055-evidence/durable-readback.txt
          grep -Fxq 'verification_verified=1' /tmp/codex055-evidence/durable-readback.txt
          grep -Fxq 'verification_nonverified=1' /tmp/codex055-evidence/durable-readback.txt
          grep -Fxq 'terminal_claims=1' /tmp/codex055-evidence/durable-readback.txt
          grep -Fxq 'terminal_effect_requests=1' /tmp/codex055-evidence/durable-readback.txt
          grep -Fxq 'terminal_transitions=1' /tmp/codex055-evidence/durable-readback.txt
          grep -Fxq 'closed_tickets=0' /tmp/codex055-evidence/durable-readback.txt
          printf '%s\n' \
            'CODEX055_PRODUCER_RUNTIME=PASS' \
            'EVENT_ALONE_ACTIVE=PASS' \
            'WRONG_VERIFIER_FAIL_CLOSED=PASS' \
            'VALID_INDEPENDENT_VERIFIER=PASS' \
            'TERMINAL_CLAIM_GATE_D04=PASS' \
            'ACTIVE_TO_TERMINAL_PROCESSING=PASS' \
            'CLOSE_WITHHELD=PASS' \
            'REPLAY_NO_DUPLICATE_EFFECT=PASS' \
            'RESEED_RERUN_DISTINCT_SCENARIO_RUN=PASS' \
            'ACTUAL_BROWSER_SURFACES=PASS' | tee /tmp/codex055-evidence/SUMMARY.txt

      - name: Upload producer runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: CODEX055_PRODUCER_RUNTIME_EVIDENCE
          path: /tmp/codex055-evidence
          if-no-files-found: error
          retention-days: 30
