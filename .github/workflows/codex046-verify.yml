name: CODEX046 HTTP composition self-verification
on:
  push:
    branches: [mcr/codex046-http-composition-verify]
  pull_request:
    branches: [experiment/independent-restore-deploy]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: appts_codex046
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: codex046-local-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d appts_codex046"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        shell: bash
        working-directory: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0 }
      - name: Exact toolchain and lock install
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply architecture-owned PostgreSQL binding correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "packages/persistence/src/index.ts",
              'import { Pool, type PoolConfig } from "pg";',
              'import { Pool, type PoolClient, type PoolConfig } from "pg";\n\nexport type PersistencePool = Pool;\nexport type PersistenceClient = PoolClient;',
          )
          replace(
              "apps/api/src/dep-bootstrap.ts",
              'import { Pool } from "pg";',
              'import { createPersistencePool, type PersistencePool } from "@appts-restore-service/persistence";',
          )
          replace("apps/api/src/dep-bootstrap.ts", "readonly pool?: Pool;", "readonly pool?: PersistencePool;")
          replace(
              "apps/api/src/dep-bootstrap.ts",
              "? new Pool({ connectionString: config.databaseUrl })",
              "? createPersistencePool({ connectionString: config.databaseUrl })",
          )
          replace(
              "apps/api/src/projections/trial-projection-port.ts",
              'import type { Pool } from "pg";',
              'import type { PersistencePool } from "@appts-restore-service/persistence";',
          )
          replace("apps/api/src/projections/trial-projection-port.ts", "pool: Pool", "pool: PersistencePool")
          replace(
              "apps/api/src/trial/pre-ticket-trial-owner-flow.ts",
              'import type { Pool, PoolClient } from "pg";',
              'import type { PersistenceClient, PersistencePool } from "@appts-restore-service/persistence";',
          )
          replace("apps/api/src/trial/pre-ticket-trial-owner-flow.ts", "pool: Pool", "pool: PersistencePool")
          replace("apps/api/src/trial/pre-ticket-trial-owner-flow.ts", "client: PoolClient", "client: PersistenceClient")

          for package_path in ["packages/persistence/package.json", "packages/core-d01/package.json"]:
              p = Path(package_path)
              data = json.loads(p.read_text())
              data["main"] = "./dist/index.js"
              data["types"] = "./dist/index.d.ts"
              data["exports"] = {
                  ".": {
                      "types": "./dist/index.d.ts",
                      "import": "./dist/index.js",
                      "default": "./dist/index.js",
                  }
              }
              p.write_text(json.dumps(data, indent=2) + "\n")

          tsconfig = Path("apps/api/tsconfig.json")
          data = json.loads(tsconfig.read_text())
          refs = data.setdefault("references", [])
          if not any(item.get("path") == "../../packages/persistence" for item in refs):
              refs.append({"path": "../../packages/persistence"})
          tsconfig.write_text(json.dumps(data, indent=2) + "\n")

          replace(
              "Dockerfile.dep",
              "COPY packages/core-d01 packages/core-d01\nCOPY packages/observability packages/observability",
              "COPY packages/core-d01 packages/core-d01\nCOPY packages/observability packages/observability\nCOPY packages/persistence packages/persistence",
          )
          replace(
              "Dockerfile.dep",
              "COPY --from=build /workspace/packages/observability/dist ./packages/observability/dist",
              "COPY --from=build /workspace/packages/observability/dist ./packages/observability/dist\nCOPY --from=build /workspace/packages/persistence/dist ./packages/persistence/dist",
          )
          PY
          git diff --check
      - name: Typecheck build and accepted suites
        run: |
          set -euo pipefail
          npm run verify:boundaries
          npm run typecheck
          npm run build
          npm run test:contracts
          npm run test:integration
          npm run test:dg04
          npm run test:adverse
          npm run test:unit
          npm run test:nfr
          mapfile -t dep_tests < <(find tests/dep001 -maxdepth 1 -type f \( -name '*.test.ts' -o -name '*.test.mjs' \) ! -name 'hardening.test.mjs' ! -name 'network-mode.test.mjs' ! -name 'schema-freeze.test.mjs' | sort)
          test "${#dep_tests[@]}" -gt 0
          node --experimental-strip-types --test "${dep_tests[@]}"
      - name: Prove unchanged stale DEP baseline failures
        working-directory: .
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"
          git cat-file -e "$base^{commit}"
          git worktree add --detach /tmp/codex046-base "$base"
          stale=(tests/dep001/hardening.test.mjs tests/dep001/network-mode.test.mjs tests/dep001/schema-freeze.test.mjs)
          set +e
          (cd /tmp/codex046-base/DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001 && node --experimental-strip-types --test "${stale[@]}") >/tmp/base-stale.tap 2>&1
          base_rc=$?
          (cd DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001 && node --experimental-strip-types --test "${stale[@]}") >/tmp/head-stale.tap 2>&1
          head_rc=$?
          set -e
          test "$base_rc" -ne 0
          test "$head_rc" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              "runtime privilege construction is quarantined and has no grant SQL",
              "runtime quarantine verifies with a shell-level fake client and then STOPs",
              "all database entrypoint scripts use the explicit network guard",
              "schema freeze guard passes without mutating the deployment source",
              "failing tests:",
          }
          def names(path):
              result=[]
              for line in Path(path).read_text().splitlines():
                  line=line.strip()
                  if line.startswith("✖ "):
                      name=line[2:].strip()
                      if " (" in name:
                          name=name.rsplit(" (",1)[0]
                      result.append(name)
              return set(result)
          base=names('/tmp/base-stale.tap')
          head=names('/tmp/head-stale.tap')
          if base != expected or head != expected:
              raise SystemExit(f"stale failure set changed: base={sorted(base)} head={sorted(head)}")
          print('BASELINE_STALE_FAILURE_EQUIVALENCE=PASS')
          PY
          cat /tmp/base-stale.tap
          cat /tmp/head-stale.tap
      - name: Docker build
        run: docker build -f Dockerfile.dep -t codex046-dep-api:verify .
      - name: V001-V004 and schema verifiers
        env: { PGPASSWORD: codex046-local-only }
        run: |
          set -euo pipefail
          pgcid="$(docker ps --filter ancestor=postgres:17.11-bookworm -q | head -n1)"; test -n "$pgcid"
          for f in db/migrations/V001__cf01_core_schema.sql db/migrations/V002__cf01_runtime_and_exchange_schema.sql db/migrations/V003__dg04_diagnostic_persistence.sql db/migrations/V004__d05_pending_capture_v2.sql; do docker exec -e PGPASSWORD="$PGPASSWORD" -i "$pgcid" psql -X -v ON_ERROR_STOP=1 -U postgres -d appts_codex046 < "$f"; done
          for f in db/verify/001_cf01_constraints.sql db/verify/002_cf01_history_inbox_outbox.sql db/verify/003_dg04_diagnostics.sql; do docker exec -e PGPASSWORD="$PGPASSWORD" -e PGTZ=UTC -i "$pgcid" psql -X -v ON_ERROR_STOP=1 -U postgres -d appts_codex046 < "$f"; done
      - name: HTTP composition governed replay and no-ticket check
        env:
          DATABASE_URL: postgresql://postgres:codex046-local-only@127.0.0.1:5432/appts_codex046
          API_LISTEN_PORT: "8080"
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
          PGPASSWORD: codex046-local-only
        run: |
          set -euo pipefail
          node apps/api/dist/dep-bootstrap.js >/tmp/codex046-api.log 2>&1 & api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true; cat /tmp/codex046-api.log || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8080/healthz >/tmp/health.json && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8080/healthz | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:8080/readyz | tee /tmp/ready.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/ui/work-queue | tee /tmp/work-before.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/ui/intake | tee /tmp/intake-before.json
          printf '%s' '{"intent_contract_ref":"APPTS.CORE.D01.PRETICKET_ADMISSION.SUBMISSION / 1.0.0","payload":{"messageId":"10000000-0000-4000-8000-000000000001","idempotencyKey":"20000000-0000-4000-8000-000000000001","correlationId":"30000000-0000-4000-8000-000000000001","trialContext":"TD-PRE-001"}}' >/tmp/intent.json
          curl --fail --silent -H 'content-type: application/json' --data-binary @/tmp/intent.json http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/first.json
          curl --fail --silent -H 'content-type: application/json' --data-binary @/tmp/intent.json http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/second.json
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("/tmp/intent.json"));p.payload.conflictProbe=true;fs.writeFileSync("/tmp/conflict.json",JSON.stringify(p))'
          curl --fail --silent -H 'content-type: application/json' --data-binary @/tmp/conflict.json http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/conflict-result.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/ui/intake | tee /tmp/intake-after.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/ui/work-queue | tee /tmp/work-after.json
          node - <<'NODE'
          const fs=require('fs'),j=p=>JSON.parse(fs.readFileSync(p));
          const h=j('/tmp/health.json'),r=j('/tmp/ready.json'),w0=j('/tmp/work-before.json'),i0=j('/tmp/intake-before.json'),a=j('/tmp/first.json'),b=j('/tmp/second.json'),x=j('/tmp/conflict-result.json'),i=j('/tmp/intake-after.json'),w=j('/tmp/work-after.json');
          if(h.status!=='ok'||r.status!=='ready'||w0.data.ticket_count!==0||i0.data.case_count!==0) throw Error('initial HTTP mismatch');
          if(a.disposition!=='CREATED'||a.assessmentResult!=='NOT_ACCEPTABLE'||a.decision!=='HOLD_AS_PRE_TICKET') throw Error('owner mismatch');
          if(b.disposition!=='IDEMPOTENT_REPLAY'||b.caseId!==a.caseId||x.disposition!=='CONFLICT_HOLD') throw Error('replay mismatch');
          const c=i.data.cases[0]; if(i.data.case_count!==1||c.case_id!==a.caseId||c.case_status_ref!=='HOLD_AS_PRE_TICKET'||c.assessment_result!=='NOT_ACCEPTABLE'||c.completeness_result!=='MISSING'||c.completeness_reason!=='INCOMPLETE_MANDATORY_FACTS'||w.data.ticket_count!==0) throw Error('projection/no-ticket mismatch');
          console.log(JSON.stringify({first:a,second:b,conflict:x,intake:i,work:w},null,2));
          NODE
          pgcid="$(docker ps --filter ancestor=postgres:17.11-bookworm -q | head -n1)"
          counts="$(docker exec -e PGPASSWORD="$PGPASSWORD" "$pgcid" psql -X -At -U postgres -d appts_codex046 -c "SELECT (SELECT count(*) FROM appts.ticket_identity)||'|'||(SELECT count(*) FROM appts.ticket_formation_record)||'|'||(SELECT count(*) FROM appts.runtime_ticket)||'|'||(SELECT count(*) FROM appts.pre_ticket_case);")"
          echo "db_counts=$counts"; test "$counts" = "0|0|0|1"
      - name: Build deterministic DT transfer overlay
        if: success()
        working-directory: .
        run: |
          set -euo pipefail
          root='DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001'
          base="$(git rev-parse HEAD^1)"
          mkdir -p codex046-transfer/overlay
          mapfile -t files < <(git diff --name-only "$base" -- "$root")
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            rel="${file#${root}/}"
            mkdir -p "codex046-transfer/overlay/$(dirname "$rel")"
            cp "$file" "codex046-transfer/overlay/$rel"
          done
          (cd codex046-transfer/overlay && find . -type f -print0 | sort -z | xargs -0 sha256sum) > codex046-transfer/FILES.sha256
          git diff --binary "$base" -- "$root" > codex046-transfer/CODEX046_CONSTRUCTION.patch
          printf 'base=%s\nhead=%s\n' "$base" "$GITHUB_SHA" > codex046-transfer/IDENTITY.txt
          cat > codex046-transfer/APPLY_AND_VERIFY.md <<'EOF'
          Apply only to the admitted RESTORE_SERVICE DT source derived from the MCR-accepted CODEX056 transfer and current DT Stage 3.2 source. Copy overlay/ paths over the source root, then verify each SHA-256 in FILES.sha256. Do not apply to Production/UAT or real-data environments. Re-run exact Node 24.19.0 / npm 11.17.0 build/tests, V001-V004 verifiers, health/readiness, UI read endpoints, TD-PRE-001 CREATED -> IDEMPOTENT_REPLAY -> CONFLICT_HOLD, and confirm zero Ticket manufacture for the incomplete Trial case.
          EOF
      - name: Evidence
        if: always()
        working-directory: .
        run: |
          mkdir -p codex046-evidence
          cp /tmp/health.json /tmp/ready.json /tmp/work-before.json /tmp/intake-before.json /tmp/first.json /tmp/second.json /tmp/conflict-result.json /tmp/intake-after.json /tmp/work-after.json /tmp/codex046-api.log /tmp/base-stale.tap /tmp/head-stale.tap codex046-evidence/ 2>/dev/null || true
          printf 'commit=%s\nnode=24.19.0\nnpm=11.17.0\n' "$GITHUB_SHA" >codex046-evidence/IDENTITY.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex046-self-verification-${{ github.run_id }}
          path: codex046-evidence
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: codex046-dt-transfer-${{ github.run_id }}
          path: codex046-transfer
          retention-days: 30
