            "ticket_id=${ticket_id}" \
            "qer_id=${qer_id}" \
            > /tmp/dt022-evidence/SUMMARY.txt
          cat /tmp/dt022-evidence/SUMMARY.txt

      - name: Upload immutable DT MCR022 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dt-mcr022-transport-neutral-independent-evidence
          path: /tmp/dt022-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Publish safe DT MCR022 pointer
        if: success()
        run: |
          set -euo pipefail
          mkdir -p ../../../INDEPENDENT_DEPLOYMENT/evidence
          cat > ../../../INDEPENDENT_DEPLOYMENT/evidence/LAST_MCR022_VERIFICATION.md <<EOF
          # DT MCR-022 Transport-Neutral Independent Verification

          run_id: ${GITHUB_RUN_ID}
          verification_branch: experiment/dt-mcr022-transport-neutral
          admitted_baseline: 685e900545c686f1c2e802ff1e712394d1d324f6
          product_source_changed: NO
