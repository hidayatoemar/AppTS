name: staging-os-baseline

on:
  push:
    branches: [mcr/staging-integration-prep]
    paths:
      - '.github/workflows/staging-os-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      VERIFIED_SHA: 01097454cc73b9917b284c876af4c603856ebe6e
    steps:
      - name: Prepare pinned SSH identity
        shell: bash
        env:
          APPTS_STAGING_SSH_PRIVATE_KEY: ${{ secrets.APPTS_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${APPTS_STAGING_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$APPTS_STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/appts_staging"
          chmod 600 "$HOME/.ssh/appts_staging"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          103.127.99.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILpRJVkwh143CmmrMkQvgfNyRIbV964SsAYLZ3BlaGdh
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upgrade AlmaLinux 9 baseline
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$HOME/.ssh/appts_staging"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=12
          )
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 "
            set -euo pipefail
            echo before_os=\$(grep '^PRETTY_NAME=' /etc/os-release)
            echo before_kernel=\$(uname -r)
            sudo dnf -y upgrade --refresh
            latest_kernel=\$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel | sort -V | tail -1)
            running_kernel=\$(uname -r)
            echo latest_kernel=\$latest_kernel
            echo running_kernel=\$running_kernel
            if [ \"\$latest_kernel\" != \"\$running_kernel\" ]; then
              echo reboot_required=YES
              sudo systemctl reboot
            else
              echo reboot_required=NO
            fi
          " || true

      - name: Wait for pinned SSH after possible reboot
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$HOME/.ssh/appts_staging"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=8
          )
          for attempt in $(seq 1 60); do
            if ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 'echo ssh_ready=YES' >/tmp/ssh-ready 2>/dev/null; then
              cat /tmp/ssh-ready
              exit 0
            fi
            sleep 5
          done
          echo "staging SSH did not return within 5 minutes"
          exit 1

      - name: Verify upgraded host and deployed kernel continuity
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$HOME/.ssh/appts_staging"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=12
          )
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 "
            set -euo pipefail
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
            echo kernel=\$(uname -r)
            echo node=\$(node --version)
            test \"\$(cat /opt/appts-restore-service/current/DEPLOYED_COMMIT)\" = '$VERIFIED_SHA'
            node --input-type=module -e \"const m=await import('file:///opt/appts-restore-service/current/dist/src/index.js'); if(!m||Object.keys(m).length===0) process.exit(1); console.log('kernel_import_after_os_upgrade=PASS exports='+Object.keys(m).length)\"
            ss -lnt
            echo staging_os_baseline=PASS
          "
