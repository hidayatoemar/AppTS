name: CODEX055 one-off projection rollover correction
on:
  push:
    branches: [mcr/codex055-day2-arc001-candidate]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcr/codex055-day2-arc001-candidate
      - shell: python
        run: |
          from pathlib import Path
          p=Path('DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/tls-day2-arc001-flow.ts')
          s=p.read_text()
          marker='if (input.progressionAllowed) await client.query("INSERT INTO appts.progression_class(envelope_id,progression_class_ref) VALUES($1,$2)", [progressionEnvelope,input.actionClass]);\n  await client.query(`INSERT INTO appts.authority_projection'
          replacement='if (input.progressionAllowed) await client.query("INSERT INTO appts.progression_class(envelope_id,progression_class_ref) VALUES($1,$2)", [progressionEnvelope,input.actionClass]);\n  await client.query("UPDATE appts.authority_projection SET effective_to=$1 WHERE ticket_id=$2 AND effective_to IS NULL", [at,input.ticketId]);\n  await client.query("UPDATE appts.gate_projection SET effective_to=$1 WHERE ticket_id=$2 AND effective_to IS NULL", [at,input.ticketId]);\n  await client.query(`INSERT INTO appts.authority_projection'
          if replacement in s: raise SystemExit(0)
          if marker not in s: raise SystemExit('projection insertion marker not found')
          p.write_text(s.replace(marker,replacement,1))
      - shell: bash
        run: |
          set -euo pipefail
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/tls-day2-arc001-flow.ts
          git commit -m 'fix(codex055): roll current authority and gate projections'
          git push origin HEAD:mcr/codex055-day2-arc001-candidate
