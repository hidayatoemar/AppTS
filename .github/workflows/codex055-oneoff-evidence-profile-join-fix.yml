name: CODEX055 one-off evidence adapter profile join correction
on:
  push:
    branches: [mcr/codex055-day2-arc001-candidate]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcr/codex055-day2-arc001-candidate
      - shell: python
        run: |
          from pathlib import Path
          p=Path('DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/projections/trial-projection-port.ts')
          s=p.read_text()
          old='LEFT JOIN appts.adapter_profile_ref a ON a.adapter_profile_ref_id=q.adapter_profile_ref_id'
          new='LEFT JOIN appts.adapter_profile_ref a ON a.source_system_ref_id=q.source_system_ref_id'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('expected adapter profile join fragment not found')
          p.write_text(s.replace(old,new,1))
      - shell: bash
        run: |
          set -euo pipefail
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/projections/trial-projection-port.ts
          git commit -m 'fix(codex055): resolve adapter profile via source system'
          git push origin HEAD:mcr/codex055-day2-arc001-candidate
