name: DT Day-3 MCR-020 DNS gate

on:
  push:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - INDEPENDENT_DEPLOYMENT/DAY3_DNS_REQUEST

permissions:
  contents: write
  actions: read

concurrency:
  group: dt-day3-dns-gate
  cancel-in-progress: false

jobs:
  dns-gate:
    if: github.ref == 'refs/heads/experiment/independent-restore-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INDEP_HOST: ${{ secrets.INDEP_HOST }}
    steps:
      - name: Checkout controlled DT branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate MCR-to-DT-020 gate prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < INDEPENDENT_DEPLOYMENT/DAY3_DNS_REQUEST)" = 'MCR_TO_DT_020 DNS_FACTUAL_BINDING_GATE'
          bash -n INDEPENDENT_DEPLOYMENT/scripts/day3-dns-gate.sh
          grep -Fxq 'job_status: success' INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_AUTH_FINALIZER_RUN.md
          grep -Fxq 'authentication_gate: PASS' INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_AUTH_FINALIZER_RUN.md
          grep -Fxq 'public_activation: NOT_PERFORMED' INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_AUTH_FINALIZER_RUN.md
          test -n "$INDEP_HOST"
          echo 'REQUEST_VALIDATION=PASS' >> "$GITHUB_ENV"
          echo 'AUTH_PREREQUISITE=PASS' >> "$GITHUB_ENV"
          echo 'TARGET_BINDING=PASS' >> "$GITHUB_ENV"

      - name: Execute factual DNS binding gate
        shell: bash
        run: |
          set -euo pipefail
          bash INDEPENDENT_DEPLOYMENT/scripts/day3-dns-gate.sh 2>&1 | tee INDEPENDENT_DEPLOYMENT/evidence/day3-dns-run-${GITHUB_RUN_ID}.txt
          summary="INDEPENDENT_DEPLOYMENT/evidence/day3-dns-${GITHUB_RUN_ID}/02-summary.txt"
          if grep -Fxq 'dns_gate=PASS' "$summary"; then
            echo 'DNS_GATE=PASS' >> "$GITHUB_ENV"
          else
            echo 'DNS_GATE=STOP' >> "$GITHUB_ENV"
          fi
          blocker="$(awk -F= '/^first_blocker=/{print $2}' "$summary")"
          echo "FIRST_BLOCKER=${blocker:-UNKNOWN}" >> "$GITHUB_ENV"
          echo 'ACTION_EXECUTION=PASS' >> "$GITHUB_ENV"

      - name: Upload DNS gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-restore-day3-dns-evidence-${{ github.run_id }}
          path: INDEPENDENT_DEPLOYMENT/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish safe DNS gate pointer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p INDEPENDENT_DEPLOYMENT/evidence
          cat > INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_DNS_RUN.md <<EOF
          # Independent Deployment Day-3 DNS Gate Last Run

          run_id: ${GITHUB_RUN_ID}
          trigger_commit: ${GITHUB_SHA}
          job_status: ${{ job.status }}
          request_validation: ${REQUEST_VALIDATION:-NOT_REACHED}
          authentication_prerequisite: ${AUTH_PREREQUISITE:-NOT_REACHED}
          target_binding: ${TARGET_BINDING:-NOT_REACHED}
          action_execution: ${ACTION_EXECUTION:-NOT_REACHED}
          dns_gate: ${DNS_GATE:-NOT_REACHED}
          first_blocker: ${FIRST_BLOCKER:-UNKNOWN}
          public_activation: NOT_PERFORMED
          recorded_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          No target IP, credential, or secret value is written to this pointer.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_DNS_RUN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(experiment): record MCR-020 DNS gate evidence'
          git push origin HEAD:refs/heads/experiment/independent-restore-deploy
