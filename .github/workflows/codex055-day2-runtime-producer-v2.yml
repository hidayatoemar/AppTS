name: CODEX055 Day-2 producer runtime proof v2
on:
  pull_request:
    branches: [experiment/independent-restore-deploy]
    paths:
      - '.github/workflows/codex055-day2-runtime-producer-v2.yml'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/**'
permissions:
  contents: read
jobs:
  producer-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-bookworm
        env: {POSTGRES_PASSWORD: codex055-superuser-local-only}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/package-lock.json
      - name: Frozen source and build gate
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          npm ci
          base=b5551eddbbcd82675997c740b5471bb3cc74241b
          git diff --exit-code "$base" -- apps/api/src/trial/pre-ticket-trial-owner-flow.ts apps/api/src/trial/tls-day1-golden-flow.ts deploy/db/seed-tls-day1-golden.sql deploy/db/grant-runtime.sh db/migrations/V001__cf01_core_schema.sql db/migrations/V002__cf01_runtime_and_exchange_schema.sql db/migrations/V003__dg04_diagnostic_persistence.sql db/migrations/V004__d05_pending_capture_v2.sql package-lock.json
          npm run verify:boundaries
          npm run typecheck
          npm run build
      - name: Disposable PostgreSQL 17 least-privilege setup
        run: |
          set -euo pipefail
          db=appts_dep001_codex055
          pgcid="$(docker ps --filter ancestor=postgres:17.11-bookworm -q | head -n1)"; test -n "$pgcid"
          PGPASSWORD=codex055-superuser-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<SQL
          CREATE ROLE appts_migration LOGIN PASSWORD 'codex055-migration-local-only' NOSUPERUSER INHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE appts_runtime LOGIN PASSWORD 'codex055-runtime-local-only' NOSUPERUSER NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE ${db} OWNER appts_migration;
          SQL
          for f in db/migrations/V001__cf01_core_schema.sql db/migrations/V002__cf01_runtime_and_exchange_schema.sql db/migrations/V003__dg04_diagnostic_persistence.sql db/migrations/V004__d05_pending_capture_v2.sql; do PGPASSWORD=codex055-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$f"; done
          docker cp deploy/db "$pgcid:/tmp/codex055-db"
          docker exec "$pgcid" chmod +x /tmp/codex055-db/grant-runtime.sh
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE="$db" -e PGUSER=appts_migration -e PGPASSWORD=codex055-migration-local-only -e APPTS_DB_NAME="$db" -e APPTS_MIGRATION_ROLE=appts_migration -e APPTS_RUNTIME_ROLE=appts_runtime -e 'APPTS_STAGING_LABEL=STAGING SIMULATION / NON-PRODUCTION' -e APPTS_DISPOSABLE_DATABASE=true -e APPTS_DB_NETWORK_MODE=LOOPBACK "$pgcid" /tmp/codex055-db/grant-runtime.sh
          for seed in deploy/db/seed-tls-day1-golden.sql deploy/db/seed-tls-day2-arc001.sql; do
            set +e; PGPASSWORD=codex055-runtime-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_runtime -d "$db" < "$seed" >/tmp/runtime-seed.out 2>/tmp/runtime-seed.err; rc=$?; set -e
            test "$rc" -ne 0; grep -qi 'must not run as appts_runtime' /tmp/runtime-seed.err
            PGPASSWORD=codex055-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$seed"
          done
          PGPASSWORD=codex055-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < deploy/db/seed-tls-day2-arc001.sql
          test "$(PGPASSWORD=codex055-migration-local-only psql -X -At -h 127.0.0.1 -U appts_migration -d "$db" -c 'select count(*) from appts.runtime_ticket')" = 0
          test "$(PGPASSWORD=codex055-runtime-local-only psql -X -At -h 127.0.0.1 -U appts_runtime -d "$db" -c 'select current_user')" = appts_runtime
      - name: Governed Day-1 to Day-2 proof
        env:
          DATABASE_URL: postgresql://appts_runtime:codex055-runtime-local-only@127.0.0.1:5432/appts_dep001_codex055
          API_LISTEN_PORT: 8080
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
        run: |
          set -euo pipefail
          mkdir -p /tmp/codex055-evidence
          node apps/api/dist/dep-bootstrap.js >/tmp/codex055-api.log 2>&1 & pid=$!; trap 'kill $pid 2>/dev/null || true; cat /tmp/codex055-api.log || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null && break || sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = '{"status":"ok"}'
          python3 tests/dep001/tls-day2-producer-runtime-proof.py | tee /tmp/codex055-evidence/runtime-harness.txt
          ticket="$(cat /tmp/codex055-evidence/ticket-id.txt)"
          CHROME=""; for c in google-chrome google-chrome-stable chromium chromium-browser; do command -v "$c" >/dev/null 2>&1 && CHROME="$(command -v "$c")" && break; done; test -n "$CHROME"
          "$CHROME" --version | tee /tmp/codex055-evidence/browser-version.txt
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/trainer/tls-day2?ticket=$ticket" > /tmp/codex055-evidence/trainer.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/tickets/$ticket/evidence" > /tmp/codex055-evidence/evidence.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/tickets/$ticket" > /tmp/codex055-evidence/ticket-final.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/tickets/$ticket/closure" > /tmp/codex055-evidence/closure.html
          grep -Fq 'Simulation control plane — not AppTS business authority' /tmp/codex055-evidence/trainer.html
          grep -Fq 'SIM-NMS-RS-TLS-D2-01' /tmp/codex055-evidence/trainer.html
          grep -Fq 'INT-RUN-TD-01' /tmp/codex055-evidence/trainer.html
          grep -Fq 'INDEPENDENTLY_VERIFIED' /tmp/codex055-evidence/evidence.html
          grep -Fq 'TERMINAL_PROCESSING' /tmp/codex055-evidence/ticket-final.html
          grep -Fq 'TERMINAL_PROCESSING_NOT_CLOSED' /tmp/codex055-evidence/closure.html
          grep -Fq 'NO_CLOSE_ACTION_AUTHORIZED' /tmp/codex055-evidence/closure.html
          PGPASSWORD=codex055-migration-local-only psql -X -At -h 127.0.0.1 -U appts_migration -d appts_dep001_codex055 <<'SQL' | tee /tmp/codex055-evidence/durable-readback.txt
          SELECT 'runtime_terminal='||count(*) FROM appts.runtime_ticket WHERE current_state_code='TERMINAL_PROCESSING' AND aggregate_version=2;
          SELECT 'qer='||count(*) FROM appts.qualified_external_record WHERE source_system_ref_id='52010000-0000-4000-8000-000000000003'::uuid;
          SELECT 'verification_requests='||count(*) FROM appts.verification_request;
          SELECT 'verification_verified='||count(*) FROM appts.verification_result WHERE result_code='VERIFIED';
          SELECT 'verification_nonverified='||count(*) FROM appts.verification_result WHERE result_code<>'VERIFIED';
          SELECT 'terminal_claims='||count(*) FROM appts.claim_record WHERE claim_type_ref='TERMINAL_DISPOSITION_CLAIM';
          SELECT 'terminal_effect_requests='||count(*) FROM appts.lifecycle_effect_request WHERE requested_effect_class='TERMINAL_DISPOSITION_CLAIM';
          SELECT 'terminal_transitions='||count(*) FROM appts.runtime_state_transition WHERE to_state_code='TERMINAL_PROCESSING';
          SELECT 'closed_tickets='||count(*) FROM appts.runtime_ticket WHERE current_state_code='CLOSED';
          SQL
          for x in runtime_terminal=1 qer=2 verification_requests=1 verification_verified=1 verification_nonverified=1 terminal_claims=1 terminal_effect_requests=1 terminal_transitions=1 closed_tickets=0; do grep -Fxq "$x" /tmp/codex055-evidence/durable-readback.txt; done
          printf '%s\n' CODEX055_PRODUCER_RUNTIME=PASS EVENT_ALONE_ACTIVE=PASS WRONG_VERIFIER_FAIL_CLOSED=PASS VALID_INDEPENDENT_VERIFIER=PASS TERMINAL_CLAIM_GATE_D04=PASS ACTIVE_TO_TERMINAL_PROCESSING=PASS CLOSE_WITHHELD=PASS REPLAY_NO_DUPLICATE_EFFECT=PASS RESEED_RERUN_DISTINCT_SCENARIO_RUN=PASS ACTUAL_BROWSER_SURFACES=PASS | tee /tmp/codex055-evidence/SUMMARY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CODEX055_PRODUCER_RUNTIME_EVIDENCE
          path: /tmp/codex055-evidence
          if-no-files-found: error
          retention-days: 30
