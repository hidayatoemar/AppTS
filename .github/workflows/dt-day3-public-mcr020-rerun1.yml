name: DT Day-3 MCR-020 public HTTPS external browser rerun1

on:
  push:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - INDEPENDENT_DEPLOYMENT/DAY3_PUBLIC_REQUEST_RERUN1

permissions:
  contents: write
  actions: read

concurrency:
  group: dt-day3-public-mcr020
  cancel-in-progress: false

jobs:
  public-day3-rerun1:
    if: github.ref == 'refs/heads/experiment/independent-restore-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INDEP_HOST: ${{ secrets.INDEP_HOST }}
      INDEP_USER: ${{ secrets.INDEP_USER }}
      INDEP_SSH_PRIVATE_KEY: ${{ secrets.INDEP_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout controlled DT branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact accepted Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Validate request, gates, and bounded correction
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'
          test "$(tr -d '\r\n' < INDEPENDENT_DEPLOYMENT/DAY3_PUBLIC_REQUEST_RERUN1)" = 'MCR_TO_DT_020 CONTROLLED_PUBLIC_HTTPS_EXTERNAL_BROWSER_RERUN1'
          grep -Fxq 'authentication_gate: PASS' INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_AUTH_FINALIZER_RUN.md
          grep -Fxq 'dns_gate: PASS' INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_DNS_RUN.md
          grep -Fxq 'first_blocker: NONE' INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_DNS_RUN.md
          bash -n INDEPENDENT_DEPLOYMENT/scripts/day3-public-activate.sh
          bash -n INDEPENDENT_DEPLOYMENT/scripts/day3-public-activate-rerun1.sh
          python3 -m py_compile INDEPENDENT_DEPLOYMENT/scripts/day3-public-browser-proof.py
          grep -Fq 'sudo stat -c %a /etc/appts-independent/trial-credentials.json' INDEPENDENT_DEPLOYMENT/scripts/day3-public-activate-rerun1.sh
          echo 'REQUEST_VALIDATION=PASS' >> "$GITHUB_ENV"
          echo 'AUTH_DNS_PREREQUISITES=PASS' >> "$GITHUB_ENV"
          echo 'MECHANICAL_CORRECTION=PASS_ROOT_ONLY_STAT' >> "$GITHUB_ENV"

      - name: Install external browser verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check selenium
          google-chrome --version
          echo 'BROWSER_VERIFIER_READY=PASS' >> "$GITHUB_ENV"

      - name: Validate target bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INDEP_HOST"
          test -n "$INDEP_USER"
          test -n "$INDEP_SSH_PRIVATE_KEY"
          echo 'SECRET_BINDINGS=PASS' >> "$GITHUB_ENV"

      - name: Prepare ephemeral SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$INDEP_SSH_PRIVATE_KEY" > ~/.ssh/independent_deploy_key
          chmod 600 ~/.ssh/independent_deploy_key
          ssh-keyscan -H "$INDEP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'TARGET_BINDING_PREPARED=PASS' >> "$GITHUB_ENV"

      - name: Activate controlled HTTPS and execute external browser Day-3
        id: execute
        shell: bash
        env:
          TRIAL_CREDENTIAL_FILE: /tmp/appts-day3-trial-credentials.json
        run: |
          set -euo pipefail
          bash INDEPENDENT_DEPLOYMENT/scripts/day3-public-activate-rerun1.sh 2>&1 | tee INDEPENDENT_DEPLOYMENT/evidence/day3-public-rerun1-${GITHUB_RUN_ID}.txt
          echo 'ACTION_EXECUTION=PASS' >> "$GITHUB_ENV"
          echo 'PUBLIC_RESULT=PASS' >> "$GITHUB_ENV"
          echo 'PUBLIC_ACTIVATION=ENABLED_VERIFIED' >> "$GITHUB_ENV"

      - name: Fail-closed public-edge rollback on verification failure
        if: failure() && steps.execute.outcome == 'failure'
        shell: bash
        run: |
          set +e
          ssh -i ~/.ssh/independent_deploy_key -o BatchMode=yes -o ConnectTimeout=10 "${INDEP_USER}@${INDEP_HOST}" \
            'sudo docker rm -f appts-independent-public-edge >/dev/null 2>&1 || true'
          for i in $(seq 1 10); do
            if timeout 3 bash -c "</dev/tcp/dev.appts.cifo.id/443" >/dev/null 2>&1; then sleep 1; else break; fi
          done
          if timeout 3 bash -c "</dev/tcp/dev.appts.cifo.id/443" >/dev/null 2>&1; then
            echo 'PUBLIC_ROLLBACK=INCOMPLETE' >> "$GITHUB_ENV"
          else
            echo 'PUBLIC_ROLLBACK=PASS_EDGE_STOPPED' >> "$GITHUB_ENV"
          fi
          echo 'PUBLIC_ACTIVATION=ROLLED_BACK_OR_NOT_VERIFIED' >> "$GITHUB_ENV"
          exit 0

      - name: Upload MCR-020 public rerun evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-restore-day3-public-rerun1-evidence-${{ github.run_id }}
          path: INDEPENDENT_DEPLOYMENT/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish safe MCR-020 public rerun pointer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p INDEPENDENT_DEPLOYMENT/evidence
          cat > INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_PUBLIC_RUN.md <<EOF
          # Independent Deployment Day-3 MCR-020 Public Last Run

          run_id: ${GITHUB_RUN_ID}
          trigger_commit: ${GITHUB_SHA}
          job_status: ${{ job.status }}
          request_validation: ${REQUEST_VALIDATION:-NOT_REACHED}
          auth_dns_prerequisites: ${AUTH_DNS_PREREQUISITES:-NOT_REACHED}
          mechanical_correction: ${MECHANICAL_CORRECTION:-NOT_REACHED}
          browser_verifier_ready: ${BROWSER_VERIFIER_READY:-NOT_REACHED}
          secret_bindings: ${SECRET_BINDINGS:-NOT_REACHED}
          target_binding_prepared: ${TARGET_BINDING_PREPARED:-NOT_REACHED}
          action_execution: ${ACTION_EXECUTION:-NOT_REACHED}
          public_result: ${PUBLIC_RESULT:-STOP}
          public_activation: ${PUBLIC_ACTIVATION:-NOT_PERFORMED}
          rollback: ${PUBLIC_ROLLBACK:-NOT_REQUIRED_OR_NOT_REACHED}
          recorded_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          No password, credential, private key, target IP, or credential hash is written to this pointer.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_PUBLIC_RUN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(experiment): record MCR-020 public rerun1 evidence'
          git push origin HEAD:refs/heads/experiment/independent-restore-deploy
