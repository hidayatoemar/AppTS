name: DT Day-3 Edge Readiness Rerun

on:
  push:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - INDEPENDENT_DEPLOYMENT/DAY3_EDGE_REQUEST_RERUN1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assess:
    runs-on: ubuntu-24.04
    env:
      INDEP_HOST: ${{ secrets.INDEP_HOST }}
      INDEP_USER: ${{ secrets.INDEP_USER }}
    steps:
      - name: Checkout controlled DT branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate request and harness
        run: |
          set -euo pipefail
          test -f INDEPENDENT_DEPLOYMENT/DAY3_EDGE_REQUEST_RERUN1
          test "$(tr -d '\r\n' < INDEPENDENT_DEPLOYMENT/DAY3_EDGE_REQUEST_RERUN1)" = 'MCR_TO_DT_018 DAY3_EDGE_READINESS_RERUN1'
          bash -n INDEPENDENT_DEPLOYMENT/scripts/day3-edge-readiness-v2.sh
          echo 'REQUEST_VALIDATION=PASS' >> "$GITHUB_ENV"

      - name: Validate target bindings
        env:
          INDEP_SSH_PRIVATE_KEY: ${{ secrets.INDEP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$INDEP_HOST"
          test -n "$INDEP_USER"
          test -n "$INDEP_SSH_PRIVATE_KEY"
          echo 'SECRET_BINDINGS=PASS' >> "$GITHUB_ENV"

      - name: Prepare ephemeral SSH
        env:
          INDEP_SSH_PRIVATE_KEY: ${{ secrets.INDEP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$INDEP_SSH_PRIVATE_KEY" > ~/.ssh/independent_deploy_key
          chmod 600 ~/.ssh/independent_deploy_key
          ssh-keyscan -H "$INDEP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'TARGET_BINDING_PREPARED=PASS' >> "$GITHUB_ENV"

      - name: Execute non-public Day-3 edge assessment
        run: |
          set -euo pipefail
          bash INDEPENDENT_DEPLOYMENT/scripts/day3-edge-readiness-v2.sh 2>&1 | tee INDEPENDENT_DEPLOYMENT/evidence/day3-edge-${GITHUB_RUN_ID}.txt
          echo 'ACTION_EXECUTION=PASS' >> "$GITHUB_ENV"
          summary="INDEPENDENT_DEPLOYMENT/evidence/day3-edge-${GITHUB_RUN_ID}/06-summary.txt"
          disposition="$(awk -F= '/^readiness_disposition=/{print $2}' "$summary")"
          blocker="$(awk -F= '/^first_blocker=/{print $2}' "$summary")"
          echo "READINESS_DISPOSITION=$disposition" >> "$GITHUB_ENV"
          echo "FIRST_BLOCKER=$blocker" >> "$GITHUB_ENV"

      - name: Upload Day-3 readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-restore-day3-edge-evidence-${{ github.run_id }}
          path: INDEPENDENT_DEPLOYMENT/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish safe Day-3 pointer
        if: always()
        run: |
          set -euo pipefail
          mkdir -p INDEPENDENT_DEPLOYMENT/evidence
          cat > INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_EDGE_RUN.md <<EOF
          # Independent Deployment Day-3 Edge Readiness Last Run

          run_id: ${GITHUB_RUN_ID}
          trigger_commit: ${GITHUB_SHA}
          job_status: ${{ job.status }}
          request_validation: ${REQUEST_VALIDATION:-NOT_REACHED}
          secret_bindings: ${SECRET_BINDINGS:-NOT_REACHED}
          target_binding_prepared: ${TARGET_BINDING_PREPARED:-NOT_REACHED}
          action_execution: ${ACTION_EXECUTION:-NOT_REACHED}
          readiness_disposition: ${READINESS_DISPOSITION:-NOT_REACHED}
          first_blocker: ${FIRST_BLOCKER:-NOT_REACHED}
          public_activation: NOT_PERFORMED
          recorded_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          No secret values are written to this pointer.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_EDGE_RUN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(experiment): record Day-3 edge readiness evidence'
          git push origin HEAD:refs/heads/experiment/independent-restore-deploy
