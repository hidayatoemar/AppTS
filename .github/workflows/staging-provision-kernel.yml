name: staging-provision-kernel

on:
  push:
    branches: [mcr/staging-integration-prep]
    paths:
      - '.github/workflows/staging-provision-kernel.yml'
      - 'infra/staging/provision-kernel.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    if: github.repository == 'hidayatoemar/AppTS' && github.ref == 'refs/heads/mcr/staging-integration-prep'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      VERIFIED_SHA: 01097454cc73b9917b284c876af4c603856ebe6e
    steps:
      - name: Checkout staging integration controls
        uses: actions/checkout@v4

      - name: Checkout exact verified kernel baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SHA }}
          path: verified-main

      - name: Setup Node 22 for verification/build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-verify exact baseline and build artifact
        shell: bash
        run: |
          set -euo pipefail
          cd verified-main
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          npm install --no-save --ignore-scripts typescript@5.8.3
          npm test
          printf '%s\n' "$VERIFIED_SHA" > DEPLOYED_COMMIT
          tar -czf "$RUNNER_TEMP/appts-kernel-$VERIFIED_SHA.tar.gz" \
            DEPLOYED_COMMIT package.json README.md dist
          sha256sum "$RUNNER_TEMP/appts-kernel-$VERIFIED_SHA.tar.gz" \
            | tee "$RUNNER_TEMP/appts-kernel-$VERIFIED_SHA.sha256"

      - name: Prepare pinned SSH identity
        shell: bash
        env:
          APPTS_STAGING_SSH_PRIVATE_KEY: ${{ secrets.APPTS_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${APPTS_STAGING_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$APPTS_STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/appts_staging"
          chmod 600 "$HOME/.ssh/appts_staging"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          103.127.99.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILpRJVkwh143CmmrMkQvgfNyRIbV964SsAYLZ3BlaGdh
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify pinned host fingerprint
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILpRJVkwh143CmmrMkQvgfNyRIbV964SsAYLZ3BlaGdh' > /tmp/appts-hostkey.pub
          actual="$(ssh-keygen -lf /tmp/appts-hostkey.pub -E sha256 | awk '{print $2}')"
          expected='SHA256:M0o8nYzf97+hK627/zeemfmiXF02eBjg7Ej5DUYITmw'
          test "$actual" = "$expected"

      - name: Transfer verified artifact and provision staging
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$HOME/.ssh/appts_staging"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=12
          )
          artifact="$RUNNER_TEMP/appts-kernel-$VERIFIED_SHA.tar.gz"
          artifact_sha="$(sha256sum "$artifact" | awk '{print $1}')"
          scp "${SSH_OPTS[@]}" infra/staging/provision-kernel.sh \
            "$artifact" \
            appts-mcr@103.127.99.11:/tmp/
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 \
            "bash /tmp/provision-kernel.sh '$VERIFIED_SHA' '/tmp/appts-kernel-$VERIFIED_SHA.tar.gz' '$artifact_sha'"
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 \
            "rm -f '/tmp/provision-kernel.sh' '/tmp/appts-kernel-$VERIFIED_SHA.tar.gz'"

      - name: Post-provision bounded verification
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$HOME/.ssh/appts_staging"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=12
          )
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 "
            set -euo pipefail
            test \"\$(cat /opt/appts-restore-service/current/DEPLOYED_COMMIT)\" = '$VERIFIED_SHA'
            test \"\$(node -p 'process.versions.node.split(\".\")[0]')\" = '22'
            test ! -e /opt/appts-restore-service/current/node_modules
            unexpected=\$(ss -lntH | awk '{print \$4}' | grep -Ev '(^|:)22$' || true)
            test -z \"\$unexpected\"
            echo staging_kernel_verification=PASS
          "
