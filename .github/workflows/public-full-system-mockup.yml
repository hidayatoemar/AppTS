name: public-full-system-mockup

on:
  push:
    branches:
      - rebaseline/full-system-mockup
    paths:
      - 'mockup/**'
      - '.github/workflows/public-full-system-mockup.yml'

permissions:
  contents: read

jobs:
  deploy-mockup:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Package static mockup and tunnel binary
        shell: bash
        run: |
          set -euo pipefail
          test -f mockup/index.html
          test -f mockup/server.mjs
          tar -czf "$RUNNER_TEMP/appts-full-mockup.tar.gz" -C mockup .
          curl -fsSL --retry 3             https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64             -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"

      - name: Prepare pinned SSH identity
        shell: bash
        env:
          APPTS_STAGING_SSH_PRIVATE_KEY: ${{ secrets.APPTS_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${APPTS_STAGING_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$APPTS_STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/appts_staging"
          chmod 600 "$HOME/.ssh/appts_staging"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          103.127.99.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILpRJVkwh143CmmrMkQvgfNyRIbV964SsAYLZ3BlaGdh
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy synthetic mockup and browser tunnel
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$HOME/.ssh/appts_staging"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=12
          )

          scp "${SSH_OPTS[@]}"             "$RUNNER_TEMP/appts-full-mockup.tar.gz"             "$RUNNER_TEMP/cloudflared"             appts-mcr@103.127.99.11:/tmp/

          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 'bash -s' <<'REMOTE'
          set -euo pipefail

          sudo install -d -m 0755 /opt/appts-full-mockup
          sudo rm -rf /opt/appts-full-mockup/current.new
          sudo install -d -m 0755 /opt/appts-full-mockup/current.new
          sudo tar -xzf /tmp/appts-full-mockup.tar.gz -C /opt/appts-full-mockup/current.new

          if [ -d /opt/appts-full-mockup/current ]; then
            sudo rm -rf /opt/appts-full-mockup/previous
            sudo mv /opt/appts-full-mockup/current /opt/appts-full-mockup/previous
          fi
          sudo mv /opt/appts-full-mockup/current.new /opt/appts-full-mockup/current
          sudo chmod -R a+rX /opt/appts-full-mockup/current

          cat >/tmp/appts-full-mockup.service <<'UNIT'
          [Unit]
          Description=AppTS Full-System Synthetic Mockup
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/appts-full-mockup/current
          Environment=PORT=80
          ExecStart=/usr/bin/node /opt/appts-full-mockup/current/server.mjs
          Restart=on-failure
          RestartSec=2
          NoNewPrivileges=true
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          AmbientCapabilities=CAP_NET_BIND_SERVICE

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo install -m 0644 /tmp/appts-full-mockup.service /etc/systemd/system/appts-full-mockup.service
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

          cat >/tmp/appts-full-mockup-tunnel.service <<'UNIT'
          [Unit]
          Description=AppTS Full-System Mockup Browser Tunnel
          After=network-online.target appts-full-mockup.service
          Wants=network-online.target
          Requires=appts-full-mockup.service

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:80
          Restart=always
          RestartSec=5
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo install -m 0644 /tmp/appts-full-mockup-tunnel.service /etc/systemd/system/appts-full-mockup-tunnel.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now appts-full-mockup.service
          sudo systemctl restart appts-full-mockup.service

          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1/ | grep -F 'APPTS FULL-SYSTEM MOCKUP' >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1/ | grep -F 'APPTS FULL-SYSTEM MOCKUP' >/dev/null

          if ! sudo systemctl is-active --quiet appts-full-mockup-tunnel.service; then
            sudo systemctl enable --now appts-full-mockup-tunnel.service
          fi

          url=""
          for n in $(seq 1 30); do
            url="$(sudo journalctl -u appts-full-mockup-tunnel.service --no-pager -n 120               | grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1 || true)"
            if [ -n "$url" ]; then break; fi
            sleep 2
          done
          test -n "$url"
          printf '%s\n' "$url" | sudo tee /opt/appts-full-mockup/PUBLIC_URL >/dev/null
          echo "PUBLIC_MOCKUP_URL=$url"

          rm -f /tmp/appts-full-mockup.tar.gz /tmp/cloudflared /tmp/appts-full-mockup.service /tmp/appts-full-mockup-tunnel.service
          REMOTE

          url="$(ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 'cat /opt/appts-full-mockup/PUBLIC_URL')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_MOCKUP_URL=$url"

      - name: Verify browser reachability
        shell: bash
        env:
          PUBLIC_MOCKUP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_MOCKUP_URL"
          for n in $(seq 1 20); do
            if curl -fsS --max-time 10 "$PUBLIC_MOCKUP_URL/" | grep -F 'APPTS FULL-SYSTEM MOCKUP' >/dev/null; then
              echo "browser_mockup_reachable=PASS"
              echo "PUBLIC_MOCKUP_URL=$PUBLIC_MOCKUP_URL"
              exit 0
            fi
            sleep 3
          done
          echo "browser_mockup_reachable=FAIL" >&2
          exit 1
