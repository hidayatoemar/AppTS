name: staging-local-runtime-readonly-diagnostic-pr24

on:
  push:
    branches: [mcr/staging-exec-diagnostic-pr24]
    paths:
      - '.github/workflows/staging-local-runtime-readonly-diagnostic-pr24.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.repository == 'hidayatoemar/AppTS' && github.ref == 'refs/heads/mcr/staging-exec-diagnostic-pr24'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH identity
        shell: bash
        env:
          APPTS_STAGING_SSH_PRIVATE_KEY: ${{ secrets.APPTS_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${APPTS_STAGING_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$APPTS_STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/appts_staging"
          chmod 600 "$HOME/.ssh/appts_staging"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          103.127.99.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILpRJVkwh143CmmrMkQvgfNyRIbV964SsAYLZ3BlaGdh
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only local-runtime diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh             -i "$HOME/.ssh/appts_staging"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -o ConnectTimeout=12             appts-mcr@103.127.99.11 'bash -s' <<'REMOTE'
          set -u
          echo "=== identity ==="
          printf 'deployed_commit='
          cat /opt/appts-restore-service/current/DEPLOYED_COMMIT 2>/dev/null || true
          printf 'current_target='
          readlink -f /opt/appts-restore-service/current 2>/dev/null || true
          echo "=== service ==="
          sudo systemctl is-enabled appts-restore-service-local.service 2>&1 || true
          sudo systemctl is-active appts-restore-service-local.service 2>&1 || true
          sudo systemctl status appts-restore-service-local.service --no-pager -l 2>&1 || true
          echo "=== journal ==="
          sudo journalctl -u appts-restore-service-local.service -n 80 --no-pager 2>&1 || true
          echo "=== listeners ==="
          ss -lntH 2>&1 || true
          echo "=== filesystem ==="
          stat -c '%U:%G %a %F %n'             /opt/appts-restore-service             /opt/appts-restore-service/current             /etc/appts-restore-service             /etc/appts-restore-service/runtime.json             /etc/appts-restore-service/synthetic-trial-fixture.json             /var/lib/appts-restore-service/runtime 2>&1 || true
          echo "=== runtime-user-access ==="
          sudo -u appts-runtime test -r /etc/appts-restore-service/runtime.json && echo config_read=PASS || echo config_read=FAIL
          sudo -u appts-runtime test -r /etc/appts-restore-service/synthetic-trial-fixture.json && echo fixture_read=PASS || echo fixture_read=FAIL
          sudo -u appts-runtime test -w /var/lib/appts-restore-service/runtime && echo data_write=PASS || echo data_write=FAIL
          echo "=== config-parse-readonly ==="
          sudo -u appts-runtime env APPTS_RUNTIME_CONFIG=/etc/appts-restore-service/runtime.json             /usr/bin/node --input-type=module -e "
              const m = await import('file:///opt/appts-restore-service/current/dist/src/staging/runtime-config.js');
              const x = await m.loadLocalRuntimeConfig('/etc/appts-restore-service/runtime.json');
              console.log('config_fixture_load=PASS profile=' + x.config.profile + ' baselines=' + x.fixture.scopeBaselines.length);
            " 2>&1 || true
          echo "=== local-health ==="
          /usr/bin/node --input-type=module -e "
            for (const p of ['/healthz','/readyz']) {
              try {
                const r=await fetch('http://127.0.0.1:8080'+p);
                console.log(p+'='+r.status);
              } catch(e) {
                console.log(p+'=UNREACHABLE:'+String(e.cause?.code||e.name));
              }
            }
          " 2>&1 || true
          echo "diagnostic_mutation=NO"
          REMOTE
