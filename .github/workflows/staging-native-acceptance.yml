name: staging-native-acceptance

on:
  push:
    branches: [mcr/staging-integration-prep]
    paths:
      - '.github/workflows/staging-native-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      VERIFIED_SHA: 01097454cc73b9917b284c876af4c603856ebe6e
    steps:
      - name: Checkout exact verified baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SHA }}

      - name: Setup Node 22 for deterministic build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact verified baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          npm install --no-save --ignore-scripts typescript@5.8.3
          npm test
          tar -czf "$RUNNER_TEMP/native-acceptance-$VERIFIED_SHA.tar.gz" dist tests

      - name: Prepare pinned SSH identity
        shell: bash
        env:
          APPTS_STAGING_SSH_PRIVATE_KEY: ${{ secrets.APPTS_STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${APPTS_STAGING_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$APPTS_STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/appts_staging"
          chmod 600 "$HOME/.ssh/appts_staging"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          103.127.99.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILpRJVkwh143CmmrMkQvgfNyRIbV964SsAYLZ3BlaGdh
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run native acceptance on staging host
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$HOME/.ssh/appts_staging"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=12
          )
          scp "${SSH_OPTS[@]}" "$RUNNER_TEMP/native-acceptance-$VERIFIED_SHA.tar.gz" \
            appts-mcr@103.127.99.11:/tmp/
          ssh "${SSH_OPTS[@]}" appts-mcr@103.127.99.11 "
            set -euo pipefail
            test \"\$(cat /opt/appts-restore-service/current/DEPLOYED_COMMIT)\" = '$VERIFIED_SHA'
            test \"\$(node -p 'process.versions.node.split(\".\")[0]')\" = '22'
            workdir=\$(mktemp -d)
            trap 'rm -rf \"\$workdir\" /tmp/native-acceptance-$VERIFIED_SHA.tar.gz' EXIT
            tar -xzf /tmp/native-acceptance-$VERIFIED_SHA.tar.gz -C \"\$workdir\"
            cd \"\$workdir\"
            node --test tests/*.test.mjs tests/vectors/*.test.mjs
            test \"\$(ss -lntH | awk '{print \$4}' | grep -Ev '(^|:)22$' | wc -l)\" -eq 0
            echo staging_native_acceptance=PASS
          "
