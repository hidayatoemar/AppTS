name: CODEX051 Day1 trace diagnostic
on:
  pull_request:
    branches: [experiment/independent-restore-deploy]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: codex051-superuser-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify accepted execution baseline and build
        shell: bash
        run: |
          set -euo pipefail
          root=DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          cd "$root"
          test "$(sha256sum apps/api/src/trial/pre-ticket-trial-owner-flow.ts | awk '{print $1}')" = fa6a57a4bb50fdd63884d86ce43fe2b18137c3c0b0554b2b990d57d2771c6106
          test "$(sha256sum deploy/db/grant-runtime.sh | awk '{print $1}')" = 41b48d45bb88c7e510a88235840b8601658d08e5347e9f7660419f7efc321f0f
          test "$(sha256sum tests/dep001/idempotency-minimum-runtime-writer.test.mjs | awk '{print $1}')" = cba0366d557510b456e725198a38297dad30f5f1d2421e3f381ed032887ee32f
          npm install --global npm@11.17.0
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:boundaries
          npm run typecheck
          npm run build
      - name: Create disposable PostgreSQL 17 runtime split
        shell: bash
        run: |
          set -euo pipefail
          root=DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          db=appts_dep001_codex051
          pgcid="$(docker ps --filter ancestor=postgres:17.11-bookworm -q | head -n1)"; test -n "$pgcid"
          export PGPASSWORD=codex051-superuser-local-only
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<SQL
          CREATE ROLE appts_migration LOGIN PASSWORD 'codex051-migration-local-only' NOSUPERUSER INHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE appts_runtime LOGIN PASSWORD 'codex051-runtime-local-only' NOSUPERUSER NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE ${db} OWNER appts_migration;
          SQL
          export PGPASSWORD=codex051-migration-local-only
          for f in "$root"/db/migrations/V001__cf01_core_schema.sql "$root"/db/migrations/V002__cf01_runtime_and_exchange_schema.sql "$root"/db/migrations/V003__dg04_diagnostic_persistence.sql "$root"/db/migrations/V004__d05_pending_capture_v2.sql; do
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$f"
          done
          docker cp "$root/deploy/db" "$pgcid:/tmp/codex051-db"
          docker exec "$pgcid" chmod +x /tmp/codex051-db/grant-runtime.sh
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE="$db" -e PGUSER=appts_migration -e PGPASSWORD=codex051-migration-local-only -e APPTS_DB_NAME="$db" -e APPTS_MIGRATION_ROLE=appts_migration -e APPTS_RUNTIME_ROLE=appts_runtime -e 'APPTS_STAGING_LABEL=STAGING SIMULATION / NON-PRODUCTION' -e APPTS_DISPOSABLE_DATABASE=true -e APPTS_DB_NETWORK_MODE=LOOPBACK "$pgcid" /tmp/codex051-db/grant-runtime.sh
      - name: Schema dependency trace
        shell: bash
        run: |
          set -euo pipefail
          db=appts_dep001_codex051
          export PGPASSWORD=codex051-migration-local-only
          psql -X -P pager=off -h 127.0.0.1 -U appts_migration -d "$db" <<'SQL'
          \echo '=== FK dependencies of Day1 canonical tables ==='
          SELECT conrelid::regclass::text AS table_name, conname, pg_get_constraintdef(oid) AS definition
            FROM pg_constraint
           WHERE contype='f'
             AND conrelid IN ('appts.ticket_identity'::regclass,'appts.ticket_formation_record'::regclass,'appts.runtime_ticket'::regclass,'appts.runtime_context'::regclass,'appts.runtime_state_transition'::regclass,'appts.lifecycle_effect_request'::regclass,'appts.lifecycle_effect_result'::regclass,'appts.action_intent'::regclass)
           ORDER BY table_name, conname;
          \echo '=== Runtime effective privileges ==='
          SELECT table_name,string_agg(privilege_type,',' ORDER BY privilege_type) AS privileges
            FROM information_schema.role_table_grants
           WHERE grantee='appts_runtime' AND table_schema='appts'
             AND table_name IN ('ticket_identity','ticket_formation_record','runtime_ticket','runtime_context','runtime_state_transition','lifecycle_effect_request','lifecycle_effect_result','action_intent','purpose_extension_binding','assignment_snapshot','responsible_assignment','authority_envelope','authority_action','progression_envelope','gate_evaluation')
           GROUP BY table_name ORDER BY table_name;
          SQL
      - name: Prove current first break at positive formation boundary
        shell: bash
        env:
          DATABASE_URL: postgresql://appts_runtime:codex051-runtime-local-only@127.0.0.1:5432/appts_dep001_codex051
          API_LISTEN_PORT: 8080
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
        run: |
          set -euo pipefail
          cd DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          node apps/api/dist/dep-bootstrap.js >/tmp/codex051-baseline-api.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/v1/ui/work-queue
          body='{"intent_contract_ref":"APPTS.CORE.D01.PRETICKET_ADMISSION.SUBMISSION / 1.0.0","payload":{"messageId":"51000000-0000-4000-8000-000000000001","idempotencyKey":"51000000-0000-4000-8000-000000000002","correlationId":"51000000-0000-4000-8000-000000000003","trialContext":"TD-PRE-001"}}'
          curl -fsS -H 'content-type: application/json' -d "$body" http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/current-owner-flow.json
          export PGPASSWORD=codex051-migration-local-only
          counts=$(psql -X -At -F '|' -h 127.0.0.1 -U appts_migration -d appts_dep001_codex051 -c "SELECT (SELECT count(*) FROM appts.pre_ticket_case),(SELECT count(*) FROM appts.intake_decision WHERE decision_code='ACCEPTED_FOR_FORMATION'),(SELECT count(*) FROM appts.ticket_formation_record),(SELECT count(*) FROM appts.ticket_identity),(SELECT count(*) FROM appts.runtime_ticket);")
          echo "baseline_counts=$counts"
          test "$counts" = '1|0|0|0|0'
          grep -q 'HOLD_AS_PRE_TICKET' /tmp/current-owner-flow.json
          echo 'FIRST_BREAK_PROOF=current HTTP Trial owner-flow has no positive ACCEPTED_FOR_FORMATION -> Ticket formation/runtime composition path'
      - name: Materialize transient bounded candidate and compile
        shell: bash
        run: |
          set -euo pipefail
          accepted=e09dc82af348ed61ebeb802a346780173b42b973
          candidate=bcf46ae50768343044112df6105d9ca67c7b3365
          git fetch --no-tags origin mcr/codex051-day1-golden-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$candidate"
          mapfile -t changed < <(git diff --name-only "$accepted" "$candidate")
          printf 'candidate_delta=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 8
          for path in "${changed[@]}"; do
            case "$path" in
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/dep-bootstrap.ts|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/projections/trial-projection-port.ts|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/tls-day1-golden-flow.ts|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/tsconfig.json|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/web/src/views/TicketConsoleView.tsx|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/web/src/views/WorkQueueView.tsx|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/deploy/db/seed-tls-day1-golden.sql|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/packages/runtime-d04/package.json) ;;
              *) echo "STOP unexpected candidate path: $path"; exit 1 ;;
            esac
          done
          git checkout "$candidate" -- "${changed[@]}"
          root=DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          cd "$root"
          test "$(sha256sum package-lock.json | awk '{print $1}')" = 60f1e9e7e0ba9993c9340af9344790440298f9e2fe861ed50f50c14f2cc7170c
          test "$(sha256sum apps/api/src/trial/pre-ticket-trial-owner-flow.ts | awk '{print $1}')" = fa6a57a4bb50fdd63884d86ce43fe2b18137c3c0b0554b2b990d57d2771c6106
          test "$(sha256sum deploy/db/grant-runtime.sh | awk '{print $1}')" = 41b48d45bb88c7e510a88235840b8601658d08e5347e9f7660419f7efc321f0f
          npm run verify:boundaries
          npm run typecheck
          npm run build
          echo "CANDIDATE_COMPILE=PASS"
      - name: Execute positive Golden Path with actual appts_runtime
        shell: bash
        env:
          DATABASE_URL: postgresql://appts_runtime:codex051-runtime-local-only@127.0.0.1:5432/appts_dep001_codex051
          API_LISTEN_PORT: 8080
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
        run: |
          set -euo pipefail
          root=DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          cd "$root"

          # Static Trial configuration belongs to migration/deployment identity.
          set +e
          PGPASSWORD=codex051-runtime-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_runtime -d appts_dep001_codex051 < deploy/db/seed-tls-day1-golden.sql >/tmp/runtime-seed.out 2>/tmp/runtime-seed.err
          runtime_seed_rc=$?
          set -e
          test "$runtime_seed_rc" -ne 0
          grep -q 'static Trial binding seed must not run as appts_runtime' /tmp/runtime-seed.err
          PGPASSWORD=codex051-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d appts_dep001_codex051 < deploy/db/seed-tls-day1-golden.sql

          node apps/api/dist/dep-bootstrap.js >/tmp/codex051-candidate-api.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/codex051-candidate-api.log || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/health.json
          curl -fsS http://127.0.0.1:8080/readyz | tee /tmp/ready.json

          positive='{"intent_contract_ref":"APPTS.CORE.D01.PRETICKET_ADMISSION.SUBMISSION / 1.0.0","payload":{"messageId":"51030000-0000-4000-8000-000000000001","idempotencyKey":"51030000-0000-4000-8000-000000000002","correlationId":"51030000-0000-4000-8000-000000000003","trialContext":"TLS-DAY1-GOLDEN"}}'
          curl -fsS -H 'content-type: application/json' -d "$positive" http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/positive.json
          ticket=$(node -e "const x=require('/tmp/positive.json');if(x.disposition!=='CREATED'||x.assessmentResult!=='ACCEPTABLE'||x.decision!=='ACCEPTED_FOR_FORMATION'||x.state!=='ACCEPTED'||x.aggregateVersion!==0)process.exit(2);process.stdout.write(x.ticketId)")
          test -n "$ticket"
          echo "positive_ticket=$ticket"

          # Same-key replay must remain the same durable Ticket.
          curl -fsS -H 'content-type: application/json' -d "$positive" http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/replay.json
          TICKET="$ticket" node -e "const x=require('/tmp/replay.json');if(x.disposition!=='IDEMPOTENT_REPLAY'||x.ticketId!==process.env.TICKET)process.exit(2)"
          changed='{"intent_contract_ref":"APPTS.CORE.D01.PRETICKET_ADMISSION.SUBMISSION / 1.0.0","payload":{"messageId":"51030000-0000-4000-8000-000000000009","idempotencyKey":"51030000-0000-4000-8000-000000000002","correlationId":"51030000-0000-4000-8000-000000000003","trialContext":"TLS-DAY1-GOLDEN"}}'
          curl -fsS -H 'content-type: application/json' -d "$changed" http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/conflict.json
          TICKET="$ticket" node -e "const x=require('/tmp/conflict.json');if(x.disposition!=='CONFLICT_HOLD'||x.ticketId!==process.env.TICKET)process.exit(2)"

          curl -fsS http://127.0.0.1:8080/api/v1/ui/work-queue | tee /tmp/work.json
          TICKET="$ticket" node -e "const x=require('/tmp/work.json');if(x.view_id!=='UX-RS-01'||!Array.isArray(x.data?.tickets)||!x.data.tickets.some(t=>t.ticket_id===process.env.TICKET&&t.current_state_code==='ACCEPTED'))process.exit(2)"
          curl -fsS "http://127.0.0.1:8080/api/v1/ui/tickets/$ticket" | tee /tmp/ticket-before.json
          TICKET="$ticket" node -e "const x=require('/tmp/ticket-before.json');const d=x.data;if(x.view_id!=='UX-RS-03'||x.subject_ref!==process.env.TICKET||d.current_state_code!=='ACCEPTED'||d.aggregate_version!==0||d.holder_ref!=='51010000-0000-4000-8000-00000000000a'||d.role_assignment_ref!=='51010000-0000-4000-8000-00000000000b'||d.authority_currentness_ref!=='CURRENT'||d.gate_currentness_ref!=='CURRENT'||JSON.stringify(d.available_actions)!=='[\"ACTIVATE\"]')process.exit(2)"
          source_version=$(node -e "const x=require('/tmp/ticket-before.json');process.stdout.write(x.source_version_set_ref)")
          intent_time=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          action_id=51040000-0000-4000-8000-000000000001
          node - "$ticket" "$source_version" "$intent_time" "$action_id" > /tmp/action.json <<'NODE'
          const [ticket, sourceVersion, intentTime, actionId] = process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            intent_contract_ref: "INT-RUN-TD-05",
            payload: {
              action_intent_id: actionId,
              ticket_id: ticket,
              actor_ref: "51010000-0000-4000-8000-00000000000a",
              role_assignment_ref: "51010000-0000-4000-8000-00000000000b",
              requested_action_class: "ACTIVATE",
              presented_source_version_ref: sourceVersion,
              expected_aggregate_version: 0,
              intent_time: intentTime
            }
          }));
          NODE
          curl -fsS -H 'content-type: application/json' --data-binary @/tmp/action.json http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/action-result.json
          node -e "const x=require('/tmp/action-result.json');if(x.result!=='EFFECT_APPLIED'||x.durable!==true||x.state!=='ACTIVE'||x.aggregateVersion!==1)process.exit(2)"

          curl -fsS "http://127.0.0.1:8080/api/v1/ui/tickets/$ticket" | tee /tmp/ticket-after.json
          node -e "const x=require('/tmp/ticket-after.json');const d=x.data;if(d.current_state_code!=='ACTIVE'||d.aggregate_version!==1||!Array.isArray(d.available_actions)||d.available_actions.length!==0||d.restriction_profile_ref!=='POST_ACTIVATION_REFRESH_REQUIRED')process.exit(2)"

          # Replaying the exact action command returns the durable effect; no second transition.
          curl -fsS -H 'content-type: application/json' --data-binary @/tmp/action.json http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/action-replay.json
          node -e "const x=require('/tmp/action-replay.json');if(x.result!=='EFFECT_APPLIED'||x.state!=='ACTIVE'||x.aggregateVersion!==1)process.exit(2)"

          export PGPASSWORD=codex051-migration-local-only
          counts=$(psql -X -At -F '|' -h 127.0.0.1 -U appts_migration -d appts_dep001_codex051 -c "SELECT (SELECT count(*) FROM appts.ticket_identity),(SELECT count(*) FROM appts.ticket_formation_record),(SELECT count(*) FROM appts.runtime_ticket WHERE current_state_code='ACTIVE' AND aggregate_version=1),(SELECT count(*) FROM appts.action_intent),(SELECT count(*) FROM appts.lifecycle_effect_request),(SELECT count(*) FROM appts.lifecycle_effect_result),(SELECT count(*) FROM appts.runtime_state_transition),(SELECT count(*) FROM appts.intake_decision WHERE decision_code='ACCEPTED_FOR_FORMATION');")
          echo "day1_counts=$counts"
          test "$counts" = '1|1|1|1|1|1|1|1'
          current_user=$(PGPASSWORD=codex051-runtime-local-only psql -X -At -h 127.0.0.1 -U appts_runtime -d appts_dep001_codex051 -c 'select current_user')
          test "$current_user" = appts_runtime
          echo 'TLS_DAY1_RUNTIME_GATE=PASS'
