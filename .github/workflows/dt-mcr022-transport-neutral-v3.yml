name: DT MCR022 transport-neutral independent verification v3
on:
  push:
    branches:
      - experiment/dt-mcr022-transport-neutral-v3
    paths:
      - '.github/workflows/dt-mcr022-transport-neutral-v3.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: dt022v3-superuser-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/package-lock.json

      - name: Exact baseline and static executable gate
        run: |
          set -euo pipefail
          BASE=685e900545c686f1c2e802ff1e712394d1d324f6
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | sort)
          printf '%s\n' "${changed[@]}" > /tmp/dt022-v3-changed.txt
          test "${#changed[@]}" = 3
          printf '%s\n' \
            '.github/workflows/dt-mcr022-transport-neutral-v3.yml' \
            'INDEPENDENT_DEPLOYMENT/dt022/dt022-browser.py' \
            'INDEPENDENT_DEPLOYMENT/dt022/dt022-ingress.mjs' | sort > /tmp/dt022-v3-allowed.txt
          diff -u /tmp/dt022-v3-allowed.txt /tmp/dt022-v3-changed.txt
          git diff --exit-code "$BASE" HEAD -- DEPLOYMENT_WORKSPACE
          npm install --global npm@11.17.0
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 11.17.0
          cd DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          npm ci
          npm run verify:boundaries
          npm run typecheck
          npm run build
          npm run test:contracts
          mkdir -p /tmp/dt022-evidence
          printf '%s\n' \
            authority=MCR-to-DT-022 \
            admitted_commit=685e900545c686f1c2e802ff1e712394d1d324f6 \
            product_source_changed=NO \
            test_source_changed=NO \
            run1=32966220987 \
            run1_classification=DT_HARNESS_IMPORT_PATH_ERROR_BEFORE_PRODUCT_INVOCATION \
            run2=32966698688 \
            run2_classification=DT_NEGATIVE_ORACLE_MISMATCH_PRODUCT_CORRECTLY_RETURNED_INT_RUN_TD_01_NOT_CURRENT \
            route_harness_drift=STRUCTURAL_STALE_LEGACY_HARNESS_DRIFT \
            > /tmp/dt022-evidence/baseline.txt

      - name: Disposable PostgreSQL least-privilege setup
        run: |
          set -euo pipefail
          W=DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          db=appts_dep001_dt022v3
          pgcid="$(docker ps --filter ancestor=postgres:17.11-bookworm -q | head -n1)"; test -n "$pgcid"
          PGPASSWORD=dt022v3-superuser-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<SQL
          CREATE ROLE appts_migration LOGIN PASSWORD 'dt022v3-migration-local-only' NOSUPERUSER INHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE appts_runtime LOGIN PASSWORD 'dt022v3-runtime-local-only' NOSUPERUSER NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE ${db} OWNER appts_migration;
          SQL
          for f in "$W"/db/migrations/V001__cf01_core_schema.sql "$W"/db/migrations/V002__cf01_runtime_and_exchange_schema.sql "$W"/db/migrations/V003__dg04_diagnostic_persistence.sql "$W"/db/migrations/V004__d05_pending_capture_v2.sql; do
            PGPASSWORD=dt022v3-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$f"
          done
          docker cp "$W/deploy/db" "$pgcid:/tmp/dt022v3-db"
          docker exec "$pgcid" chmod +x /tmp/dt022v3-db/grant-runtime.sh
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE="$db" -e PGUSER=appts_migration -e PGPASSWORD=dt022v3-migration-local-only -e APPTS_DB_NAME="$db" -e APPTS_MIGRATION_ROLE=appts_migration -e APPTS_RUNTIME_ROLE=appts_runtime -e 'APPTS_STAGING_LABEL=STAGING SIMULATION / NON-PRODUCTION' -e APPTS_DISPOSABLE_DATABASE=true -e APPTS_DB_NETWORK_MODE=LOOPBACK "$pgcid" /tmp/dt022v3-db/grant-runtime.sh
          set +e
          PGPASSWORD=dt022v3-runtime-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_runtime -d "$db" < "$W/deploy/db/seed-tls-day1-golden.sql" >/tmp/runtime-seed.out 2>/tmp/runtime-seed.err
          rc=$?
          set -e
          test "$rc" -ne 0; grep -qi 'must not run as appts_runtime' /tmp/runtime-seed.err
          PGPASSWORD=dt022v3-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$W/deploy/db/seed-tls-day1-golden.sql"
          test "$(PGPASSWORD=dt022v3-runtime-local-only psql -X -At -h 127.0.0.1 -U appts_runtime -d "$db" -c 'select current_user')" = appts_runtime
          printf '%s\n' database=appts_dep001_dt022v3 runtime_identity=appts_runtime network=loopback classification=STAGING_SIMULATION_NON_PRODUCTION > /tmp/dt022-evidence/runtime-context.txt

      - name: Independent transport-neutral D05 to D04 Product proof
        env:
          DATABASE_URL: postgresql://appts_runtime:dt022v3-runtime-local-only@127.0.0.1:5432/appts_dep001_dt022v3
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
          DT022_EVIDENCE_DIR: /tmp/dt022-evidence
        run: |
          set -euo pipefail
          node INDEPENDENT_DEPLOYMENT/dt022/dt022-ingress.mjs | tee /tmp/dt022-evidence/ingress-proof.json
          test -s /tmp/dt022-evidence/ticket-id.txt; test -s /tmp/dt022-evidence/qer-id.txt
          if grep -Eq 'INSERT[[:space:]]+INTO[[:space:]]+appts\.(dependency_context|runtime_blocker|waiting_interval|operational_obligation|next_control|runtime_ticket)' INDEPENDENT_DEPLOYMENT/dt022/dt022-ingress.mjs; then exit 1; fi
          grep -Fq '"d05": "QUALIFIED_PERSISTED"' /tmp/dt022-evidence/ingress-proof.json
          grep -Fq '"d04": "APPLIED"' /tmp/dt022-evidence/ingress-proof.json
          grep -Fq '"replay": "IDEMPOTENT_REPLAY"' /tmp/dt022-evidence/ingress-proof.json
          grep -Fq '"stale_apply": "FAIL_CLOSED_INT_RUN_TD_01_NOT_CURRENT"' /tmp/dt022-evidence/ingress-proof.json

      - name: Independent durable readback
        run: |
          set -euo pipefail
          ticket_id="$(cat /tmp/dt022-evidence/ticket-id.txt)"; qer_id="$(cat /tmp/dt022-evidence/qer-id.txt)"
          PGPASSWORD=dt022v3-migration-local-only psql -X -At -h 127.0.0.1 -U appts_migration -d appts_dep001_dt022v3 <<SQL | tee /tmp/dt022-evidence/durable-readback.txt
          SELECT 'runtime_ticket='||count(*) FROM appts.runtime_ticket WHERE ticket_id='${ticket_id}'::uuid AND current_state_code='ACCEPTED' AND aggregate_version=0;
          SELECT 'qer_current='||count(*) FROM appts.qualified_external_record WHERE qualified_external_record_id='${qer_id}'::uuid AND currentness_ref='CURRENT';
          SELECT 'dependency='||count(*) FROM appts.dependency_context WHERE ticket_id='${ticket_id}'::uuid AND evidence_ref='${qer_id}'::uuid AND dependency_status_ref='EXTERNAL_WAITING';
          SELECT 'waiting='||count(*) FROM appts.waiting_interval WHERE ticket_id='${ticket_id}'::uuid AND ended_at IS NULL;
          SELECT 'blocker='||count(*) FROM appts.runtime_blocker WHERE ticket_id='${ticket_id}'::uuid AND evidence_ref='${qer_id}'::uuid AND cleared_at IS NULL;
          SELECT 'obligation='||count(*) FROM appts.operational_obligation WHERE ticket_id='${ticket_id}'::uuid AND source_ref='${qer_id}'::uuid AND status_ref='OPEN';
          SELECT 'next_control='||count(*) FROM appts.next_control WHERE ticket_id='${ticket_id}'::uuid;
          SELECT 'escalation='||count(*) FROM appts.runtime_escalation WHERE ticket_id='${ticket_id}'::uuid AND evidence_ref='${qer_id}'::uuid AND status_ref='OPEN';
          SELECT 'responsibility_change='||count(*) FROM appts.responsibility_change WHERE ticket_id='${ticket_id}'::uuid;
          SQL
          for x in runtime_ticket=1 qer_current=1 dependency=1 waiting=1 blocker=1 obligation=1 next_control=1 escalation=1 responsibility_change=0; do grep -Fxq "$x" /tmp/dt022-evidence/durable-readback.txt; done

      - name: Actual RESTORE_SERVICE runtime and browser surfaces
        env:
          DATABASE_URL: postgresql://appts_runtime:dt022v3-runtime-local-only@127.0.0.1:5432/appts_dep001_dt022v3
          API_LISTEN_PORT: 8080
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
          APPTS_TLS_SESSION_COOKIE_SECURE: 'false'
          DT022_EVIDENCE_DIR: /tmp/dt022-evidence
        run: |
          set -euo pipefail
          export DT022_OPS_SECRET="$(openssl rand -hex 24)"
          export APPTS_TLS_TRIAL_CREDENTIAL_HASHES_JSON="$(node --input-type=module <<'NODE'
          import { hashTlsDay3Credential } from './DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/dist/trial/tls-day3-auth.js';
          process.stdout.write(JSON.stringify({'trial.ops.a':hashTlsDay3Credential(process.env.DT022_OPS_SECRET)}));
          NODE
          )"
          node DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/dist/dep-bootstrap.js >/tmp/dt022-api.log 2>&1 &
          pid=$!; cleanup(){ kill "$pid" 2>/dev/null || true; }; trap cleanup EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null && break || sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = '{"status":"ok"}'
          curl -fsS http://127.0.0.1:8080/readyz | tee /tmp/dt022-evidence/readyz.json
          CHROME=''; for c in google-chrome google-chrome-stable chromium chromium-browser; do command -v "$c" >/dev/null 2>&1 && CHROME="$(command -v "$c")" && break; done; test -n "$CHROME"
          "$CHROME" --version | tee /tmp/dt022-evidence/browser-version.txt
          (chromedriver --version || true) | tee /tmp/dt022-evidence/chromedriver-version.txt
          python3 -m pip install --quiet selenium==4.29.0
          export DT022_BASE_URL=http://127.0.0.1:8080
          export DT022_TICKET_ID="$(cat /tmp/dt022-evidence/ticket-id.txt)"
          export DT022_QER_ID="$(cat /tmp/dt022-evidence/qer-id.txt)"
          python3 INDEPENDENT_DEPLOYMENT/dt022/dt022-browser.py
          cp /tmp/dt022-api.log /tmp/dt022-evidence/api.log

      - name: Final invariant gate
        run: |
          set -euo pipefail
          grep -Fq '"responsibility_transferred": false' /tmp/dt022-evidence/ingress-proof.json
          grep -Fq '"lifecycle_state": "ACCEPTED"' /tmp/dt022-evidence/ingress-proof.json
          grep -Fq '"aggregate_version": 0' /tmp/dt022-evidence/ingress-proof.json
          grep -Fq '"provenance_qer_visible": "PASS"' /tmp/dt022-evidence/browser-summary.json
          printf '%s\n' disposition=PASS authority=MCR-to-DT-022 exact_baseline=685e900545c686f1c2e802ff1e712394d1d324f6 transport_neutral_INT_RUN_TD_01=PASS product_d05_qualification_persistence=PASS product_d04_derivation_canonical_effects=PASS durable_qer_provenance_currentness=PASS dependency_waiting_blocker_obligation_next_control=PASS responsibility_non_transfer=PASS lifecycle_orthogonality=PASS replay_idempotency=PASS stale_currentness_fail_closed=PASS direct_canonical_harness_write=ABSENT actual_application_runtime=PASS actual_browser_product_surfaces=PASS role_holder_server_binding=PASS route_harness_drift=STRUCTURAL_STALE_LEGACY_HARNESS_DRIFT_NON_MATERIAL > /tmp/dt022-evidence/SUMMARY.txt
          cat /tmp/dt022-evidence/SUMMARY.txt

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dt-mcr022-transport-neutral-independent-evidence-v3
          path: /tmp/dt022-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Publish safe evidence pointer
        if: success()
        run: |
          set -euo pipefail
          cat > INDEPENDENT_DEPLOYMENT/evidence/LAST_MCR022_VERIFICATION.md <<EOF
          # DT MCR-022 Transport-Neutral Independent Verification
          run_id: ${GITHUB_RUN_ID}
          verification_branch: experiment/dt-mcr022-transport-neutral-v3
          admitted_baseline: 685e900545c686f1c2e802ff1e712394d1d324f6
          product_source_changed: NO
          test_source_changed: NO
          transport_neutral_D05_D04: PASS
          runtime_application: PASS
          browser_human_facing: PASS
          route_harness_drift: STRUCTURAL_STALE_LEGACY_HARNESS_DRIFT_NON_MATERIAL
          disposition: PASS
          recorded_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INDEPENDENT_DEPLOYMENT/evidence/LAST_MCR022_VERIFICATION.md
          git commit -m 'chore(dt): record MCR-022 verification evidence'
          git push origin HEAD:refs/heads/experiment/dt-mcr022-transport-neutral-v3
