name: CODEX055 one-off strict typing source fix

on:
  push:
    branches:
      - mcr/codex055-day2-arc001-candidate

permissions:
  contents: write

jobs:
  strict-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcr/codex055-day2-arc001-candidate
      - name: Apply exact mechanical strict-typing correction
        shell: python
        run: |
          from pathlib import Path
          flow = Path('DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/tls-day2-arc001-flow.ts')
          text = flow.read_text()
          old = 'readonly withholdingReason?: string; readonly gateResult: string; readonly gatePredicates?: readonly { readonly identity: string; readonly status: string; readonly inputRef?: string; readonly reason?: string }[];'
          new = 'readonly withholdingReason?: string | undefined; readonly gateResult: string; readonly gatePredicates?: readonly { readonly identity: string; readonly status: string; readonly inputRef?: string | undefined; readonly reason?: string | undefined }[];'
          if old not in text and new not in text:
              raise SystemExit('expected flow typing fragment not found')
          text = text.replace(old, new)
          flow.write_text(text)

          tsconfig = Path('DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/tsconfig.json')
          cfg = tsconfig.read_text()
          cfg = cfg.replace(',\n    "exactOptionalPropertyTypes": false', '')
          tsconfig.write_text(cfg)
      - name: Commit correction when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'NO_CHANGE_REQUIRED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/tls-day2-arc001-flow.ts DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/tsconfig.json
          git commit -m 'fix(codex055): preserve strict optional typing'
          git push origin HEAD:mcr/codex055-day2-arc001-candidate
