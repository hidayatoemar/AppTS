name: CODEX055 Day-2 ARC001 verification

on:
  pull_request:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - '.github/workflows/codex055-day2-verify.yml'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
    steps:
      - name: Checkout verification candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/package-lock.json

      - name: Pin npm 11.17.0
        run: npm install --global npm@11.17.0

      - name: Toolchain identity
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install exact workspace dependencies
        run: npm ci

      - name: Preserve accepted Day-1 source identities
        run: |
          set -euo pipefail
          git diff --exit-code b5551eddbbcd82675997c740b5471bb3cc74241b -- \
            apps/api/src/trial/pre-ticket-trial-owner-flow.ts \
            apps/api/src/trial/tls-day1-golden-flow.ts \
            deploy/db/seed-tls-day1-golden.sql \
            deploy/db/grant-runtime.sh \
            db/migrations/V001__cf01_core_schema.sql \
            db/migrations/V002__cf01_runtime_and_exchange_schema.sql \
            db/migrations/V003__dg04_diagnostic_schema.sql \
            db/migrations/V004__d05_pending_capture_support.sql \
            package-lock.json

      - name: ARC001 boundary assertions
        run: node --test tests/dep001/tls-day2-arc001-boundary.test.mjs

      - name: Architecture boundary
        run: npm run verify:boundaries

      - name: Full typecheck
        run: npm run typecheck

      - name: Full build
        run: npm run build

      - name: Existing contract and integration regression
        run: |
          set -euo pipefail
          npm run test:contracts
          npm run test:integration
          npm run test:adverse

      - name: Candidate delta report
        run: |
          set -euo pipefail
          echo '--- changed files from exact MCR055 base ---'
          git diff --name-status b5551eddbbcd82675997c740b5471bb3cc74241b...HEAD
          echo '--- forbidden semantic/security changes ---'
          test -z "$(git diff --name-only b5551eddbbcd82675997c740b5471bb3cc74241b...HEAD -- db/migrations deploy/db/grant-runtime.sh package-lock.json | grep -v '^deploy/db/seed-tls-day2-arc001.sql$' || true)"
