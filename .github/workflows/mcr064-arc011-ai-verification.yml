name: MCR064 ARC011 AI verification ingress proof
on:
  push:
    branches:
      - codex/mcr062-cf06-pretrial-successor
    paths:
      - '.github/workflows/mcr064-arc011-ai-verification.yml'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/runtime/**'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/arc011-ai-verification-context.ts'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/packages/runtime-d04/src/external-dependency.ts'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/packages/runtime-d04/src/index.ts'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/tsconfig.json'
      - 'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/tools/verify-mcr064-arc011.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: mcr064-superuser-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
    steps:
      - name: Checkout exact bounded successor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up exact Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/package-lock.json
      - name: Static bounded-construction gate
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          npm ci
          anchor=faf266c11226e24f2439834ccf6235ab578a4e66
          git diff --exit-code "$anchor" -- \
            db/migrations/V001__cf01_core_schema.sql \
            db/migrations/V002__cf01_runtime_and_exchange_schema.sql \
            db/migrations/V003__dg04_diagnostic_persistence.sql \
            db/migrations/V004__d05_pending_capture_v2.sql \
            deploy/db/grant-runtime.sh \
            deploy/db/seed-tls-day1-golden.sql \
            apps/api/src/trial/pre-ticket-trial-owner-flow.ts \
            apps/api/src/trial/tls-day1-golden-flow.ts \
            apps/api/src/trial/tls-day2-arc001-flow.ts \
            apps/api/src/trial/tls-day3-arc002-flow.ts \
            package-lock.json
          npm run verify:boundaries
          npm run typecheck
          npm run build
          npm run test:contracts
          # The frozen MCR064 anchor already has 21 canonical routes while the
          # legacy ui-routes integration assertion still expects 19. Do not
          # convert that pre-existing harness defect into candidate failure.
          # Run the bounded owner/runtime integrations here; UX-RS-07 is
          # exercised against PostgreSQL in the executable proof below.
          node --experimental-strip-types --test \
            tests/integration/core-d02.integration.test.ts \
            tests/integration/runtime-d04.integration.test.ts \
            tests/integration/d05-pending-capture.integration.test.ts
          npm run test:adverse
      - name: Disposable PostgreSQL 17 least-privilege setup
        run: |
          set -euo pipefail
          db=appts_mcr064_arc011
          pgcid="$(docker ps --filter ancestor=postgres:17.11-bookworm -q | head -n1)"
          test -n "$pgcid"
          PGPASSWORD=mcr064-superuser-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<SQL
          CREATE ROLE appts_migration LOGIN PASSWORD 'mcr064-migration-local-only' NOSUPERUSER INHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE appts_runtime LOGIN PASSWORD 'mcr064-runtime-local-only' NOSUPERUSER NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE ${db} OWNER appts_migration;
          SQL
          for f in db/migrations/V001__cf01_core_schema.sql db/migrations/V002__cf01_runtime_and_exchange_schema.sql db/migrations/V003__dg04_diagnostic_persistence.sql db/migrations/V004__d05_pending_capture_v2.sql; do
            PGPASSWORD=mcr064-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$f"
          done
          docker cp deploy/db "$pgcid:/tmp/mcr064-db"
          docker exec "$pgcid" chmod +x /tmp/mcr064-db/grant-runtime.sh
          docker exec \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE="$db" \
            -e PGUSER=appts_migration -e PGPASSWORD=mcr064-migration-local-only \
            -e APPTS_DB_NAME="$db" -e APPTS_MIGRATION_ROLE=appts_migration \
            -e APPTS_RUNTIME_ROLE=appts_runtime \
            -e 'APPTS_STAGING_LABEL=STAGING SIMULATION / NON-PRODUCTION' \
            -e APPTS_DISPOSABLE_DATABASE=true -e APPTS_DB_NETWORK_MODE=LOOPBACK \
            "$pgcid" /tmp/mcr064-db/grant-runtime.sh
          PGPASSWORD=mcr064-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < deploy/db/seed-tls-day1-golden.sql
          test "$(PGPASSWORD=mcr064-runtime-local-only psql -X -At -h 127.0.0.1 -U appts_runtime -d "$db" -c 'select current_user')" = appts_runtime
      - name: D05 to D04 accepted-ingress executable proof
        env:
          DATABASE_URL: postgresql://appts_runtime:mcr064-runtime-local-only@127.0.0.1:5432/appts_mcr064_arc011
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcr064-evidence
          node tools/verify-mcr064-arc011.mjs | tee /tmp/mcr064-evidence/arc011-proof.json
          ticket_id="$(python3 -c 'import json; print(json.load(open("/tmp/mcr064-evidence/arc011-proof.json"))["ticket_id"])')"
          qer_id="$(python3 -c 'import json; print(json.load(open("/tmp/mcr064-evidence/arc011-proof.json"))["qer_id"])')"
          PGPASSWORD=mcr064-migration-local-only psql -X -At -h 127.0.0.1 -U appts_migration -d appts_mcr064_arc011 <<SQL | tee /tmp/mcr064-evidence/durable-after-process-exit.txt
          SELECT 'runtime_ticket='||count(*) FROM appts.runtime_ticket WHERE ticket_id='${ticket_id}'::uuid AND current_state_code='ACCEPTED' AND aggregate_version=0;
          SELECT 'qer='||count(*) FROM appts.qualified_external_record WHERE qualified_external_record_id='${qer_id}'::uuid;
          SELECT 'dependency='||count(*) FROM appts.dependency_context WHERE ticket_id='${ticket_id}'::uuid AND evidence_ref='${qer_id}'::uuid;
          SELECT 'waiting='||count(*) FROM appts.waiting_interval WHERE ticket_id='${ticket_id}'::uuid AND ended_at IS NULL;
          SELECT 'blocker='||count(*) FROM appts.runtime_blocker WHERE ticket_id='${ticket_id}'::uuid AND cleared_at IS NULL;
          SELECT 'escalation='||count(*) FROM appts.runtime_escalation WHERE ticket_id='${ticket_id}'::uuid AND status_ref='OPEN';
          SELECT 'responsibility_change='||count(*) FROM appts.responsibility_change WHERE ticket_id='${ticket_id}'::uuid;
          SQL
          for expected in runtime_ticket=1 qer=1 dependency=1 waiting=1 blocker=1 escalation=1 responsibility_change=0; do grep -Fxq "$expected" /tmp/mcr064-evidence/durable-after-process-exit.txt; done
      - name: Upload immutable verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcr064-arc011-ai-verification-evidence
          path: /tmp/mcr064-evidence
          if-no-files-found: error
