name: CODEX051 final v2
on:
  pull_request:
    branches: [experiment/independent-restore-deploy]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: codex051-superuser-local-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24.19.0}
      - name: Materialize exact candidate and guard frozen baseline
        shell: bash
        run: |
          set -euo pipefail
          accepted=e09dc82af348ed61ebeb802a346780173b42b973
          candidate=8d46c40c55c5539cea9d5c85ff1d8b36bfce3288
          git fetch --no-tags origin mcr/codex051-day1-golden-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$candidate"
          mapfile -t changed < <(git diff --name-only "$accepted" "$candidate")
          printf '%s\n' "${changed[@]}" | tee /tmp/codex051-changed.txt
          test "${#changed[@]}" -eq 8
          for path in "${changed[@]}"; do
            case "$path" in
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/dep-bootstrap.ts|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/projections/trial-projection-port.ts|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/tls-day1-golden-flow.ts|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/tsconfig.json|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/web/src/views/TicketConsoleView.tsx|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/web/src/views/WorkQueueView.tsx|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/deploy/db/seed-tls-day1-golden.sql|\
              DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/packages/runtime-d04/package.json) ;;
              *) echo "STOP unexpected candidate path: $path"; exit 1 ;;
            esac
          done
          git diff --exit-code "$accepted" "$candidate" -- \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/package-lock.json \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/db/migrations/V001__cf01_core_schema.sql \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/db/migrations/V002__cf01_runtime_and_exchange_schema.sql \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/db/migrations/V003__dg04_diagnostic_persistence.sql \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/db/migrations/V004__d05_pending_capture_v2.sql \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/deploy/db/grant-runtime.sh \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/pre-ticket-trial-owner-flow.ts
          git checkout "$candidate" -- "${changed[@]}"
          root=DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          test "$(sha256sum "$root/package-lock.json" | awk '{print $1}')" = 60f1e9e7e0ba9993c9340af9344790440298f9e2fe861ed50f50c14f2cc7170c
          test "$(sha256sum "$root/apps/api/src/trial/pre-ticket-trial-owner-flow.ts" | awk '{print $1}')" = fa6a57a4bb50fdd63884d86ce43fe2b18137c3c0b0554b2b990d57d2771c6106
          test "$(sha256sum "$root/deploy/db/grant-runtime.sh" | awk '{print $1}')" = 41b48d45bb88c7e510a88235840b8601658d08e5347e9f7660419f7efc321f0f
          echo CODEX051_DELTA_GUARD=PASS
      - name: Full source regression
        shell: bash
        run: |
          set -euo pipefail
          cd DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          npm install --global npm@11.17.0
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:boundaries
          npm run typecheck
          npm run build
          npm run test:contracts
          npm run test:integration
          npm run test:dg04
          npm run test:adverse
          npm run test:unit
          npm run test:nfr
          echo CODEX051_SOURCE_REGRESSION=PASS
      - name: Prepare accepted PostgreSQL 17 least-privilege split
        shell: bash
        run: |
          set -euo pipefail
          root=DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          db=appts_dep001_codex051_finalv2
          pgcid="$(docker ps --filter ancestor=postgres:17.11-bookworm -q | head -n1)"; test -n "$pgcid"
          PGPASSWORD=codex051-superuser-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<SQL
          CREATE ROLE appts_migration LOGIN PASSWORD 'codex051-migration-local-only' NOSUPERUSER INHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE appts_runtime LOGIN PASSWORD 'codex051-runtime-local-only' NOSUPERUSER NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE ${db} OWNER appts_migration;
          SQL
          for f in "$root"/db/migrations/V001__cf01_core_schema.sql "$root"/db/migrations/V002__cf01_runtime_and_exchange_schema.sql "$root"/db/migrations/V003__dg04_diagnostic_persistence.sql "$root"/db/migrations/V004__d05_pending_capture_v2.sql; do
            PGPASSWORD=codex051-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$f"
          done
          docker cp "$root/deploy/db" "$pgcid:/tmp/codex051-db"
          docker exec "$pgcid" chmod +x /tmp/codex051-db/grant-runtime.sh
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE="$db" -e PGUSER=appts_migration -e PGPASSWORD=codex051-migration-local-only -e APPTS_DB_NAME="$db" -e APPTS_MIGRATION_ROLE=appts_migration -e APPTS_RUNTIME_ROLE=appts_runtime -e 'APPTS_STAGING_LABEL=STAGING SIMULATION / NON-PRODUCTION' -e APPTS_DISPOSABLE_DATABASE=true -e APPTS_DB_NETWORK_MODE=LOOPBACK "$pgcid" /tmp/codex051-db/grant-runtime.sh
          set +e
          PGPASSWORD=codex051-runtime-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_runtime -d "$db" < "$root/deploy/db/seed-tls-day1-golden.sql" >/tmp/runtime-seed.out 2>/tmp/runtime-seed.err
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'static Trial binding seed must not run as appts_runtime' /tmp/runtime-seed.err
          PGPASSWORD=codex051-migration-local-only psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U appts_migration -d "$db" < "$root/deploy/db/seed-tls-day1-golden.sql"
          test "$(PGPASSWORD=codex051-runtime-local-only psql -X -At -h 127.0.0.1 -U appts_runtime -d "$db" -c 'select current_user')" = appts_runtime
          echo CODEX051_RUNTIME_SPLIT=PASS
      - name: Verify negative and positive next-consumer paths
        shell: bash
        env:
          DATABASE_URL: postgresql://appts_runtime:codex051-runtime-local-only@127.0.0.1:5432/appts_dep001_codex051_finalv2
          API_LISTEN_PORT: 8080
          APPTS_TRIAL_DISCLOSURE_LABEL_REF: 6f79da70-412f-469e-bcf7-f544f81b8aa7
        run: |
          set -euo pipefail
          cd DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          node apps/api/dist/dep-bootstrap.js >/tmp/api.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/api.log || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null && break || sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = '{"status":"ok"}'
          test "$(curl -fsS http://127.0.0.1:8080/readyz)" = '{"status":"ready"}'
          negative='{"intent_contract_ref":"APPTS.CORE.D01.PRETICKET_ADMISSION.SUBMISSION / 1.0.0","payload":{"messageId":"51050000-0000-4000-8000-000000000001","idempotencyKey":"51050000-0000-4000-8000-000000000002","correlationId":"51050000-0000-4000-8000-000000000003","trialContext":"TD-PRE-001"}}'
          curl -fsS -H 'content-type: application/json' -d "$negative" http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/negative.json
          grep -q 'HOLD_AS_PRE_TICKET' /tmp/negative.json
          test "$(PGPASSWORD=codex051-migration-local-only psql -X -At -h 127.0.0.1 -U appts_migration -d appts_dep001_codex051_finalv2 -c 'select count(*) from appts.runtime_ticket')" = 0
          positive='{"intent_contract_ref":"APPTS.CORE.D01.PRETICKET_ADMISSION.SUBMISSION / 1.0.0","payload":{"messageId":"51030000-0000-4000-8000-000000000001","idempotencyKey":"51030000-0000-4000-8000-000000000002","correlationId":"51030000-0000-4000-8000-000000000003","trialContext":"TLS-DAY1-GOLDEN"}}'
          curl -fsS -H 'content-type: application/json' -d "$positive" http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/positive.json
          ticket=$(node -e "const x=require('/tmp/positive.json');if(x.disposition!=='CREATED'||x.assessmentResult!=='ACCEPTABLE'||x.decision!=='ACCEPTED_FOR_FORMATION'||x.state!=='ACCEPTED'||x.aggregateVersion!==0)process.exit(2);process.stdout.write(x.ticketId)")
          curl -fsS -H 'content-type: application/json' -d "$positive" http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/replay.json
          TICKET="$ticket" node -e "const x=require('/tmp/replay.json');if(x.disposition!=='IDEMPOTENT_REPLAY'||x.ticketId!==process.env.TICKET)process.exit(2)"
          changed='{"intent_contract_ref":"APPTS.CORE.D01.PRETICKET_ADMISSION.SUBMISSION / 1.0.0","payload":{"messageId":"51030000-0000-4000-8000-000000000009","idempotencyKey":"51030000-0000-4000-8000-000000000002","correlationId":"51030000-0000-4000-8000-000000000003","trialContext":"TLS-DAY1-GOLDEN"}}'
          curl -fsS -H 'content-type: application/json' -d "$changed" http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/conflict.json
          TICKET="$ticket" node -e "const x=require('/tmp/conflict.json');if(x.disposition!=='CONFLICT_HOLD'||x.ticketId!==process.env.TICKET)process.exit(2)"
          curl -fsS http://127.0.0.1:8080/api/v1/ui/work-queue | tee /tmp/work.json
          TICKET="$ticket" node -e "const x=require('/tmp/work.json');if(!x.data.tickets.some(t=>t.ticket_id===process.env.TICKET&&t.current_state_code==='ACCEPTED'))process.exit(2)"
          curl -fsS "http://127.0.0.1:8080/api/v1/ui/tickets/$ticket" | tee /tmp/before.json
          TICKET="$ticket" node -e "const x=require('/tmp/before.json'),d=x.data;if(d.current_state_code!=='ACCEPTED'||d.aggregate_version!==0||d.holder_ref!=='51010000-0000-4000-8000-00000000000a'||d.role_assignment_ref!=='51010000-0000-4000-8000-00000000000b'||d.authority_currentness_ref!=='CURRENT'||d.gate_currentness_ref!=='CURRENT'||JSON.stringify(d.available_actions)!=='[\"ACTIVATE\"]')process.exit(2)"
          source_version=$(node -e "const x=require('/tmp/before.json');process.stdout.write(x.source_version_set_ref)")
          intent_time=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          node - "$ticket" "$source_version" "$intent_time" > /tmp/action.json <<'NODE'
          const [ticket,sourceVersion,intentTime]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({intent_contract_ref:"INT-RUN-TD-05",payload:{action_intent_id:"51040000-0000-4000-8000-000000000001",ticket_id:ticket,actor_ref:"51010000-0000-4000-8000-00000000000a",role_assignment_ref:"51010000-0000-4000-8000-00000000000b",requested_action_class:"ACTIVATE",presented_source_version_ref:sourceVersion,expected_aggregate_version:0,intent_time:intentTime}}));
          NODE
          curl -fsS -H 'content-type: application/json' --data-binary @/tmp/action.json http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/action-result.json
          node -e "const x=require('/tmp/action-result.json');if(x.result!=='EFFECT_APPLIED'||x.durable!==true||x.state!=='ACTIVE'||x.aggregateVersion!==1)process.exit(2)"
          curl -fsS "http://127.0.0.1:8080/api/v1/ui/tickets/$ticket" | tee /tmp/after.json
          node -e "const x=require('/tmp/after.json'),d=x.data;if(d.current_state_code!=='ACTIVE'||d.aggregate_version!==1||d.available_actions.length!==0||d.restriction_profile_ref!=='POST_ACTIVATION_REFRESH_REQUIRED')process.exit(2)"
          curl -fsS -H 'content-type: application/json' --data-binary @/tmp/action.json http://127.0.0.1:8080/api/v1/ui/intents | tee /tmp/action-replay.json
          node -e "const x=require('/tmp/action-replay.json');if(x.result!=='EFFECT_APPLIED'||x.state!=='ACTIVE'||x.aggregateVersion!==1)process.exit(2)"
          counts=$(PGPASSWORD=codex051-migration-local-only psql -X -At -F '|' -h 127.0.0.1 -U appts_migration -d appts_dep001_codex051_finalv2 -c "SELECT (SELECT count(*) FROM appts.ticket_identity),(SELECT count(*) FROM appts.ticket_formation_record),(SELECT count(*) FROM appts.runtime_ticket WHERE current_state_code='ACTIVE' AND aggregate_version=1),(SELECT count(*) FROM appts.action_intent),(SELECT count(*) FROM appts.lifecycle_effect_request),(SELECT count(*) FROM appts.lifecycle_effect_result),(SELECT count(*) FROM appts.runtime_state_transition),(SELECT count(*) FROM appts.intake_decision WHERE decision_code='ACCEPTED_FOR_FORMATION');")
          echo day1_counts=$counts
          test "$counts" = '1|1|1|1|1|1|1|1'
          echo CODEX051_NEXT_CONSUMER_GATE=PASS
      - name: Build controlled DT transfer
        shell: bash
        run: |
          set -euo pipefail
          accepted=e09dc82af348ed61ebeb802a346780173b42b973
          candidate=8d46c40c55c5539cea9d5c85ff1d8b36bfce3288
          pkg=out/CODEX051_DT_TRANSFER_v1.0_CONTROLLED
          mkdir -p "$pkg/overlay"
          cp /tmp/codex051-changed.txt "$pkg/CHANGED_FILES.txt"
          while IFS= read -r path; do mkdir -p "$pkg/overlay/$(dirname "$path")"; cp "$path" "$pkg/overlay/$path"; done < "$pkg/CHANGED_FILES.txt"
          git diff "$accepted" "$candidate" -- $(cat "$pkg/CHANGED_FILES.txt") > "$pkg/CODEX051.patch"
          printf '# CODEX051 DT Transfer v1.0 CONTROLLED\nAuthority: MCR-to-CODEX-051\nAccepted base: %s\nCandidate: %s\nBuild Pack remains frozen; Production/UAT/real data not authorized.\n' "$accepted" "$candidate" > "$pkg/README.md"
          cat > "$pkg/APPLY.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          target="${1:-.}"; here="$(cd "$(dirname "$0")" && pwd)"; root=DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001
          test "$(sha256sum "$target/$root/package-lock.json" | awk '{print $1}')" = 60f1e9e7e0ba9993c9340af9344790440298f9e2fe861ed50f50c14f2cc7170c
          test "$(sha256sum "$target/$root/apps/api/src/trial/pre-ticket-trial-owner-flow.ts" | awk '{print $1}')" = fa6a57a4bb50fdd63884d86ce43fe2b18137c3c0b0554b2b990d57d2771c6106
          test "$(sha256sum "$target/$root/deploy/db/grant-runtime.sh" | awk '{print $1}')" = 41b48d45bb88c7e510a88235840b8601658d08e5347e9f7660419f7efc321f0f
          while IFS= read -r path; do mkdir -p "$target/$(dirname "$path")"; cp "$here/overlay/$path" "$target/$path"; done < "$here/CHANGED_FILES.txt"
          EOF
          chmod +x "$pkg/APPLY.sh"
          cat > "$pkg/APPLY_AND_VERIFY.md" <<'EOF'
          Apply only to the current accepted RESTORE_SERVICE execution baseline; do not mutate the frozen Build Pack. Run APPLY.sh, then architecture/typecheck/build/contracts/integration/DG04/adverse/unit/NFR verification. Apply unchanged V001-V004 and accepted grant-runtime with migration identity. Run the TLS Day-1 seed only with migration/deployment identity; it must fail under appts_runtime. Start API with accepted least-privilege appts_runtime. Verify TD-PRE-001 remains HOLD_AS_PRE_TICKET with zero Ticket, then TLS-DAY1-GOLDEN creates ACCEPTED v0 Ticket visible in Work Queue/Ticket Console with current Role/authority/gate and ACTIVATE; invoke INT-RUN-TD-05 and verify durable ACTIVE v1 and replay stability.
          EOF
          cat > "$pkg/GOLDEN_PATH_TRACE_MATRIX.md" <<'EOF'
          | Step | Result |
          |---|---|
          | Valid governed intake | PASS |
          | ACCEPTABLE / ACCEPTED_FOR_FORMATION | PASS |
          | Durable Ticket identity / ACCEPTED v0 | PASS |
          | Work Queue | PASS |
          | Ticket Console | PASS |
          | Current Role / authority / gate | PASS |
          | ACTIVATE available | PASS |
          | ACTIVATE invocation through HTTP | PASS |
          | Durable ACTIVE v1 + refresh + replay stability | PASS |
          EOF
          cat > "$pkg/VERIFICATION_SUMMARY.md" <<'EOF'
          First break: accepted HTTP Trial composition had only the TD-PRE-001 negative/incomplete owner-flow and no positive ACCEPTED_FOR_FORMATION -> Ticket formation/runtime composition path. Classification: primary missing technical composition/wiring; secondary missing controlled Trial runtime Role/authority/gate instance binding and discoverability; not missing Product semantics, schema meaning, or security-policy authority. Producer next-consumer gate is proven on disposable non-production PostgreSQL 17 through real HTTP using actual least-privilege appts_runtime. Current deployment still requires DT apply/readback verification.
          EOF
          node - "$pkg" "$accepted" "$candidate" <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');const [pkg,accepted,candidate]=process.argv.slice(2);const changed=fs.readFileSync(path.join(pkg,'CHANGED_FILES.txt'),'utf8').trim().split(/\r?\n/);const files=changed.map(p=>({path:p,sha256:crypto.createHash('sha256').update(fs.readFileSync(path.join(pkg,'overlay',p))).digest('hex')}));fs.writeFileSync(path.join(pkg,'MANIFEST.json'),JSON.stringify({identity:'CODEX051_DT_TRANSFER_v1.0_CONTROLLED',authority:'MCR-to-CODEX-051',accepted_base:accepted,candidate_commit:candidate,changed_file_count:files.length,files},null,2)+'\n');
          NODE
          (cd "$pkg" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          echo CODEX051_TRANSFER_BUILD=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: CODEX051_DT_TRANSFER_v1.0_CONTROLLED
          path: out/CODEX051_DT_TRANSFER_v1.0_CONTROLLED
          if-no-files-found: error
          retention-days: 30
