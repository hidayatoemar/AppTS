name: DT TLS Day-2 read-only finalizer

on:
  push:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - INDEPENDENT_DEPLOYMENT/DAY2_FINALIZE_REQUEST

permissions:
  contents: write
  actions: read

concurrency:
  group: dt-tls-day2-finalize-readonly
  cancel-in-progress: false

jobs:
  finalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout controlled DT branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate finalizer request and script syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < INDEPENDENT_DEPLOYMENT/DAY2_FINALIZE_REQUEST)" = 'MCR_TO_DT_016 READ_ONLY_FINALIZER'
          bash -n INDEPENDENT_DEPLOYMENT/scripts/tls-day2-finalize-readonly.sh
          echo 'REQUEST_VALIDATION=PASS' >> "$GITHUB_ENV"

      - name: Validate target bindings
        shell: bash
        env:
          INDEP_HOST: ${{ secrets.INDEP_HOST }}
          INDEP_USER: ${{ secrets.INDEP_USER }}
          INDEP_SSH_PRIVATE_KEY: ${{ secrets.INDEP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$INDEP_HOST"
          test -n "$INDEP_USER"
          test -n "$INDEP_SSH_PRIVATE_KEY"
          echo 'SECRET_BINDINGS=PASS' >> "$GITHUB_ENV"

      - name: Prepare ephemeral SSH
        shell: bash
        env:
          INDEP_HOST: ${{ secrets.INDEP_HOST }}
          INDEP_SSH_PRIVATE_KEY: ${{ secrets.INDEP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$INDEP_SSH_PRIVATE_KEY" > ~/.ssh/independent_deploy_key
          chmod 600 ~/.ssh/independent_deploy_key
          ssh-keyscan -H "$INDEP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'TARGET_BINDING_PREPARED=PASS' >> "$GITHUB_ENV"

      - name: Execute read-only finalizer
        shell: bash
        env:
          INDEP_HOST: ${{ secrets.INDEP_HOST }}
          INDEP_USER: ${{ secrets.INDEP_USER }}
        run: |
          set -euo pipefail
          bash INDEPENDENT_DEPLOYMENT/scripts/tls-day2-finalize-readonly.sh 2>&1 | tee INDEPENDENT_DEPLOYMENT/evidence/day2-finalizer-${GITHUB_RUN_ID}.txt
          echo 'ACTION_EXECUTION=PASS' >> "$GITHUB_ENV"

      - name: Upload finalizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-restore-day2-finalizer-${{ github.run_id }}
          path: INDEPENDENT_DEPLOYMENT/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish safe finalizer pointer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p INDEPENDENT_DEPLOYMENT/evidence
          cat > INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY2_FINALIZER_RUN.md <<EOF
          # Independent Deployment Day-2 Finalizer Last Run

          run_id: ${GITHUB_RUN_ID}
          trigger_commit: ${GITHUB_SHA}
          job_status: ${{ job.status }}
          request_validation: ${REQUEST_VALIDATION:-NOT_REACHED}
          secret_bindings: ${SECRET_BINDINGS:-NOT_REACHED}
          target_binding_prepared: ${TARGET_BINDING_PREPARED:-NOT_REACHED}
          action_execution: ${ACTION_EXECUTION:-NOT_REACHED}
          recorded_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          No secret values are written to this evidence file.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY2_FINALIZER_RUN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(experiment): record Day-2 finalizer evidence'
          git push origin HEAD:refs/heads/experiment/independent-restore-deploy
