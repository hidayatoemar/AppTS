name: DT Day-3 MCR-020 ingress ACME diagnostic

on:
  push:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - INDEPENDENT_DEPLOYMENT/DAY3_EDGE_DIAG_REQUEST_MCR020

permissions:
  contents: write

jobs:
  diagnose-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INDEP_HOST: ${{ secrets.INDEP_HOST }}
      INDEP_USER: ${{ secrets.INDEP_USER }}
      INDEP_SSH_PRIVATE_KEY: ${{ secrets.INDEP_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate authority gates and target
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < INDEPENDENT_DEPLOYMENT/DAY3_EDGE_DIAG_REQUEST_MCR020)" = 'MCR_TO_DT_020 CONTROLLED_INGRESS_ACME_DIAGNOSTIC'
          grep -Fxq 'authentication_gate: PASS' INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_AUTH_FINALIZER_RUN.md
          grep -Fxq 'dns_gate: PASS' INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_DNS_RUN.md
          test -n "$INDEP_HOST"; test -n "$INDEP_USER"; test -n "$INDEP_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$INDEP_SSH_PRIVATE_KEY" > ~/.ssh/k; chmod 600 ~/.ssh/k
          ssh-keyscan -H "$INDEP_HOST" >> ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
      - name: Start temporary controlled edge and diagnose
        shell: bash
        run: |
          set -euo pipefail
          OUT=INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_EDGE_DIAGNOSTIC.txt
          : > "$OUT"
          ssh -i ~/.ssh/k -o BatchMode=yes "${INDEP_USER}@${INDEP_HOST}" 'bash -s' <<'REMOTE' | tee -a "$OUT"
          set -euo pipefail
          echo 'phase=host_precheck'
          printf 'api_health='; curl -fsS http://127.0.0.1:8080/healthz; echo
          echo "firewalld_active=$((sudo firewall-cmd --state >/dev/null 2>&1 && echo yes) || echo no)"
          if sudo firewall-cmd --state >/dev/null 2>&1; then
            sudo firewall-cmd --permanent --add-service=http >/dev/null
            sudo firewall-cmd --permanent --add-service=https >/dev/null
            sudo firewall-cmd --reload >/dev/null
            echo 'firewalld_http_https=ENABLED'
          else
            echo 'firewalld_http_https=NOT_APPLICABLE'
          fi
          sudo test -s /etc/appts-independent/Caddyfile
          sudo docker rm -f appts-independent-public-edge >/dev/null 2>&1 || true
          sudo docker run -d --name appts-independent-public-edge --network host \
            -v /etc/appts-independent/Caddyfile:/etc/caddy/Caddyfile:ro \
            -v appts-independent-caddy-data:/data \
            -v appts-independent-caddy-config:/config \
            caddy:2-alpine >/dev/null
          sleep 8
          echo 'phase=host_edge_started'
          sudo docker inspect appts-independent-public-edge --format 'caddy_state={{.State.Status}}'
          sudo ss -H -lnt | awk '$4 ~ /:80$|:443$/ {print "listener=" $4}'
          echo "local_http_status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: dev.appts.cifo.id' http://127.0.0.1/login || true)"
          echo '== caddy_log_sanitized =='
          sudo docker logs --tail 100 appts-independent-public-edge 2>&1 | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/REDACTED_IP/g'
          REMOTE
          {
            echo 'phase=external_probe'
            for p in 80 443 8080 5432; do
              if timeout 4 bash -c "</dev/tcp/dev.appts.cifo.id/${p}" >/dev/null 2>&1; then echo "external_tcp_${p}=OPEN"; else echo "external_tcp_${p}=CLOSED_OR_FILTERED"; fi
            done
            echo "external_http_status=$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' http://dev.appts.cifo.id/login || true)"
            echo "external_https_status=$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' https://dev.appts.cifo.id/login || true)"
          } | tee -a "$OUT"
          ssh -i ~/.ssh/k -o BatchMode=yes "${INDEP_USER}@${INDEP_HOST}" \
            'sudo docker logs --tail 100 appts-independent-public-edge 2>&1 | sed -E "s/([0-9]{1,3}\\.){3}[0-9]{1,3}/REDACTED_IP/g"; sudo docker rm -f appts-independent-public-edge >/dev/null 2>&1 || true' \
            | sed '1i phase=caddy_post_external_probe' | tee -a "$OUT"
          echo "diagnostic_run_id=${GITHUB_RUN_ID}" >> "$OUT"
          echo 'edge_left_running=NO' >> "$OUT"
          echo 'secrets_disclosed=NO' >> "$OUT"
      - name: Publish sanitized ingress diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INDEPENDENT_DEPLOYMENT/evidence/LAST_DAY3_EDGE_DIAGNOSTIC.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(experiment): record MCR-020 ingress diagnostic'
          git push origin HEAD:refs/heads/experiment/independent-restore-deploy
