name: DT apply admitted CODEX049 transfer

on:
  push:
    branches:
      - experiment/independent-restore-deploy
    paths:
      - INDEPENDENT_DEPLOYMENT/APPLY049_REQUEST

permissions:
  contents: write
  actions: read

concurrency:
  group: dt-apply-codex049
  cancel-in-progress: false

jobs:
  apply-codex049:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated DT branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deliberate request and admitted lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < INDEPENDENT_DEPLOYMENT/APPLY049_REQUEST)" = "APPLY_CODEX049_ADMITTED_TRANSFER"
          git merge-base --is-ancestor 7a813276bf5e4d5e73a48cc6276141f3b9b4d0c5 HEAD
          git diff --quiet 7a813276bf5e4d5e73a48cc6276141f3b9b4d0c5 -- \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/pre-ticket-trial-owner-flow.ts \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/deploy/db/grant-runtime.sh \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/tests/dep001/idempotency-minimum-runtime-writer.test.mjs

      - name: Download accepted CODEX049 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/CODEX049_DT_TRANSFER_v1.0_CONTROLLED.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9460248041/zip"
          echo "1a8b6a65cdc565f1d02976841def8cec81024839f635a26a364d6f7b950b5aa3  $RUNNER_TEMP/CODEX049_DT_TRANSFER_v1.0_CONTROLLED.zip" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/codex049"
          mkdir -p "$RUNNER_TEMP/codex049"
          unzip -q "$RUNNER_TEMP/CODEX049_DT_TRANSFER_v1.0_CONTROLLED.zip" -d "$RUNNER_TEMP/codex049"
          (cd "$RUNNER_TEMP/codex049" && sha256sum -c SHA256SUMS)

      - name: Apply exact admitted three-file overlay
        shell: bash
        run: |
          set -euo pipefail
          rsync -a "$RUNNER_TEMP/codex049/overlay/" ./
          expected=$(printf '%s\n' \
            'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/pre-ticket-trial-owner-flow.ts' \
            'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/deploy/db/grant-runtime.sh' \
            'DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/tests/dep001/idempotency-minimum-runtime-writer.test.mjs' | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          git add -- \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/apps/api/src/trial/pre-ticket-trial-owner-flow.ts \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/deploy/db/grant-runtime.sh \
            DEPLOYMENT_WORKSPACE/APP-RESTORE-SERVICE-DEP-001/tests/dep001/idempotency-minimum-runtime-writer.test.mjs
          staged=$(git diff --cached --name-only | sort)
          test "$staged" = "$expected"

      - name: Commit exact admitted overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(experiment): apply admitted CODEX049 minimum runtime writer overlay'
          git push origin HEAD:refs/heads/experiment/independent-restore-deploy

      - name: Record transfer evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'CODEX049_TRANSFER_FILE_ID=1ITEOnJkPDIDn9ZlGPVEB_EktxYYDJW4w'
            echo 'CODEX049_TRANSFER_SIZE=14478'
            echo 'CODEX049_TRANSFER_SHA256=1a8b6a65cdc565f1d02976841def8cec81024839f635a26a364d6f7b950b5aa3'
            echo 'ACCEPTED_APPLICATION_BASE=7a813276bf5e4d5e73a48cc6276141f3b9b4d0c5'
            echo 'OVERLAY_FILE_COUNT=3'
            echo 'RESULT=PASS'
          } > "$RUNNER_TEMP/CODEX049_APPLICATION_EVIDENCE.txt"

      - name: Upload application evidence
        uses: actions/upload-artifact@v4
        with:
          name: dt-codex049-application-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/CODEX049_APPLICATION_EVIDENCE.txt
          retention-days: 30
